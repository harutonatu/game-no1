<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆびあそび">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>ゆびあそび</title>
<!-- デバッグ表示（?debug=1 のときだけ動く。読めなくてもゲームは動く） -->
<script src="common/debug.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: 見出しの下にゲームのカードを並べる。幅に応じて 1〜3 列（縦スクロールのみ） */
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #9aa1b8;
    --accent: #f0a43a;
    --accent-ink: #231705;
    --font-display: "Chakra Petch", "Hiragino Sans", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --font-text: "Hiragino Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; touch-action: pan-y; }
  body {
    margin: 0;
    min-height: 100vh;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow-x: hidden;
    overscroll-behavior: none;
    /* 縦スクロールは許可し、ダブルタップ拡大だけ止める */
    touch-action: pan-y;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .app {
    box-sizing: border-box;
    max-width: 1040px;
    margin: 0 auto;
    /* ノッチ・ホームバーに重ならないよう safe-area 分を空ける */
    padding-top: max(20px, env(safe-area-inset-top, 0px));
    padding-bottom: max(24px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .head { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
  .logo { width: 44px; height: 44px; border-radius: 10px; flex: 0 0 auto; box-shadow: 0 0 0 1px var(--line); }
  .head h1 { margin: 0; font-size: 30px; letter-spacing: 0.06em; line-height: 1.1; }
  .head p { margin: 2px 0 0; color: var(--muted); font-size: 12px; font-family: var(--font-text); }

  .games {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    /* iPhone 縦は1列、iPad 縦は2列、iPad 横は3列 */
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    gap: 12px;
  }
  .game {
    box-sizing: border-box;
    height: 100%;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 14px;
    padding: 12px 12px 12px 12px;
    border-radius: 16px;
    background: var(--panel);
    box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(0, 0, 0, 0.25);
    color: inherit;
    text-decoration: none;
    touch-action: manipulation;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
    transition: transform 80ms, filter 80ms;
  }
  .game:active { transform: translateY(1px) scale(0.99); filter: brightness(1.12); }
  .game:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .art {
    width: 84px;
    height: 84px;
    border-radius: 12px;
    background: var(--well);
    box-shadow: inset 0 0 0 2px var(--line);
    display: block;
  }
  .info { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .name { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: 0.03em; line-height: 1.25; }
  .desc { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; font-family: var(--font-text); }
  .best { display: flex; align-items: baseline; gap: 8px; margin-top: 2px; min-width: 0; }
  .best .label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  .best b {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 17px;
    color: var(--accent);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .best b.none { font-family: var(--font-text); font-size: 12px; font-weight: 500; color: var(--muted); }
  /* 長いベスト表示（bestWrap）：「…」で切らず、空白の所でだけ折り返す（iPhone SE 幅で「ほし 30 まで クリア」が欠けないように） */
  .best b.wrap { white-space: normal; word-break: keep-all; overflow-wrap: normal; overflow: visible; text-overflow: clip; line-height: 1.3; }
  /* 長い名前の切れ目（nameParts）。かたまりの中では折り返さず、かたまりの間でだけ折る */
  .name .np { display: inline-block; }
  .go { color: var(--muted); font-size: 22px; line-height: 1; padding-right: 2px; }

  .foot { margin: 24px 0 0; text-align: center; color: var(--muted); font-size: 12px; font-family: var(--font-text); line-height: 1.6; }

  .ver { margin: 6px 0 0; text-align: center; color: var(--muted); font-size: 12px; letter-spacing: 0.08em; font-family: var(--font-mono); line-height: 1.4; }

  /* iPhone SE など幅の狭い画面では絵を少し小さくする */
  @media (max-width: 360px) {
    .art { width: 68px; height: 68px; }
    .game { gap: 12px; }
    .name { font-size: 17px; }
  }
  @media (min-width: 700px) {
    .head h1 { font-size: 36px; }
    .games { gap: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .game { transition: none; } }
</style>
</head>
<body>

<main class="app">
  <header class="head">
    <img class="logo" src="icons/icon-192.png" alt="" width="44" height="44" draggable="false">
    <div>
      <h1>ゆびあそび</h1>
      <p>あそぶゲームをえらんでね</p>
    </div>
  </header>

  <ul class="games" id="games" aria-label="ゲーム一覧"></ul>

  <p class="foot">ホーム画面に追加すると、オフラインでも遊べます。</p>
  <p class="ver" id="ver" aria-label="バージョン"></p>
</main>

<script src="common/sfx.js"></script>
<script src="common/version.js"></script>
<script>
  // 版と更新日（common/version.js が唯一の元。メニューだけに出す）
  (function () {
    var v = self.YUBI_VERSION, el = document.getElementById("ver");
    if (v && el) el.textContent = v.version + "・" + v.date;
  })();
</script>
<script>
(() => {
  "use strict";

  // ===== ゲームの一覧 =====
  // 3本目以降はここに1行足すだけでメニューに並ぶ。
  //   name: ゲーム名 / desc: ひとこと説明 / url: ルートからの相対パス / best: ベストスコアの localStorage キー
  //   art: 下の ART にある絵の名前（省略すると頭文字のタイル）
  const GAMES = [
    { name: "ブロックパズル", desc: "落ちてくるブロックで横一列をそろえて消す", url: "games/blocks/", best: "blockpuzzle.best", art: "blocks" },
    { name: "ばいばいタイル", desc: "同じ数字をぶつけて合体、2048 を目指す", url: "games/2048/", best: "tile2048.best", art: "tiles" },
    { name: "キリトリ道場", desc: "飛んでくる的を指でなぞって切る。爆弾に注意", url: "games/kiritori/", best: "kiritori.best", art: "kiritori" },
    { name: "いろコード", desc: "4つの色の並びを推理する", url: "games/irocode/", stats: "irocode.stats", art: "code" },
    { name: "ゼンマイさんぽ", desc: "ネジを巻いて、崖の手前でぴたりと止める", url: "games/zenmai/", bestText: () => zenmaiBest(), art: "zenmai" },
    { name: "ピカッと早押し", desc: "ひかったら タップ！ いちばん はやいのは だれ？", url: "games/pikatto/", bestText: () => pikattoBest(), art: "pikatto" },
    { name: "ハシわたり", desc: "ながおしで くきを のばして、つぎの葉へ", url: "games/hashi/", best: "hashi.best", art: "hashi" },
    { name: "いろびん", desc: "いろみずを そろえて、どうぶつに とどけよう", url: "games/irobin/", bestText: () => irobinBest(), art: "irobin" },
    { name: "まとめてポン", desc: "おなじ いろを まとめて ポン！ たくさん けすほど たかいてん", url: "games/matomete/", bestText: () => matometeBest(), art: "matomete" },
    { name: "ミチビキ空港", desc: "ゆびで みちを かいて、おなじ いろの かっそうろへ", url: "games/michibiki/", bestText: () => michibikiBest(), art: "michibiki" },
    { name: "もくもくこうば", desc: "もりの きを きって、いたに して うろう。もくもく はたらく みんなを そだてよう", url: "games/seizai/", bestText: () => seizaiBest(), art: "seizai" },
    // 名前が長いので、折り返すときは nameParts の切れ目（「ちきゅうを守れ！」と「ほしくだき」の間）だけで折る（約束 §1.4・§10）
    { name: "ちきゅうを守れ！ほしくだき", nameParts: ["ちきゅうを守れ！", "ほしくだき"], desc: "ちきゅうに せまる ほしを、せんとうきが こわすよ。かけらで ぶきを つよく しよう", url: "games/asteroid/", bestText: () => asteroidBest(), art: "asteroid", bestWrap: true }
  ];

  // ===== 小さな絵（Canvas で描く。画像ファイルは使わない） =====
  const COLORS = {
    I: "#4cc9e0", O: "#f2cc4b", T: "#a77bf0", S: "#6cd17a",
    Z: "#ef6464", J: "#5b84f0", L: "#f29a4b"
  };
  // ブロックパズルと同じ立体感のあるブロック
  function drawBlock(ctx, x, y, s, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x + 1, y + 1, s - 2, s - 2);
    const b = Math.max(2, Math.round(s * 0.14));
    ctx.fillStyle = "rgba(255,255,255,0.32)";
    ctx.fillRect(x + 1, y + 1, s - 2, b);
    ctx.fillRect(x + 1, y + 1, b, s - 2);
    ctx.fillStyle = "rgba(0,0,0,0.28)";
    ctx.fillRect(x + 1, y + s - 1 - b, s - 2, b);
    ctx.fillRect(x + s - 1 - b, y + 1, b, s - 2);
  }
  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  const ART = {
    // 6×6 のマスに、積まれたブロックと落ちてくる T ブロック
    blocks(ctx, w, h) {
      const n = 6, s = Math.floor((Math.min(w, h) - 12) / n);
      const ox = Math.round((w - s * n) / 2), oy = Math.round((h - s * n) / 2);
      const cells = [
        "..TTT.",
        "...T..",
        "......",
        "J....L",
        "JJZZ.L",
        "SIIIIL"
      ];
      cells.forEach((row, y) => [...row].forEach((t, x) => {
        if (t !== ".") drawBlock(ctx, ox + x * s, oy + y * s, s, COLORS[t]);
      }));
    },
    // 2×2 の数字タイル（ばいばいタイルの .v2・.v8・.v64・.v2048 と同じ配色。2048 は光彩つき）
    tiles(ctx, w, h) {
      const tiles = [[2, "#32374e", "#ffffff"], [8, "#265ad5", "#ffffff"], [64, "#e873bd", "#0d111d"], [2048, "#fcd590", "#0d111d", true]];
      const gap = Math.round(w * 0.07), s = (Math.min(w, h) - gap * 3) / 2;
      tiles.forEach(([v, bg, fg, glow], i) => {
        const x = gap + (i % 2) * (s + gap), y = gap + Math.floor(i / 2) * (s + gap);
        if (glow) {
          // ゲーム内の box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(240,164,58,0.6) を、絵の大きさに合わせて描く
          ctx.save();
          ctx.shadowColor = "rgba(240, 164, 58, 0.6)";
          // shadowBlur は拡大率（devicePixelRatio）の影響を受けないため、拡大率を掛ける
          ctx.shadowBlur = Math.max(6, gap * 0.9) * (ctx.getTransform ? ctx.getTransform().a : 1);
          ctx.fillStyle = "#f0a43a";
          roundRect(ctx, x - 2, y - 2, s + 4, s + 4, s * 0.16 + 2);
          ctx.fill();
          ctx.restore();
        }
        ctx.fillStyle = bg;
        roundRect(ctx, x, y, s, s, s * 0.16);
        ctx.fill();
        ctx.fillStyle = fg;
        const digits = String(v).length;
        ctx.font = `700 ${Math.max(12, Math.round(s * (digits >= 4 ? 0.28 : digits >= 2 ? 0.4 : 0.48)))}px "JetBrains Mono", ui-monospace, Menlo, monospace`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(String(v), x + s / 2, y + s / 2 + 1);
      });
    },
    // 斜めに切られた巻藁と紙風船、光る切り筋（キリトリ道場の的と同じ色）
    kiritori(ctx, w, h) {
      const s = Math.min(w, h);
      // 紙風船（右上）
      const bx = w * 0.7, by = h * 0.3, br = s * 0.17;
      ctx.save();
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.clip();
      ["#e8574f", "#f3eee2", "#f2c14b", "#4f86d8", "#f3eee2", "#e8574f"].forEach((c, i) => {
        const a0 = -Math.PI / 2 + (i * Math.PI) / 6, a1 = a0 + Math.PI / 6;
        ctx.fillStyle = c;
        ctx.fillRect(bx + br * Math.sin(a0), by - br, br * (Math.sin(a1) - Math.sin(a0)) + 0.6, br * 2);
      });
      ctx.restore();
      // 巻藁（左下）：切り筋で上下にずれた2つ
      const ww = s * 0.26, hh = s * 0.52, x = w * 0.36 - ww / 2, y = h * 0.6 - hh / 2;
      const straw = (dy, top) => {
        ctx.save();
        ctx.beginPath();
        if (top) { ctx.moveTo(x - 4, y - 4); ctx.lineTo(x + ww + 4, y - 4); ctx.lineTo(x + ww + 4, y + hh * 0.38); ctx.lineTo(x - 4, y + hh * 0.58); }
        else { ctx.moveTo(x - 4, y + hh * 0.58); ctx.lineTo(x + ww + 4, y + hh * 0.38); ctx.lineTo(x + ww + 4, y + hh + 4); ctx.lineTo(x - 4, y + hh + 4); }
        ctx.closePath(); ctx.clip();
        ctx.translate(top ? -2 : 2, dy);
        const g = ctx.createLinearGradient(x, 0, x + ww, 0);
        g.addColorStop(0, "#b8893e"); g.addColorStop(0.45, "#e6c477"); g.addColorStop(1, "#a97b35");
        ctx.fillStyle = g; roundRect(ctx, x, y, ww, hh, ww * 0.3); ctx.fill();
        ctx.fillStyle = "#6b4626";
        ctx.fillRect(x, y + hh * 0.22, ww, hh * 0.07); ctx.fillRect(x, y + hh * 0.72, ww, hh * 0.07);
        ctx.restore();
      };
      straw(-3, true); straw(2, false);
      // 光る切り筋
      ctx.save();
      ctx.strokeStyle = "rgba(235,248,255,0.95)";
      ctx.lineCap = "round";
      ctx.shadowColor = "rgba(150,220,255,0.9)";
      ctx.shadowBlur = 6 * (ctx.getTransform ? ctx.getTransform().a : 1);
      ctx.lineWidth = Math.max(2, s * 0.035);
      ctx.beginPath(); ctx.moveTo(w * 0.1, h * 0.66); ctx.lineTo(w * 0.9, h * 0.38); ctx.stroke();
      ctx.restore();
    },
    // 色玉の並び（ゲームの6色）と、ヒントの ● ○
    code(ctx, w, h) {
      const cols = ["#e0524d", "#f2cc4b", "#4cae6a", "#4a86e8"];
      const r = Math.min(w, h) * 0.09, gap = r * 0.5;   // 4つ並べても枠からはみ出さない（幅の約 83%）
      const total = r * 2 * 4 + gap * 3, x0 = (w - total) / 2 + r, cy = h * 0.4;
      cols.forEach((c, i) => {
        ctx.beginPath(); ctx.arc(x0 + i * (r * 2 + gap), cy, r, 0, Math.PI * 2);
        ctx.fillStyle = c; ctx.fill();
        ctx.fillStyle = "rgba(255,255,255,0.35)";
        ctx.beginPath(); ctx.arc(x0 + i * (r * 2 + gap) - r * 0.3, cy - r * 0.3, r * 0.3, 0, Math.PI * 2); ctx.fill();
      });
      const hr = r * 0.5, hy = h * 0.72, hx = w / 2 - hr * 3.6;   // ヒント4つを中央にそろえる
      for (let i = 0; i < 4; i++) {
        ctx.beginPath(); ctx.arc(hx + i * hr * 2.4, hy, hr, 0, Math.PI * 2);
        if (i < 2) { ctx.fillStyle = "#f0a43a"; ctx.fill(); }
        else { ctx.lineWidth = 2; ctx.strokeStyle = "#f0a43a"; ctx.stroke(); }
      }
    },
    // ネジ（ダイヤル）とゼンマイ人形
    zenmai(ctx, w, h) {
      const u = Math.min(w, h);
      // 地面
      ctx.fillStyle = "#32374e";
      ctx.fillRect(u * 0.06, u * 0.84, u * 0.88, u * 0.06);
      // ネジ
      const cx = u * 0.3, cy = u * 0.4, r = u * 0.24;
      ctx.fillStyle = "#f0a43a";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#231705"; ctx.lineWidth = Math.max(2, u * 0.05); ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(cx - r * 0.6, cy - r * 0.35); ctx.lineTo(cx + r * 0.6, cy + r * 0.35); ctx.stroke();
      // 人形
      const dx = u * 0.68, dy = u * 0.84;
      ctx.fillStyle = "#4cc9e0";
      roundRect(ctx, dx - u * 0.1, dy - u * 0.3, u * 0.2, u * 0.22, u * 0.04); ctx.fill();
      ctx.fillStyle = "#f2cc4b";
      ctx.beginPath(); ctx.arc(dx, dy - u * 0.4, u * 0.1, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#231705";
      ctx.beginPath(); ctx.arc(dx + u * 0.03, dy - u * 0.41, u * 0.017, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#4cc9e0";
      ctx.fillRect(dx - u * 0.08, dy - u * 0.08, u * 0.06, u * 0.08);
      ctx.fillRect(dx + u * 0.02, dy - u * 0.08, u * 0.06, u * 0.08);
      // 背中の小さなゼンマイ
      ctx.strokeStyle = "#f0a43a"; ctx.lineWidth = Math.max(2, u * 0.03);
      ctx.beginPath(); ctx.arc(dx - u * 0.14, dy - u * 0.2, u * 0.04, 0, Math.PI * 2); ctx.stroke();
    },
    // 4色（赤・青・黄・緑）の角丸パネルと、中央にピカッと光る丸
    pikatto(ctx, w, h) {
      const colors = ["#e0524d", "#4a86e8", "#f2cc4b", "#4cae6a"];
      const gap = Math.round(Math.min(w, h) * 0.07);
      const sw = (w - gap * 3) / 2, sh = (h - gap * 3) / 2;
      // 4つのパネル（左上=赤、右上=青、左下=黄、右下=緑）
      for (let i = 0; i < 4; i++) {
        const x = gap + (i % 2) * (sw + gap);
        const y = gap + Math.floor(i / 2) * (sh + gap);
        ctx.fillStyle = colors[i];
        roundRect(ctx, x, y, sw, sh, Math.min(sw, sh) * 0.18);
        ctx.fill();
        // パネルの上面にハイライト
        ctx.fillStyle = "rgba(255,255,255,0.18)";
        roundRect(ctx, x + sw * 0.08, y + sh * 0.08, sw * 0.84, sh * 0.22, Math.min(sw, sh) * 0.1);
        ctx.fill();
      }
      // 中央のピカッ（白〜淡い黄の丸、周りに淡い光彩）
      const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.14;
      ctx.save();
      ctx.shadowColor = "rgba(255, 240, 160, 0.95)";
      ctx.shadowBlur = Math.max(8, r * 1.2) * (ctx.getTransform ? ctx.getTransform().a : 1);
      ctx.fillStyle = "#fff8c8";
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
      // 中央のコア（真っ白）
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); ctx.arc(cx - r * 0.2, cy - r * 0.2, r * 0.45, 0, Math.PI * 2); ctx.fill();
    },
    // 夜の池に、はすの葉2枚と倒れかけの草の茎、左の葉に空色のカエル「ケロ」（ゲームと同じ配色）
    hashi(ctx, w, h) {
      const u = Math.min(w, h);
      // 池（濃い青の角丸）

    // 上から見た滑走路2本（あか○は右向き・あお△は左向き。入り口に矢印）と、回り込んで矢印の向きから入る点線の道をたどる飛行機2機

    // 上から降りてくる、マス目の小惑星（いわ・てつ・こおり・きん。何マスか欠けて、かけらが飛ぶ）と、下から撃つ小さなロケット

        if (pat === "star") { ctx.fillStyle = "#fff6c8"; ctx.beginPath(); ctx.arc(px + s / 2, py + s / 2, s * 0.18, 0, Math.PI * 2); ctx.fill(); }
      }));
      // ひび（欠けかけのてつ）
      ctx.strokeStyle = "rgba(20,20,30,0.75)"; ctx.lineWidth = Math.max(0.8, s * 0.09);
      ctx.beginPath(); ctx.moveTo(gx + 5 * s + s * 0.2, gy + s * 1.2); ctx.lineTo(gx + 5 * s + s * 0.5, gy + s * 1.5); ctx.lineTo(gx + 5 * s + s * 0.4, gy + s * 1.85); ctx.stroke();
      // 飛び散ったかけら
      ctx.fillStyle = "#c9935f";
      [[0.66, 0.5, 0.035], [0.74, 0.44, 0.025], [0.58, 0.55, 0.022]].forEach(([x, y, r]) => ctx.fillRect(...P(x, y), u * r, u * r));
      // 弾（ロケットから小惑星へ）
      ctx.fillStyle = "#ffd36b";
      [[0.5, 0.6], [0.5, 0.52]].forEach(([x, y]) => { ctx.beginPath(); ctx.ellipse(...P(x, y), u * 0.014, u * 0.03, 0, 0, Math.PI * 2); ctx.fill(); });
      // ロケット（丸みのある胴・2枚の羽・後ろの炎。白とオレンジ）
      const [rx, ry] = P(0.5, 0.74), r = u * 0.06;
      ctx.fillStyle = "#ff9f3a";
      ctx.beginPath(); ctx.moveTo(rx - r * 0.45, ry + r * 1.0); ctx.lineTo(rx, ry + r * 1.9); ctx.lineTo(rx + r * 0.45, ry + r * 1.0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f07a2a";
      ctx.beginPath(); ctx.moveTo(rx - r * 0.5, ry + r * 0.1); ctx.lineTo(rx - r * 1.15, ry + r * 1.05); ctx.lineTo(rx - r * 0.45, ry + r * 0.9); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(rx + r * 0.5, ry + r * 0.1); ctx.lineTo(rx + r * 1.15, ry + r * 1.05); ctx.lineTo(rx + r * 0.45, ry + r * 0.9); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f4f6fb";
      ctx.beginPath(); ctx.ellipse(rx, ry, r * 0.55, r * 1.15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#2f6fb0";
      ctx.beginPath(); ctx.arc(rx, ry - r * 0.25, r * 0.24, 0, Math.PI * 2); ctx.fill();
    },
    // 絵が用意されていないゲーム用：頭文字のタイル
    fallback(ctx, w, h, game) {
      const m = Math.round(w * 0.12);
      ctx.fillStyle = "#f0a43a";
      roundRect(ctx, m, m, w - m * 2, h - m * 2, 10);
      ctx.fill();
      ctx.fillStyle = "#231705";
      ctx.font = `700 ${Math.max(12, Math.round(h * 0.4))}px "Hiragino Sans", system-ui, sans-serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText([...game.name][0] || "?", w / 2, h / 2 + 1);
    }
  };
  function paint(cv, game) {
    const w = cv.clientWidth || 84, h = cv.clientHeight || 84;
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    const ctx = cv.getContext("2d");
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    try { (ART[game.art] || ART.fallback)(ctx, w, h, game); } catch (e) { /* 絵が描けなくてもメニューは使える */ }
  }

  // ===== ベストスコア =====
  function readBest(key) {
    try {
      // 安全な非負の整数だけを受け付ける（壊れた値・Infinity・文字列は 0 扱い＝まだ記録なし）
      const raw = localStorage.getItem(key);
      const n = raw === null ? 0 : Number(raw);
      return Number.isSafeInteger(n) && n >= 0 ? n : 0;
    } catch (e) { return 0; }
  }

  // いろコードの最少回数：irocode.stats（JSON）の best が 1〜10 の整数のときだけ有効。それ以外は 0（記録なし）
  function readIroBest(key) {
    try {
      const raw = localStorage.getItem(key);
      if (raw === null) return 0;
      const o = JSON.parse(raw);
      const n = o && typeof o === "object" ? o.best : null;
      return Number.isInteger(n) && n >= 1 && n <= 10 ? n : 0;
    } catch (e) { return 0; }
  }

  // ゼンマイさんぽ：zenmai.progress（{stars:{id:0..3}, unlocked}）を検証して「★合計 N / 45」にする
  function zenmaiBest() {
    try {
      const raw = localStorage.getItem("zenmai.progress");
      if (raw === null) return "";
      const p = JSON.parse(raw);
      if (!p || typeof p !== "object" || !p.stars || typeof p.stars !== "object" || Array.isArray(p.stars)) return "";
      let sum = 0;
      for (let i = 1; i <= 15; i++) {
        const v = p.stars["z" + String(i).padStart(2, "0")];
        if (Number.isInteger(v) && v >= 1 && v <= 3) sum += v;
      }
      return sum > 0 ? "★合計 " + sum + " / 45" : "";
    } catch (e) { return ""; }
  }

  // ピカッと早押し：pikatto.bestSolo（ms、小さいほど良い）。整数で 50..5000 の範囲だけ有効、それ以外は空
  function pikattoBest() {
    try {
      const raw = localStorage.getItem("pikatto.bestSolo");
      if (raw === null) return "";
      const n = Number(raw);
      return Number.isInteger(n) && n >= 50 && n <= 5000 ? n + " ms" : "";
    } catch (e) { return ""; }
  }

  // いろびん：irobin.best（クリアした一番大きい面）。安全な整数で 1 以上のときだけ「N めん クリア」、それ以外は空
  function irobinBest() {
    try {
      const raw = localStorage.getItem("irobin.best");
      if (raw === null) return "";
      const n = Number(raw);
      return Number.isSafeInteger(n) && n >= 1 ? n + " めん クリア" : "";
    } catch (e) { return ""; }
  }

  // まとめてポン：matomete.best（ふつうの一番高い点数）。安全な整数で 1 以上のときだけ「N てん」、それ以外は空
  function matometeBest() {
    try {
      const raw = localStorage.getItem("matomete.best");
      if (raw === null) return "";
      const n = Number(raw);
      return Number.isSafeInteger(n) && n >= 1 ? n.toLocaleString() + " てん" : "";
    } catch (e) { return ""; }
  }

  // もくもくこうば：seizai.best（届いた段の最大。1〜4、エンディングで 5）。1〜4 の整数なら段の名前（例「BEST こうじょう」）、5 なら「クリア！」、それ以外は空。
  // 約束 §10 の例「こうば まで そだった」「みなと クリア！」は iPhone SE 幅（値の欄 120px、かなは 1 字 約 17px）で「…」に欠けるため短くした
  function seizaiBest() {
    try {
      const raw = localStorage.getItem("seizai.best");
      if (raw === null) return "";
      const n = Number(raw);
      if (n === 5) return "クリア！";
      return Number.isInteger(n) && n >= 1 && n <= 4 ? ["こや", "こうば", "こうじょう", "みなと"][n - 1] : "";
    } catch (e) { return ""; }
  }

  // ちきゅうを守れ！ほしくだき：asteroid.best（クリアした一番大きい星の番号）。数に直して 0〜9999 に丸めた整数が 1 以上なら「ほし N まで クリア」、
  // それ以外（読めない・数でない・Infinity・0 以下）は空（＝まだ記録なし）
  function asteroidBest() {
    try {
      const raw = localStorage.getItem("asteroid.best");
      if (raw === null || String(raw).trim() === "") return "";
      const x = Number(raw);
      if (!Number.isFinite(x)) return "";
      const n = Math.max(0, Math.min(9999, Math.floor(x)));
      return n >= 1 ? "ほし " + n + " まで クリア" : "";
    } catch (e) { return ""; }
  }

  // ミチビキ空港：michibiki.best（一番多い着陸数）。readBest と同じ決まりで読み、1 以上のときだけ「N き」（前の「Best」はカードの見出しが出す）、それ以外は空
  function michibikiBest() {
    const n = readBest("michibiki.best");
    return n >= 1 ? n.toLocaleString() + " き" : "";
  }

  // ===== 効果音（common/sfx.js、案A「木のおもちゃ箱」。設定はゲームと共通、メニューに切り替えボタンはない） =====
  let sfx = YubiSfx.create("menu");
  function soundOff() {
    try { return localStorage.getItem("blockpuzzle.sound") === "off"; } catch (e) { return false; }
  }

  // ===== 組み立て =====
  const list = document.getElementById("games");
  const rows = GAMES.map((game) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "game";
    a.href = game.url;
    a.draggable = false;
    const cv = document.createElement("canvas");
    cv.className = "art";
    cv.setAttribute("aria-hidden", "true");
    const info = document.createElement("div");
    info.className = "info";
    const name = document.createElement("h2");
    name.className = "name";
    if (game.nameParts) {
      // かたまりごとに span（inline-block）にして、切れ目の所でだけ折り返す。textContent は name と同じになる
      game.nameParts.forEach((part) => { const sp = document.createElement("span"); sp.className = "np"; sp.textContent = part; name.appendChild(sp); });
    } else name.textContent = game.name;
    const desc = document.createElement("p");
    desc.className = "desc";
    desc.textContent = game.desc;
    const best = document.createElement("div");
    best.className = "best";
    const label = document.createElement("span");
    label.className = "label";
    label.textContent = "Best";
    const val = document.createElement("b");
    if (game.bestWrap) val.classList.add("wrap");
    best.append(label, val);
    info.append(name, desc, best);
    const go = document.createElement("span");
    go.className = "go";
    go.setAttribute("aria-hidden", "true");
    go.textContent = "›";
    a.append(cv, info, go);
    li.appendChild(a);
    list.appendChild(li);
    // 押した瞬間に「コッ」と鳴らす（音は待たずにそのまま移動する）
    a.addEventListener("pointerdown", () => {
      // ゲーム側で切り替えて戻ってきたとき：設定がオフなら鳴らさない。オフで作った部品は音の装置を持たないので、オンに戻ったときだけ作り直す（装置は最大1つ）
      if (soundOff()) return;
      if (!sfx.on) sfx = YubiSfx.create("menu");
      sfx.unlock();
      sfx.play("tap");
    });
    return { game, a, cv, val };
  });

  function renderBest() {
    rows.forEach(({ game, a, val }) => {
      const text = game.bestText ? game.bestText() : (() => { const n = game.stats ? readIroBest(game.stats) : game.best ? readBest(game.best) : 0; return n ? (game.stats ? `最少 ${n} 回` : n.toLocaleString()) : ""; })();
      val.classList.toggle("none", !text);
      val.textContent = text || "まだ記録なし";
      a.setAttribute("aria-label", `${game.name}：${game.desc}。${game.bestText || game.stats ? "" : "ベスト "}${text || "まだ記録なし"}`);
    });
  }
  function paintAll() { rows.forEach(({ game, cv }) => paint(cv, game)); }

  renderBest();
  paintAll();
  // 数字の絵はフォントの読み込み後に描き直す
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(paintAll).catch(() => {});
  // ゲームから戻ったとき（戻るボタン・bfcache からの復帰を含む）にベストを更新する
  window.addEventListener("pageshow", renderBest);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) renderBest(); });

  // 長押しメニュー・iOS のピンチ拡大・ダブルタップ拡大を止める
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  ["gesturestart", "gesturechange", "gestureend"].forEach((type) => document.addEventListener(type, (e) => e.preventDefault(), { passive: false }));
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  // iOS Safari は user-scalable=no を無視するため、350ms 以内の2回目のタップ（スクロールではないもの）の touchend を止める。
  // 止めると click が送られないので、ゲームのカード（リンク）なら自分で押す。縦スクロールはそのまま
  let lastTapEnd = 0, tapStart = null;
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    tapStart = e.touches.length === 1 && t ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true, capture: true });
  document.addEventListener("touchend", (e) => {
    const t = e.changedTouches[0];
    const isTap = tapStart && t && e.touches.length === 0 && Math.hypot(t.clientX - tapStart.x, t.clientY - tapStart.y) < 12;
    if (!isTap) return;
    const now = performance.now();
    const quick = now - lastTapEnd < 350;
    lastTapEnd = now;
    if (!quick || !e.cancelable) return;
    e.preventDefault();
    const link = e.target.closest?.("a, button");
    if (link) link.click();
  }, { passive: false });
})();

// ホーム画面から起動したときにオフラインでも遊べるようにする（https か localhost のときだけ有効）
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => { /* 登録できなくてもメニューは使える */ });
  });
}
</script>
</body>
</html>
