<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆびあそび">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<title>キリトリ道場</title>
<!-- デバッグ表示（?debug=1 のときだけ動く。読めなくてもゲームは動く） -->
<script src="../../common/debug.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: 上に「← メニュー」・スコア欄・II・♪、その下を道場（遊ぶ場所）が埋める。
     縦持ちは上の段を2段（ボタン／スコア欄）、横持ちは1段にまとめて道場を広くとる */
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #9aa1b8;
    --accent: #f0a43a;
    --accent-ink: #231705;
    --danger: #ef6464;
    --font-display: "Chakra Petch", "Hiragino Sans", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  /* ダブルタップ拡大・ピンチ拡大を止める（iOS Safari は user-scalable=no を無視するため CSS と JS の両方で防ぐ） */
  html { overscroll-behavior: none; touch-action: none; }
  body {
    margin: 0;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    /* ノッチ・ホームバーに重ならないよう safe-area 分を空ける */
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    gap: 8px;
    max-width: 1100px;
    margin: 0 auto;
  }
  .hud {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "back . sys" "stats stats stats";
    gap: 8px;
    min-width: 0;
  }
  /* 「← メニュー」：ばいばいタイルと同じ表記・同じ見た目（枠つき、44×44px 以上） */
  .back {
    grid-area: back;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 14px "Hiragino Sans", system-ui, sans-serif;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .sys { grid-area: sys; display: flex; gap: 6px; }
  .tool {
    box-sizing: border-box;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 14px var(--font-mono);
    padding: 0;
    touch-action: manipulation;
  }
  .sound-btn { font-size: 17px; }
  .sound-btn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  .back:active, .tool:active { filter: brightness(1.3); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .stats { grid-area: stats; display: flex; gap: 8px; min-width: 0; }
  .box {
    box-sizing: border-box;
    min-height: 44px;
    background: var(--panel);
    border-radius: 10px;
    padding: 4px 10px 5px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 1px;
    min-width: 0;
    flex: 1 1 0;
  }
  .box.life { flex: 0 0 auto; }
  .label {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
    line-height: 12px;
  }
  .box b {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 19px;
    line-height: 22px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .box.score b { color: var(--accent); }
  /* ライフ：3つの丸。失った分は輪だけ残す */
  .lives { display: flex; gap: 5px; align-items: center; height: 22px; }
  .lives i { display: block; width: 13px; height: 13px; border-radius: 50%; background: var(--danger); box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25); }
  .lives i.lost { background: transparent; box-shadow: inset 0 0 0 2px var(--line); }
  .lives.hit { animation: hit 360ms ease-out 1; }
  @keyframes hit { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 50% { transform: translateX(4px); } 75% { transform: translateX(-2px); } }
  /* プレイ中にベストを上回った瞬間に1回だけ光らせる */
  .box.best.flash { animation: bestflash 900ms ease-out 1; }
  @keyframes bestflash {
    0% { box-shadow: 0 0 0 0 rgba(240, 164, 58, 0); }
    25% { box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(240, 164, 58, 0.55); }
    100% { box-shadow: 0 0 0 0 rgba(240, 164, 58, 0); }
  }

  /* 道場（遊ぶ場所）：ここでのスワイプで的を切る */
  .stage {
    position: relative;
    min-height: 0;
    min-width: 0;
    border-radius: 12px;
    overflow: hidden;
    background: var(--well);
    box-shadow: 0 0 0 2px var(--line);
    touch-action: none;
  }
  #bg, #field { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  @media (orientation: landscape) {
    .hud { grid-template-areas: "back stats sys"; }
    .stats { max-width: 560px; justify-self: center; width: 100%; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
    .box b { font-size: 17px; }
  }
  /* iPhone SE など幅の狭い縦画面では数字を少し小さく */
  @media (orientation: portrait) and (max-width: 360px) {
    .box { padding: 4px 8px 5px; }
    .box b { font-size: 17px; }
    .label { letter-spacing: 0.06em; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    /* カードが画面より高いときは縦にスクロールできるようにする（中央寄せは .card の margin:auto で行い、上が切れないようにする） */
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(13, 17, 29, 0.78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  /* 結果カードは背景を薄く・ぼかさず、最後の道場が見えるようにする */
  .overlay.soft { background: rgba(13, 17, 29, 0.5); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .card {
    box-sizing: border-box;
    width: min(340px, 100%);
    margin: auto;
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card h1 { margin: 0; font-size: 28px; letter-spacing: 0.04em; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; font-family: "Hiragino Sans", system-ui, sans-serif; }
  .card .big { font-family: var(--font-mono); font-size: 30px; color: var(--accent); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .card .row { display: flex; gap: 10px; }
  .card .btns { display: flex; flex-direction: column; gap: 10px; }
  .card .facts { display: flex; justify-content: center; flex-wrap: wrap; gap: 2px 14px; color: var(--ink); font-size: 13px; font-family: "Hiragino Sans", system-ui, sans-serif; }
  .card .facts > span { white-space: nowrap; }
  .card .facts b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .card .newbest { color: var(--accent); font-weight: 700; }
  .cta {
    flex: 1;
    min-height: 50px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 700 16px var(--font-display);
    touch-action: manipulation;
  }
  .cta.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .howto { display: grid; grid-template-columns: auto 1fr; gap: 5px 12px; margin: 0; text-align: left; font-size: 12px; color: var(--muted); font-family: "Hiragino Sans", system-ui, sans-serif; line-height: 1.45; }
  .howto dt { color: var(--ink); font-weight: 700; white-space: nowrap; }
  .howto dd { margin: 0; }
  /* 高さの低い横持ち（iPhone 横など）では、カードを横に広げて説明を2列にし、ボタンが最初から見えるようにする */
  @media (orientation: landscape) and (max-height: 500px) {
    .card { width: min(560px, 100%); padding: 12px 18px; gap: 8px; }
    .card h1 { font-size: 21px; }
    .card .big { font-size: 24px; }
    .howto { grid-template-columns: auto 1fr auto 1fr; gap: 3px 10px; font-size: 12px; }
    .cta { min-height: 46px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .lives.hit, .box.best.flash { animation: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="hud">
    <button class="back" id="menuBtn" type="button" aria-label="メニューへ戻る">← メニュー</button>
    <div class="stats">
      <section class="box score" aria-label="スコア"><span class="label">Score</span><b id="score">0</b></section>
      <section class="box best" aria-label="ベスト"><span class="label">Best</span><b id="best">0</b></section>
      <section class="box life" id="lifeBox" aria-label="ライフ 3"><span class="label">Life</span><span class="lives" id="lives" aria-hidden="true"><i></i><i></i><i></i></span></section>
    </div>
    <div class="sys">
      <button class="tool" id="pauseBtn" type="button" aria-label="一時停止">II</button>
      <button class="tool sound-btn" id="soundBtn" type="button" aria-label="効果音" aria-pressed="true">♪</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="bg" aria-hidden="true"></canvas>
    <canvas id="field" role="img" aria-label="道場：飛んでくる的を指でなぞって切る（キーボードは Enter か Space で1つ切る）"></canvas>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="card" id="card" role="dialog" aria-modal="true"></div>
</div>

<script src="../../common/sfx.js"></script>
<script>
(() => {
  "use strict";

  // ===== 定数 =====
  const KEY_BEST = "kiritori.best";
  const LIVES = 3;
  const TRAIL_MS = 200;        // 切った軌跡の残像を見せる時間
  const GRACE = 10;            // はじめの 10 秒は、的を落としてもライフを減らさない（印は出す）。遊び方をつかむ時間
  const MISS_MS = 1.0;          // 落とした印を見せる時間（秒）
  const OVER_DELAY = 900;      // ライフが 0 になってから結果カードを出すまで（最後の様子を見せる）
  const KINDS = ["wara", "take", "fusen"];   // 巻藁・竹・紙風船（爆弾は "bomb"）

  // ===== 判定・得点・ライフ・難しさ（画面に依存しない純粋な関数） =====
  // 線分 AB と、中心 C・半径 r の円が交わるか（端点が円の中にある場合も含む）
  function segCircle(ax, ay, bx, by, cx, cy, r) {
    const dx = bx - ax, dy = by - ay;
    const L2 = dx * dx + dy * dy;
    let t = L2 > 0 ? ((cx - ax) * dx + (cy - ay) * dy) / L2 : 0;
    t = Math.max(0, Math.min(1, t));
    const px = ax + t * dx - cx, py = ay + t * dy - cy;
    return px * px + py * py <= r * r;
  }
  // 1回のスワイプで n 個切ったときのコンボ加点（3つ=+3、4つ=+5、5つ=+7 …）
  function comboBonus(n) { return Number.isInteger(n) && n >= 3 ? 2 * n - 3 : 0; }
  // 1回のスワイプの合計点（的1つ1点＋コンボ加点）
  function swipePoints(n) { return Math.max(0, n | 0) + comboBonus(n); }
  // ライフを1つ減らす（0 より下にはならない）。0 になったらゲームオーバー
  function loseLife(lives) { return Math.max(0, lives - 1); }
  function isOver(lives) { return lives <= 0; }
  // 経過時間（秒）→ 難しさ。時間とともに出現の間隔が縮み、数・速さ・爆弾の割合がゆるやかに上がる（上限あり）
  function difficulty(t) {
    t = Math.max(0, t || 0);
    return {
      interval: Math.max(0.8, 1.7 - t * 0.012),        // 次の組を投げるまで（秒）
      maxCount: Math.min(4, 1 + Math.floor((t + 6) / 18)),   // 1組の最大数（12 秒で 2 個から）
      bombRate: t < 8 ? 0 : Math.min(0.2, 0.08 + (t - 8) * 0.002),
      flight: Math.max(0.85, 1.25 - t * 0.004),         // 投げてから頂点までの時間（秒）。短いほど速い
    };
  }
  // 1つの的を投げる初速。道場の下から投げ上げ、頂点は上〜中央（指で隠れにくい高さ）、左右は端に寄りすぎない
  function launch(W, H, r, rnd, d) {
    const x0 = W * (0.15 + 0.7 * rnd());
    const x1 = W * (0.12 + 0.76 * rnd());           // 落ちていく先
    const apexY = H * (0.12 + 0.33 * rnd());
    const y0 = H + r;
    const g = (2 * H * 0.62) / (d.flight * d.flight); // 道場の高さに合わせた重力（どの画面でも同じくらいの滞空時間）
    const vy = -Math.sqrt(2 * g * (y0 - apexY));
    const total = -vy / g + Math.sqrt((2 * (y0 + r - apexY)) / g);
    return { x: x0, y: y0, vx: (x1 - x0) / total, vy, g, apexY };
  }
  // 経過時間 dt（秒）だけ進める。重力一定の式どおりに進めるので、60Hz でも 120Hz でも同じ位置になる
  function step(o, dt) {
    o.x += o.vx * dt;
    o.y += o.vy * dt + 0.5 * o.g * dt * dt;
    o.vy += o.g * dt;
    if (o.vr) o.rot = (o.rot || 0) + o.vr * dt;
    return o;
  }
  // 的を落としたときにライフを減らすか（はじめの GRACE 秒は減らさない）
  function dropCostsLife(t) { return (t || 0) >= GRACE; }
  // 保存されたベストの検証：安全な非負の整数だけ（壊れた値・Infinity・小数・文字列は 0）
  function parseBest(raw) {
    if (raw === null || raw === undefined || raw === "") return 0;
    const n = Number(raw);
    return Number.isSafeInteger(n) && n >= 0 ? n : 0;
  }
  // 検証用に計算部分だけ公開する（ゲームの状態には触れない）
  window.KiritoriLogic = Object.freeze({ segCircle, comboBonus, swipePoints, loseLife, isOver, difficulty, launch, step, parseBest, dropCostsLife, LIVES, GRACE, KINDS });

  // ===== 要素 =====
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), cv = $("field"), bgCv = $("bg"), overlay = $("overlay"), card = $("card");
  const ui = { score: $("score"), best: $("best"), lives: $("lives"), lifeBox: $("lifeBox") };
  const reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };
  const calm = () => reduceMotion.matches;

  // ===== 状態 =====
  let state = "title";        // title | play | pause | over
  let score = 0, best = loadBest(), bestAtStart = best, bestFlashed = false;
  let lives = LIVES, maxCombo = 0, cutCount = 0;
  let elapsed = 0, spawnT = 0;
  let objs = [];              // 飛んでいる的・爆弾
  let queue = [];             // これから投げるもの（少しずつずらして投げる）
  let pieces = [], bits = [], marks = [], puffs = [];   // 割れた半分・破片・落とした印・爆弾の煙
  let trail = [];             // 指の軌跡 {x, y, t}
  let swipe = null;           // いまのスワイプ {id, x, y, cuts}
  let overTimer = 0, confirming = false;
  let W = 300, H = 300, R = 30, flashT = 0, edgeT = 0;

  function loadBest() {
    try { return parseBest(localStorage.getItem(KEY_BEST)); } catch (e) { return 0; }
  }
  function saveBest() {
    try { localStorage.setItem(KEY_BEST, String(best)); } catch (e) { /* 保存できない環境では無視 */ }
  }
  // 途中でやめた・閉じたときも、いまのスコアがベストを超えていれば記録する
  function commitBest() {
    if (score > best) best = score;
    if (best > loadBest()) saveBest();
  }

  // ===== 効果音 =====
  // 共通の効果音（common/sfx.js、案A「木のおもちゃ箱」）
  const sfx = YubiSfx.create("kiritori");
  document.addEventListener("pointerdown", () => sfx.unlock(), { capture: true });
  document.addEventListener("touchend", () => sfx.unlock(), { capture: true });
  const soundBtn = $("soundBtn");
  function renderSoundBtn() {
    soundBtn.setAttribute("aria-pressed", String(sfx.on));
    soundBtn.setAttribute("aria-label", "効果音");   // オン・オフは aria-pressed だけで伝える（名前に入れると読み上げが二重になる。X-25）
  }
  soundBtn.addEventListener("click", () => { sfx.toggle(); renderSoundBtn(); });
  renderSoundBtn();

  // ===== スコア欄 =====
  function renderStats() {
    ui.score.textContent = score.toLocaleString();
    ui.best.textContent = Math.max(best, score).toLocaleString();
    [...ui.lives.children].forEach((el, i) => el.classList.toggle("lost", i >= lives));
    ui.lifeBox.setAttribute("aria-label", `ライフ ${lives}`);
  }
  function bump(el, cls) {
    if (calm()) return;
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
    el.addEventListener("animationend", () => el.classList.remove(cls), { once: true });
  }
  // 数字が欄の幅に入りきらないときは、文字を縮めて「…」で省略されないようにする（ブロックパズルと同じ方式）
  const statEls = [ui.score, ui.best];
  function fitStat(el) {
    el.style.fontSize = "";
    if (!el.offsetParent || el.scrollWidth <= el.clientWidth) return;
    let fs = parseFloat(getComputedStyle(el).fontSize);
    fs = Math.max(12, Math.floor(fs * el.clientWidth / el.scrollWidth * 2) / 2);
    el.style.fontSize = fs + "px";
    while (fs > 12 && el.scrollWidth > el.clientWidth) { fs -= 0.5; el.style.fontSize = fs + "px"; }
  }
  function fitStats() { statEls.forEach(fitStat); }
  if (window.MutationObserver) new MutationObserver(fitStats).observe(document.querySelector(".stats"), { childList: true, characterData: true, subtree: true });
  if (document.fonts) {
    document.fonts.ready.then(fitStats).catch(() => {});
    if (document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", fitStats);
  }

  // ===== 得点 =====
  function addScore(n) {
    if (n <= 0) return;
    score += n;
    if (score > best) { best = score; saveBest(); }
    // 過去のベスト（ゲーム開始時点）を初めて上回った瞬間（初めて遊ぶとき＝ベスト0 は除く）
    if (!bestFlashed && bestAtStart > 0 && score > bestAtStart) {
      bestFlashed = true;
      sfx.play("best");
      bump(ui.best.parentElement, "flash");
    }
    renderStats();
  }
  function hurt() {
    lives = loseLife(lives);
    renderStats();
    bump(ui.lives, "hit");
    if (!calm()) edgeT = 0.45;   // 道場の縁を一瞬赤く光らせる（ライフが減ったと分かるように）
    if (isOver(lives)) gameOver();
  }

  // ===== 出現 =====
  function rnd() { return Math.random(); }
  function scheduleWave() {
    const d = difficulty(elapsed);
    const n = 1 + Math.floor(rnd() * d.maxCount);
    let bombs = 0;
    for (let i = 0; i < n; i++) {

        c.fillRect(rr * Math.sin(a0), -rr, rr * (Math.sin(a1) - Math.sin(a0)) + 0.6, rr * 2);
      }
      const sh = c.createRadialGradient(-rr * 0.35, -rr * 0.4, rr * 0.1, 0, 0, rr);
      sh.addColorStop(0, "rgba(255,255,255,0.35)"); sh.addColorStop(0.6, "rgba(255,255,255,0)"); sh.addColorStop(1, "rgba(0,0,0,0.28)");
      c.fillStyle = sh; c.fillRect(-rr, -rr, rr * 2, rr * 2);
      c.restore();
      c.fillStyle = "#f3eee2"; ell(c, 0, -rr + 1, rr * 0.16, rr * 0.08); c.fill();
    },
    // 爆弾：黒い玉。暗い背景でも見えるよう白い輪と、火花の出る導火線
    bomb(c, r, now) {
      const rr = r * 0.88;
      c.strokeStyle = "#5b4630"; c.lineWidth = Math.max(2, r * 0.08);
      c.beginPath(); c.moveTo(rr * 0.35, -rr * 0.85); c.quadraticCurveTo(rr * 0.75, -rr * 1.25, rr * 0.95, -rr * 1.05); c.stroke();
      const g = c.createRadialGradient(-rr * 0.35, -rr * 0.35, rr * 0.1, 0, 0, rr);
      g.addColorStop(0, "#4a4f5c"); g.addColorStop(0.5, "#16181e"); g.addColorStop(1, "#050506");
      c.fillStyle = g; ell(c, 0, 0, rr, rr); c.fill();
      c.strokeStyle = "rgba(236,230,214,0.75)"; c.lineWidth = 2; c.stroke();
      c.fillStyle = "#2a2d36"; c.fillRect(rr * 0.12, -rr * 1.02, rr * 0.42, rr * 0.28);
      c.strokeStyle = "rgba(239,100,100,0.9)"; c.lineWidth = Math.max(2, r * 0.09); c.lineCap = "round";
      c.beginPath(); c.moveTo(-rr * 0.32, -rr * 0.32); c.lineTo(rr * 0.32, rr * 0.32); c.moveTo(rr * 0.32, -rr * 0.32); c.lineTo(-rr * 0.32, rr * 0.32); c.stroke();
      const flick = calm() ? 1 : 0.7 + 0.3 * Math.sin(now / 24);
      c.fillStyle = "#ffd36b"; ell(c, rr * 0.97, -rr * 1.07, r * 0.13 * flick, r * 0.13 * flick); c.fill();
      c.fillStyle = "#ff8a3a"; ell(c, rr * 0.97, -rr * 1.07, r * 0.07, r * 0.07); c.fill();
    },
  };
  function drawObj(o, now) {
    ctx.save();
    ctx.translate(o.x, o.y);
    ctx.rotate(o.rot || 0);
    SHAPE[o.kind](ctx, o.r, now);
    ctx.restore();
  }
  // 割れた半分：切った線で半分だけを切り抜いて描く
  function drawPiece(p, now) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, p.t - 0.5) / 0.5);
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.save();
    ctx.rotate(p.cutAng);
    ctx.beginPath();
    ctx.rect(-p.r * 2, p.side > 0 ? 0 : -p.r * 2, p.r * 4, p.r * 2);
    ctx.rotate(-p.cutAng);
    ctx.clip();
    SHAPE[p.kind](ctx, p.r, now);
    ctx.restore();
    ctx.restore();
  }
  // 軌跡：影（shadowBlur）は iPhone で重いので使わず、太い半透明の線を下に重ねて光らせる
  function drawTrail(now) {
    const pts = trail;
    if (pts.length < 2) return;
    ctx.save();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const glow = !calm();
    for (let i = 1; i < pts.length; i++) {
      const a = pts[i - 1], b = pts[i];
      if (b.start) continue;
      const k = 1 - (now - b.t) / TRAIL_MS;
      if (k <= 0) continue;
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
      if (glow) { ctx.strokeStyle = `rgba(150,220,255,${(0.28 * k).toFixed(3)})`; ctx.lineWidth = 8 + 12 * k; ctx.stroke(); }
      ctx.strokeStyle = `rgba(235,248,255,${(0.35 + 0.65 * k).toFixed(3)})`;
      ctx.lineWidth = 1.5 + 6 * k;
      ctx.stroke();
    }
    ctx.restore();
  }
  function draw(now) {
    if (!ctx) return;
    ctx.clearRect(0, 0, W, H);
    for (const p of puffs) {
      const k = p.t / 0.6;
      ctx.fillStyle = `rgba(160,166,184,${(0.45 * (1 - k)).toFixed(3)})`;
      ell(ctx, p.x, p.y, R * (0.8 + k * (calm() ? 0.3 : 1.4)), R * (0.8 + k * (calm() ? 0.3 : 1.4))); ctx.fill();
    }
    for (const p of pieces) drawPiece(p, now);
    for (const o of objs) drawObj(o, now);
    for (const b of bits) {
      ctx.globalAlpha = Math.max(0, 1 - b.t / b.life);
      ctx.fillStyle = b.col; ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
    }
    ctx.globalAlpha = 1;
    // 落とした印・コンボの表示
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    for (const m of marks) {
      const k = m.t / (m.combo ? 0.9 : MISS_MS);
      ctx.globalAlpha = Math.max(0, 1 - k);
      if (m.combo) {
        ctx.font = `700 ${Math.round(Math.max(16, R * 0.6))}px "Hiragino Sans", system-ui, sans-serif`;
        const y = Math.max(20, Math.min(H - 20, m.y - 30 - (calm() ? 0 : k * 24)));
        const x = Math.max(70, Math.min(W - 70, m.x));
        ctx.lineWidth = 4; ctx.strokeStyle = "rgba(13,17,29,0.85)"; ctx.strokeText(m.text, x, y);
        ctx.fillStyle = "#f0a43a"; ctx.fillText(m.text, x, y);
      } else {
        ctx.strokeStyle = m.safe ? "rgba(240,164,58,0.9)" : "rgba(239,100,100,0.95)"; ctx.lineWidth = 6; ctx.lineCap = "round";
        const s = Math.max(14, R * 0.7); ctx.beginPath(); ctx.moveTo(m.x - s, m.y - s); ctx.lineTo(m.x + s, m.y + s); ctx.moveTo(m.x + s, m.y - s); ctx.lineTo(m.x - s, m.y + s); ctx.stroke();
      }
    }
    ctx.globalAlpha = 1;
    // 軌跡はいちばん手前に描く（的や破片に隠れない）
    drawTrail(now);
    // ひと振りで切っている個数を指の近くに（2つ目から。3つ以上でコンボ）
    if (state === "play" && swipe && swipe.cuts >= 2) {
      const n = swipe.cuts, x = Math.max(16, Math.min(W - 16, swipe.x)), y = Math.max(20, swipe.y - R - 14);
      ctx.font = `700 ${Math.round(Math.max(18, R * 0.75))}px "JetBrains Mono", ui-monospace, monospace`;
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(13,17,29,0.85)"; ctx.strokeText(String(n), x, y);
      ctx.fillStyle = n >= 3 ? "#f0a43a" : "#ece6d6"; ctx.fillText(String(n), x, y);
    }
    // はじめの数秒、まだ 1 つも切っていないときだけ遊び方のヒント
    if (state === "play" && cutCount === 0 && elapsed < GRACE) {
      ctx.globalAlpha = 0.85;
      ctx.font = `700 ${Math.round(Math.max(14, Math.min(20, W * 0.045)))}px "Hiragino Sans", system-ui, sans-serif`;
      ctx.lineWidth = 4; ctx.strokeStyle = "rgba(13,17,29,0.85)";
      ctx.strokeText("的を指でなぞって切ろう", W / 2, H * 0.62); ctx.fillStyle = "#ece6d6"; ctx.fillText("的を指でなぞって切ろう", W / 2, H * 0.62);
      ctx.globalAlpha = 1;
    }
    if (edgeT > 0) { ctx.strokeStyle = `rgba(239,100,100,${Math.min(1, edgeT * 2.2).toFixed(3)})`; ctx.lineWidth = 8; ctx.strokeRect(0, 0, W, H); }
    if (flashT > 0) { ctx.fillStyle = `rgba(239,100,100,${(flashT * 1.2).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
  }

  // ===== メインループ（経過時間で進める） =====
  function update(dt) {
    elapsed += dt;
    spawnT -= dt;
    if (spawnT <= 0) scheduleWave();
    for (const q of queue) q.at -= dt;
    const ready = queue.filter((q) => q.at <= 0);
    if (ready.length) { queue = queue.filter((q) => q.at > 0); ready.forEach((q) => throwOne(q.kind)); }
    for (const o of objs) { step(o, dt); o.t += dt; }
    // 下へ落ちたもの：的なら落とした（ライフ −1）、爆弾ならそのまま消える
    const gone = objs.filter((o) => o.vy > 0 && o.y - o.r > H + 4);
    if (gone.length) {
      objs = objs.filter((o) => !gone.includes(o));
      for (const o of gone) {
        if (o.kind === "bomb") continue;
        const safe = !dropCostsLife(elapsed);
        marks.push({ x: Math.max(18, Math.min(W - 18, o.x)), y: H - Math.max(22, R * 0.8), t: 0, safe });
        if (safe) continue;   // はじめの数秒は印だけ（ライフは減らない）
        sfx.play("miss");
        hurt();
        if (state !== "play") break;
      }
    }
  }
  function updateEffects(dt, now) {
    for (const p of pieces) { step(p, dt); p.t += dt; }
    pieces = pieces.filter((p) => p.t < 1 && p.y - p.r < H + 40);
    for (const b of bits) { step(b, dt); b.t += dt; }
    bits = bits.filter((b) => b.t < b.life);
    for (const m of marks) m.t += dt;
    marks = marks.filter((m) => m.t < (m.combo ? 0.9 : MISS_MS));
    for (const p of puffs) p.t += dt;
    puffs = puffs.filter((p) => p.t < 0.6);
    flashT = Math.max(0, flashT - dt);
    edgeT = Math.max(0, edgeT - dt);
    if (trail.length) {
      trail = trail.filter((p) => now - p.t < TRAIL_MS);
    }
  }
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (state === "play") update(dt);
    // 結果カードを出すまでは最後の様子を動かし、カードを出したら描くのをやめる（電池の節約）
    const overAnim = state === "over" && overTimer;
    if (state === "play" || overAnim) { if (overAnim) for (const o of objs) step(o, dt); updateEffects(dt, now); draw(now); }
    requestAnimationFrame(frame);
  }

  // 確かめ用（テスト・不具合の調査）：いまの様子を読むだけ。ゲームの状態は変えられない
  window.KiritoriGame = Object.freeze({
    snapshot() {
      const b = stage.getBoundingClientRect();
      return {
        state, score, best, lives, maxCombo, cutCount, elapsed, overlay: !overlay.hidden,
        stage: { x: b.left, y: b.top, w: b.width, h: b.height },
        objs: objs.map((o) => ({ kind: o.kind, x: b.left + o.x, y: b.top + o.y, r: o.r, vy: o.vy, g: o.g })),
        pieces: pieces.length, bits: bits.length, trail: trail.length, marks: marks.length, edge: edgeT > 0,
      };
    },
  });

  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);
  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 200));
  resize();
  renderStats();
  showTitle();
  requestAnimationFrame(frame);
})();

// ホーム画面から起動したときにオフラインでも遊べるようにする（https か localhost のときだけ有効）
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("../../sw.js").catch(() => { /* 登録できなくてもゲームは遊べる */ });
  });
}
</script>
</body>
</html>
