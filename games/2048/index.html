<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆびあそび">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<title>ばいばいタイル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: 縦持ちは「見出し / スコアと操作ボタン / 盤面」、横持ちは左に情報、右に盤面 */
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #9aa1b8;
    --accent: #f0a43a;
    --accent-ink: #231705;
    --font-display: "Chakra Petch", "Hiragino Sans", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --slide: 100ms;
    --cell: 64px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  /* ダブルタップ拡大・ピンチ拡大を止める（iOS Safari は user-scalable=no を無視するため CSS と JS の両方で防ぐ） */
  html { overscroll-behavior: none; touch-action: none; }
  body {
    margin: 0;
    font-size: 14px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    /* ノッチ・ホームバーに重ならないよう safe-area 分を空ける */
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto;
    grid-template-areas: "head" "bar" "stage" "hint";
    gap: 10px;
    max-width: 760px;
    margin: 0 auto;
  }
  .head { grid-area: head; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  /* 「← メニュー」：ブロックパズルと同じ表記・同じ見た目（枠つき、44×44px 以上） */
  .back {
    align-self: flex-start;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 14px "Hiragino Sans", system-ui, sans-serif;
    text-decoration: none;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .back:active { filter: brightness(1.3); }
  h1.title { margin: 0; font-size: 24px; letter-spacing: 0.04em; line-height: 1.2; }
  .bar {
    grid-area: bar;
    display: flex;
    align-items: stretch;
    gap: 8px;
    min-width: 0;
  }
  .box {
    background: var(--panel);
    border-radius: 10px;
    padding: 6px 10px 7px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1 1 0;
  }
  .label {
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .box b {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 20px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .box.score b { color: var(--accent); }
  /* プレイ中にベストを上回った瞬間に1回だけ光らせる */
  .box.best.flash { animation: bestflash 900ms ease-out 1; }
  @keyframes bestflash {
    0% { box-shadow: 0 0 0 0 rgba(240, 164, 58, 0); }
    25% { box-shadow: 0 0 0 2px var(--accent), 0 0 16px rgba(240, 164, 58, 0.55); }
    100% { box-shadow: 0 0 0 0 rgba(240, 164, 58, 0); }
  }
  .tools { display: flex; gap: 6px; flex: 0 0 auto; }
  .tool {
    min-width: 44px;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: 700 12px var(--font-display);
    padding: 0 8px;
    touch-action: manipulation;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    line-height: 1.1;
  }
  .tool .ico { font-size: 17px; }
  /* 「最初から」は「1手戻す」と離して置く（間に ♪ を挟み、さらに間隔をあける） */
  .tool.restart { margin-left: 10px; }
  .tool small { font-size: 12px; letter-spacing: 0.04em; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .tool:disabled { opacity: 0.35; }
  .tool:active:not(:disabled) { filter: brightness(1.3); background: var(--panel); }
  .sound-btn { font-size: 16px; }
  .sound-btn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* 盤面の周りも含めてスワイプを受け付ける領域 */
  .stage {
    grid-area: stage;
    min-height: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    touch-action: none;
  }
  .board {
    position: relative;
    flex: 0 0 auto;
    width: 300px;
    height: 300px;
    background: var(--well);
    border-radius: 10px;
    box-shadow: 0 0 0 3px var(--line), 0 12px 30px rgba(0, 0, 0, 0.35);
    touch-action: none;
  }
  .slot, .tile {
    position: absolute;
    left: 0;
    top: 0;
    width: var(--cell);
    height: var(--cell);
  }
  .slot { background: rgba(138, 145, 168, 0.08); border-radius: 8px; }
  .tile { transition: transform var(--slide) ease-in-out; will-change: transform; }
  .board.instant .tile { transition: none; }
  .tile-in {
    box-sizing: border-box;
    width: 100%;
    height: 100%;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    overflow: hidden;
    font-size: max(12px, calc(var(--cell) * 0.46));
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.22), inset 0 2px 0 rgba(255, 255, 255, 0.16);
  }
  /* 桁数に応じて文字を小さくし、5桁以上でも枠からはみ出さないようにする */
  .tile-in.d3 { font-size: max(12px, calc(var(--cell) * 0.38)); }
  .tile-in.d4 { font-size: max(12px, calc(var(--cell) * 0.30)); }
  .tile-in.d5 { font-size: max(12px, calc(var(--cell) * 0.24)); }
  .tile-in.d6 { font-size: max(12px, calc(var(--cell) * 0.20)); }
  .tile-in.d7 { font-size: max(12px, calc(var(--cell) * 0.17)); }
  /* タイルの色：値が大きくなるほど明るくなる（相対輝度が値の順に単調に増える）。
     色の見分けが苦手な人でも明るさの順で大小が分かるようにし、色相の変化は残す。
     文字色は、暗いタイル（2〜8）は白、明るいタイル（16 以上）は濃紺で、どの値もコントラスト 4.5:1 以上 */
  .v2     { background: #32374e; color: #ffffff; }
  .v4     { background: #3b4c82; color: #ffffff; }
  .v8     { background: #265ad5; color: #ffffff; }
  .v16    { background: #9365e4; color: #0d111d; }
  .v32    { background: #ed5f5b; color: #0d111d; }
  .v64    { background: #e873bd; color: #0d111d; }
  .v128   { background: #f39247; color: #0d111d; }
  .v256   { background: #4acf64; color: #0d111d; }
  .v512   { background: #60d2e3; color: #0d111d; }
  .v1024  { background: #f2cb32; color: #0d111d; }
  .v2048  { background: #fcd590; color: #0d111d; box-shadow: 0 0 0 2px var(--accent), 0 0 18px rgba(240, 164, 58, 0.6); }
  .v4096  { background: #fae840; color: #0d111d; }
  .v8192  { background: #cff6e9; color: #0d111d; }
  .v16384 { background: #eef6fd; color: #0d111d; }
  .vbig   { background: #fcfaf5; color: #0d111d; }
  .tile-in.appear { animation: appear 140ms ease-out both; }
  .tile-in.pop { animation: pop 160ms ease-out both; }
  @keyframes appear { from { transform: scale(0.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.16); } 100% { transform: scale(1); } }
  /* 合体したときの「+N」（盤面の上に一瞬だけ） */
  .gain {
    position: absolute;
    left: 50%;
    top: 18%;
    z-index: 5;
    pointer-events: none;
    font: 700 22px var(--font-mono);
    color: var(--accent);
    text-shadow: 0 1px 0 rgba(0, 0, 0, 0.6), 0 0 10px rgba(13, 17, 29, 0.9);
    white-space: nowrap;
    animation: gain 650ms ease-out both;
  }
  @keyframes gain {
    0% { transform: translate(-50%, 6px); opacity: 0; }
    20% { transform: translate(-50%, 0); opacity: 1; }
    100% { transform: translate(-50%, -18px); opacity: 0; }
  }

  /* キー操作の説明は、キーボードとマウスのある環境だけに出す */
  .hint .kbd { display: none; }
  @media (hover: hover) and (pointer: fine) { .hint .kbd { display: inline; } }
  .hint {
    grid-area: hint;
    margin: 0;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    font-family: "Hiragino Sans", system-ui, sans-serif;
  }

  @media (orientation: landscape) {
    .app {
      max-width: 1100px;
      grid-template-columns: minmax(180px, 260px) minmax(0, 1fr);
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas:
        "head  stage"
        "bar   stage"
        ".     stage"
        "hint  stage";
      column-gap: 20px;
    }
    .bar { flex-direction: column; }
    .box { flex: 0 0 auto; }
    .tools { flex-wrap: wrap; }
    .tool { flex: 1 1 auto; }
    .hint { text-align: left; }
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
    h1.title { font-size: 18px; }
    .box b { font-size: 16px; }
    .hint { display: none; }
  }
  /* 縦持ちはボタン類をスコア欄の下の段に分け、スコアとベストに幅を回す（7桁まで省略されないように） */
  @media (orientation: portrait) {
    .bar { flex-wrap: wrap; }
    .tools { flex: 1 0 100%; }
    .tool { flex: 1 1 0; }
    /* 盤面は操作欄のすぐ下に寄せ、余った高さは盤面の下へ回す */
    .stage { align-items: flex-start; }
  }
  /* iPhone SE など幅の狭い縦画面では数字を少し小さく（ボタンの文字は消さない） */
  @media (orientation: portrait) and (max-width: 360px) {
    .box b { font-size: 17px; }
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    /* カードが画面より高いときは縦にスクロールできるようにする（中央寄せは .card の margin:auto で行い、上が切れないようにする） */
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(13, 17, 29, 0.78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .card {
    width: min(340px, 100%);
    box-sizing: border-box;
    margin: auto;
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 24px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: center;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card h2 { margin: 0; font-size: 30px; letter-spacing: 0.04em; text-wrap: balance; }
  .card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.6; font-family: "Hiragino Sans", system-ui, sans-serif; }
  .card .big { font-family: var(--font-mono); font-size: 28px; color: var(--accent); font-variant-numeric: tabular-nums; }
  .card .row { display: flex; gap: 10px; }
  /* ボタンの段：1段目は主ボタンを横幅いっぱい、2段目に残りを並べる（ブロックパズルの一時停止画面と同じ形）。
     段の間は 10px（カードの gap が詰まる横持ちでも変わらない） */
  .card .btns { display: flex; flex-direction: column; gap: 10px; }
  /* 結果カード（ゲームオーバー）：見出しとスコアを1行、最大タイルとベストを1行にまとめて低くし、
     縦持ちの小さい画面でも盤面の上から2段以上が隠れないようにする */
  .card.compact { padding: 12px 16px; gap: 8px; }
  .card.compact .ohead { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0 10px; }
  .card.compact h2 { font-size: 18px; line-height: 1.2; }
  .card.compact .oscore { display: flex; align-items: baseline; gap: 6px; margin-left: auto; }
  .card.compact .big { font-size: 22px; line-height: 1.1; }
  .card.compact .reach { font-size: 12px; line-height: 1.4; }
  .card.compact .reach > span { display: inline-block; white-space: nowrap; }
  .card.compact .cta { min-height: 44px; }
  /* iPhone SE など幅の狭い画面：余白と文字をさらに詰め、6桁のスコアでも見出しと1行に収める */
  @media (max-width: 360px) {
    .card.compact { padding: 10px 12px; gap: 6px; }
    .card.compact h2 { font-size: 17px; }
    .card.compact .big { font-size: 20px; }
    .card.compact .oscore .label { letter-spacing: 0.06em; }
  }
  .cta:disabled { opacity: 0.35; }
  .card .reach { color: var(--ink); }
  .card .reach b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  /* 結果カード（ゲームオーバー）は背景を薄く・ぼかさず、最後の盤面が見えるようにする。縦持ちはカードを下に寄せる */
  .overlay.soft { background: rgba(13, 17, 29, 0.42); -webkit-backdrop-filter: none; backdrop-filter: none; }
  @media (orientation: portrait) { .overlay.soft .card { margin-bottom: 0; } }
  .cta {
    flex: 1;
    min-height: 50px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 700 16px var(--font-display);
    touch-action: manipulation;
  }
  .cta.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  /* 高さの低い横持ちではカードを詰めて、ボタンが最初から見えるようにする */
  @media (orientation: landscape) and (max-height: 500px) {
    .card { padding: 14px 18px; gap: 8px; }
    .card h2 { font-size: 22px; }
    .card .big { font-size: 24px; }
  }

  @media (prefers-reduced-motion: reduce) {
    :root { --slide: 0ms; }
    .tile { transition: none; }
    .tile-in.appear, .tile-in.pop { animation: none; }
    .box.best.flash { animation: none; }
    .gain { display: none; }
  }
</style>
</head>
<body>

<div class="app" id="app">
  <header class="head">
    <a class="back" id="backLink" href="../../" aria-label="メニューへ戻る">← メニュー</a>
    <h1 class="title">ばいばいタイル</h1>
  </header>

  <div class="bar">
    <section class="box score" aria-label="スコア"><span class="label">Score</span><b id="score">0</b></section>
    <section class="box best" aria-label="ベスト"><span class="label">Best</span><b id="best">0</b></section>
    <div class="tools">
      <button class="tool" id="undoBtn" type="button" aria-label="1手戻す" disabled><span class="ico" aria-hidden="true">↶</span><small>1手戻す</small></button>
      <button class="tool sound-btn" id="soundBtn" type="button" aria-label="効果音" aria-pressed="true"><span class="ico" aria-hidden="true">♪</span><small>効果音</small></button>
      <button class="tool restart" id="newBtn" type="button" aria-label="最初から"><span class="ico" aria-hidden="true">⇤</span><small>最初から</small></button>
    </div>
  </div>

  <div class="stage" id="stage">
    <div class="board" id="board" role="img" aria-label="ゲーム盤面"></div>
  </div>

  <p class="hint">上下左右にスワイプして動かす。同じ数字がぶつかると合体。<span class="kbd">矢印キー・WASD でも動かせます。</span></p>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

<script src="../../common/sfx.js"></script>
<script>
(() => {
  "use strict";

  // ===== 定数 =====
  const SIZE = 4;
  const GOAL = 2048;
  const SWIPE_MIN = 24;       // スワイプとみなす移動量(px)
  const KEY_BEST = "tile2048.best";
  const KEY_STATE = "tile2048.state";

  // ===== 盤面の計算（画面に依存しない純粋な関数） =====
  // 1行を左へ寄せる。dest[i] は i 番目のタイルの行き先、merged[k] は k に合体が起きたか
  function slideLine(line) {
    const out = [0, 0, 0, 0];
    const dest = [-1, -1, -1, -1];
    const merged = [false, false, false, false];
    let gained = 0, t = -1, canMerge = false;
    for (let i = 0; i < line.length; i++) {
      const v = line[i];
      if (!v) continue;
      if (t >= 0 && canMerge && out[t] === v) {
        out[t] = v * 2;
        gained += out[t];
        merged[t] = true;
        canMerge = false;      // 1手で1タイルは1回だけ合体
      } else {
        t++;
        out[t] = v;
        canMerge = true;
      }
      dest[i] = t;
    }
    const moved = out.some((v, k) => v !== line[k]);
    return { out, dest, merged, gained, moved };
  }
  // dir の方向へ寄せるとき、各列（行）のマス番号を「寄せる先」から順に並べる
  function lineCells(dir, k) {
    const cells = [];
    for (let i = 0; i < SIZE; i++) {
      if (dir === "left")  cells.push(k * SIZE + i);
      if (dir === "right") cells.push(k * SIZE + (SIZE - 1 - i));
      if (dir === "up")    cells.push(i * SIZE + k);
      if (dir === "down")  cells.push((SIZE - 1 - i) * SIZE + k);
    }
    return cells;
  }
  // grid は長さ16の配列（0 は空き）。moves は {from, to, merged} の一覧
  function computeMove(grid, dir) {
    const next = grid.slice();
    const moves = [];
    let gained = 0, moved = false;
    for (let k = 0; k < SIZE; k++) {
      const cells = lineCells(dir, k);
      const res = slideLine(cells.map((c) => grid[c]));
      if (!res.moved) {
        cells.forEach((c) => { if (grid[c]) moves.push({ from: c, to: c, merged: false }); });
        continue;
      }
      moved = true;
      gained += res.gained;
      cells.forEach((c, i) => {
        next[c] = res.out[i];
        if (res.dest[i] >= 0) moves.push({ from: c, to: cells[res.dest[i]], merged: res.merged[res.dest[i]] });
      });
    }
    return { grid: next, moves, gained, moved };
  }
  function canMove(grid) {
    for (let i = 0; i < SIZE * SIZE; i++) {
      if (!grid[i]) return true;
      const r = Math.floor(i / SIZE), c = i % SIZE;
      if (c < SIZE - 1 && grid[i] === grid[i + 1]) return true;
      if (r < SIZE - 1 && grid[i] === grid[i + SIZE]) return true;
    }
    return false;
  }
  function hasWon(grid) { return grid.some((v) => v >= GOAL); }
  function emptyCells(grid) { const e = []; grid.forEach((v, i) => { if (!v) e.push(i); }); return e; }
  function randomSpawn(grid, rnd = Math.random) {
    const e = emptyCells(grid);
    if (!e.length) return null;

  // ===== 要素 =====
  const $ = (id) => document.getElementById(id);

      if (s.moves !== undefined && !isCount(s.moves)) return null;

  }
  // 盤面全体を作り直す（読み込み・1手戻す・新しいゲームのとき）
  function rebuild(anim) {

  }
  // スコアの数字は約200msでカウントアップする（動きを減らす設定では即時）
  let shownScore = 0, countAnim = 0;
  function showScore(animate) {
    cancelAnimationFrame(countAnim);
    const to = score, from = shownScore;
    if (!animate || reduceMotion.matches || to <= from) {

  // ===== 画面遷移 =====

      <h2>クリア！</h2>
      <p><span data-f="goal"></span> のタイルができました。</p>

      <div class="btns">
        <div class="row"><button class="cta primary" type="button" data-cmd="continue">続ける</button></div>
        <div class="row">

        </div>
      </div>`,
      { goal: String(GOAL), score: score.toLocaleString() });
  }
  // 詰んだら、最後の盤面を約0.8秒見せてから結果カードを出す（その間に画面に触れたらすぐ出す）

      <div class="ohead">

      </div>

  // ===== キーボード =====

    sfx.unlock();
    move(dir);
  });

  // ===== スワイプ（盤面とその周り） =====
  // 1回のスワイプで1手。24px 動いた時点で、縦横の大きい方へ動かす
  let gesture = null;
  stage.addEventListener("pointerdown", (e) => {
    if (state !== "play" || (e.pointerType === "mouse" && e.button !== 0)) return;
    e.preventDefault();
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 未対応ブラウザ */ }
    gesture = { id: e.pointerId, x0: e.clientX, y0: e.clientY, done: false };
  });
  stage.addEventListener("pointermove", (e) => {
    if (!gesture || e.pointerId !== gesture.id || gesture.done) return;
    const dx = e.clientX - gesture.x0, dy = e.clientY - gesture.y0;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    gesture.done = true;
    if (Math.abs(dx) > Math.abs(dy)) move(dx > 0 ? "right" : "left");
    else move(dy > 0 ? "down" : "up");
  });
  const endGesture = (e) => { if (gesture && e.pointerId === gesture.id) gesture = null; };
  stage.addEventListener("pointerup", endGesture);
  stage.addEventListener("pointercancel", endGesture);
  // 長押しメニュー・iOS のピンチ拡大・引っ張り更新を止める
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  ["gesturestart", "gesturechange", "gestureend"].forEach((type) => document.addEventListener(type, (e) => e.preventDefault(), { passive: false }));
  // ただし結果画面などのカード（.overlay）は、画面に収まらないとき縦スクロールできるようにする
  document.addEventListener("touchmove", (e) => { if (e.cancelable && !e.target.closest?.(".overlay")) e.preventDefault(); }, { passive: false });
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  // iOS Safari は user-scalable=no を無視し、touch-action だけでは素早い連続タップの拡大を止めきれないことがある。
  // ・盤面とその周り（.stage）は pointer イベントだけで動くので、touchend を常に止める
  // ・それ以外（上のボタン・← メニュー など click で動くもの）は、350ms 以内の2回目のタップだけ止め、click は自分で送る
  // ・カード（.overlay）は止めない（ボタンの click と縦スクロールを保つ）
  let lastTapEnd = 0, tapStart = null;
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    tapStart = e.touches.length === 1 && t ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true, capture: true });
  document.addEventListener("touchend", (e) => {
    const target = e.target;
    if (!target.closest || target.closest(".overlay")) return;
    const t = e.changedTouches[0];
    const isTap = tapStart && t && e.touches.length === 0 && Math.hypot(t.clientX - tapStart.x, t.clientY - tapStart.y) < 12;
    const now = performance.now();
    const quick = isTap && now - lastTapEnd < 350;
    if (isTap) lastTapEnd = now;
    if (!e.cancelable) return;
    if (target.closest(".stage")) { e.preventDefault(); return; }
    if (quick) {
      e.preventDefault(); // 2回目の click は送られなくなるので、ボタンなら自分で押す
      const btn = target.closest("button, a");
      if (btn && !btn.disabled) btn.click();
    }
  }, { passive: false });

  // ===== 起動 =====
  if (window.ResizeObserver) new ResizeObserver(layout).observe(stage);
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", () => setTimeout(layout, 200));
  layout();
  const saved = loadState();
  if (saved) {
    ({ grid, score, prev, keepPlaying, moves, seed, bestFlashed, topTile } = saved);
    // ゲーム開始時のベストは保存データから戻す（旧形式で項目がないときは、いまのベスト）。
    // 保存されたベストより大きい値は使わない（ベストが消された場合など）
    bestAtStart = saved.bestAtStart !== undefined ? Math.min(saved.bestAtStart, best) : best;
    if (score > best) { best = score; saveBest(); }
    saveState();                 // 旧形式なら種を足して保存し直す
    rebuild(null);
    if (!keepPlaying && hasWon(grid)) showWin(false);
    else if (!canMove(grid)) showOver(false);
  } else {
    // 保存データがない・不正なとき：不正なデータは消して新しいゲームにする
    try { if (localStorage.getItem(KEY_STATE) !== null) localStorage.removeItem(KEY_STATE); } catch (e) { /* 使えない環境 */ }
    newGame();
  }
})();

// オフラインでも遊べるようにする（https か localhost のときだけ有効）
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("../../sw.js").catch(() => { /* 登録できなくてもゲームは遊べる */ });
  });
}
</script>
</body>
</html>
