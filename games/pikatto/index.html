<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆびあそび">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<title>ピカッと早押し</title>
<!-- デバッグ表示（?debug=1 のときだけ動く。読めなくてもゲームは動く） -->
<script src="../../common/debug.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<!--
  ピカッと早押し：2〜4人（またはひとりで れんしゅう）で、ひかったらタップする早押しゲーム。

  画面の流れ：
    #setup（人数選び）→ #play（4つのすみのボタンで早押し）→ #overlay（結果カード）

  ラウンドの状態（#field[data-phase]）：
    'ready'   … よーい（約 1000ms）。この間の押下は無視（PK-05）
    'waiting' … 合図前。押したらフライング（applyPress → foul）
    'armed'   … 合図中。押した時刻が合図より後なら勝ち（前ならフライング、PK-10）
    'resolved'… 結果が確定。次ラウンド or 終了カード
    'paused'  … 裏に回した・「？」を開いた。「つづける」で redoRound → よーい（PK-04）

  タイマー：readyTimer（よーい）→ signalTimer（待ち時間）→ fireSignal。
    最終結果を出す setTimeout は finalTimer、カードのボタンの鍵は lockTimer。
  入力：input.js の onPress は受付の窓（30ms）の分だけ遅れて届くので、
    よーい・一時停止かどうかは onPress を受けた時点で判断する。

  テスト用 API： window.PikattoGame = { getState, startRound, forceSignal, pressFor, reset }
-->
<style>
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #c3c8d8;
    --accent: #f0a43a;
    --accent-ink: #231705;
    /* Okabe-Ito 系（色覚の違いがあっても見分けやすい、PK-07） */
    --p1-color: #D55E00;  /* 朱 */
    --p2-color: #0072B2;  /* 青 */
    --p3-color: #F0E442;  /* 黄 */
    --p4-color: #009E73;  /* 青緑 */
    /* 隅の番号・図形の色（それぞれの地の色に対して濃く見える方） */
    --p1-ink: #111111;
    --p2-ink: #ffffff;
    --p3-ink: #111111;
    --p4-ink: #111111;
    --font-display: "Chakra Petch", "Hiragino Sans", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --font-text: "Hiragino Sans", system-ui, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  html { overscroll-behavior: none; touch-action: none; }
  body {
    margin: 0;
    font-size: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    padding-top: max(10px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    gap: 10px;
    max-width: 960px;
    margin: 0 auto;
  }
  .head { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .back {
    flex: 0 0 auto;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 16px var(--font-text);
    text-decoration: none;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .back:active { filter: brightness(1.3); }
  h1.title { margin: 0; flex: 1 1 auto; min-width: 0; font-size: 20px; letter-spacing: 0.04em; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .head-tools { display: flex; gap: 6px; flex: 0 0 auto; margin-left: auto; }
  .tool {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: 700 18px var(--font-display);
    padding: 0 8px;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool:active:not(:disabled) { filter: brightness(1.3); background: var(--panel); }
  .sound-btn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== 設定画面 ===== */
  .setup {
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding: 10px 2px;
    align-items: center;
    /* 中央寄せは first/last の auto margin で行う（高さが足りないとき上が切れてスクロールで戻れなくなるのを防ぐ） */
    justify-content: flex-start;
  }
  .setup > :first-child { margin-top: auto; }
  .setup > :last-child { margin-bottom: auto; }
  @media (max-height: 500px) {
    .setup { gap: 10px; }
    .players-pick button { min-height: 56px; }
  }
  .setup h2 { margin: 0; font-size: 22px; letter-spacing: 0.04em; text-align: center; }
  .setup .lead { margin: 0; color: var(--ink); font: 16px/1.6 var(--font-text); text-align: center; max-width: 32em; }
  .setup .rule {
    margin: 0;
    padding: 6px 14px;
    border-radius: 999px;
    border: 1px solid var(--accent);
    color: var(--ink);
    font: 700 16px/1.4 var(--font-text);
    text-align: center;
  }
  .players-pick {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: min(360px, 100%);
  }
  .players-pick button {
    box-sizing: border-box;
    min-height: 72px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 18px var(--font-display);
    letter-spacing: 0.04em;
    touch-action: manipulation;
    padding: 8px;
  }
  .players-pick button[aria-pressed="true"] {
    background: var(--panel);
    border-color: var(--accent);
    box-shadow: inset 0 0 0 3px var(--accent);
    color: var(--ink);
  }
  .players-pick button:active:not(:disabled) { filter: brightness(1.2); }
  .setup .start {
    box-sizing: border-box;
    width: min(360px, 100%);
    min-height: 56px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 18px var(--font-display);
    touch-action: manipulation;
  }
  .setup .start:disabled { opacity: 0.4; }
  .setup .start:active:not(:disabled) { filter: brightness(1.1); }

  /* ===== プレイ画面 ===== */
  .play {
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-areas: "sc" "field" "hint";
    gap: 8px;
    touch-action: none;
  }
  .scoreboard {
    grid-area: sc;
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
    min-width: 0;
  }
  .score {
    box-sizing: border-box;
    min-width: 56px;
    min-height: 36px;
    padding: 4px 8px;
    border-radius: 10px;
    background: var(--panel);
    border: 1px solid var(--line);
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font: 700 16px var(--font-text);
    color: var(--ink);
    white-space: nowrap;
  }
  .score .dot {
    flex: 0 0 auto;
    width: 14px; height: 14px; border-radius: 50%;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  .score[data-player="1"] .dot { background: var(--p1-color); }
  .score[data-player="2"] .dot { background: var(--p2-color); }
  .score[data-player="3"] .dot { background: var(--p3-color); }
  .score[data-player="4"] .dot { background: var(--p4-color); }
  .score .n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 18px; min-width: 1.2em; text-align: right; }
  .score .label { font-size: 16px; color: var(--ink); }

  .field {
    grid-area: field;
    position: relative;
    min-height: 0;
    min-width: 0;
    background: var(--well);
    border-radius: 12px;
    box-shadow: 0 0 0 2px var(--line);
    overflow: hidden;
    touch-action: none;
  }
  /* 4つのすみのボタン：上下・左右のすみの間に必ず 6px のすき間（PK-02） */
  .corner {
    position: absolute;
    box-sizing: border-box;
    width: calc(50% - 9px);
    height: calc(50% - 9px);
    min-width: 44px;
    min-height: 44px;
    border: 2px solid rgba(255, 255, 255, 0.08);
    border-radius: 16px;
    padding: 0;
    color: var(--c-ink);
    touch-action: none;
    -webkit-touch-callout: none;
    user-select: none;
    cursor: pointer;
    /* 待っている間は少し暗く。合図のときに「光る」のがわかるように */
    /* 地の色だけ暗くする（番号・図形の文字は暗くしない。コントラストを保つ） */
    background-image: linear-gradient(rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.22));
    transition: filter 160ms ease-out, transform 100ms ease-out;
  }
  .corner[data-player="1"] { top: 6px;    left: 6px;    background: var(--p1-color); --c-ink: var(--p1-ink); }
  .corner[data-player="2"] { top: 6px;    right: 6px;   background: var(--p2-color); --c-ink: var(--p2-ink); }
  .corner[data-player="3"] { bottom: 6px; left: 6px;    background: var(--p3-color); --c-ink: var(--p3-ink); }
  .corner[data-player="4"] { bottom: 6px; right: 6px;   background: var(--p4-color); --c-ink: var(--p4-ink); }
  /* 2人：2P は右下（対角、PK-03） */
  .field[data-players="2"] .corner[data-player="2"] { top: auto; bottom: 6px; }
  /* ひとりで れんしゅう：フィールド全体が 1P のボタン（PK-25） */
  .field[data-players="1"] .corner[data-player="1"] { inset: 0; width: auto; height: auto; border-radius: 12px; }
  /* 色だけに頼らず、番号と図形でも区別する（番号は濃く、図形は中央に 48px 以上、PK-07） */
  .corner::before {
    content: attr(data-player);
    position: absolute;
    top: 6px; left: 10px;
    font: 700 22px/1 var(--font-mono);
    color: var(--c-ink);
  }
  .corner::after {
    content: attr(data-icon);
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 56px/1 var(--font-text);
    color: var(--c-ink);
  }
  /* 3人・4人：上のすみ（1P・2P）の番号と図形は、向かい側の人から読めるよう 180° 回す（PK-26） */
  .field[data-players="3"] .corner[data-player="1"]::before,
  .field[data-players="3"] .corner[data-player="1"]::after,
  .field[data-players="3"] .corner[data-player="2"]::before,
  .field[data-players="3"] .corner[data-player="2"]::after,
  .field[data-players="4"] .corner[data-player="1"]::before,
  .field[data-players="4"] .corner[data-player="1"]::after,
  .field[data-players="4"] .corner[data-player="2"]::before,
  .field[data-players="4"] .corner[data-player="2"]::after { transform: rotate(180deg); }
  /* 合図中（armed）：すぐ光る（transition なし、PK-13）。明るさだけでなく白い太枠でも伝える */
  .field[data-phase="armed"] .corner {
    background-image: none;
    filter: brightness(1.1);
    box-shadow: inset 0 0 0 5px #ffffff;
    transition: none;
  }
  .field[data-phase="resolved"] .corner { background-image: linear-gradient(rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0.22)); }
  .corner[data-lit="on"] { background-image: none; filter: brightness(1.25) saturate(1.1); box-shadow: inset 0 0 0 5px #ffffff, 0 0 0 3px rgba(255, 255, 255, 0.6); }
  .corner:active { transform: scale(0.985); }

  /* 合図：中央に濃い色の「ピカッ！」と、フィールドの淡い光（PK-08・PK-19） */
  .signal {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    will-change: opacity;
    transition: opacity 120ms ease-out;
  }
  .signal::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at center, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0) 70%);
    opacity: 0;
  }
  .signal .word {
    position: relative;
    padding: 6px 18px;
    border-radius: 16px;
    background: #fff6c2;
    color: #1b1206;
    font: 700 48px/1.1 var(--font-text);
    letter-spacing: 0.02em;
    white-space: nowrap;
    box-shadow: 0 0 0 3px #1b1206, 0 6px 18px rgba(0, 0, 0, 0.45);
  }
  .signal[data-phase="armed"] { opacity: 1; transition: none; }
  .signal[data-phase="armed"]::before { animation: flash 350ms ease-out both; }
  @keyframes flash {
    0% { opacity: 1; }
    100% { opacity: 0.35; }
  }

  /* ヒント：高さは2行分で固定（PK-12） */
  .hint {
    grid-area: hint;
    margin: 0;
    box-sizing: border-box;
    height: calc(2 * 1.4em);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    text-align: center;
    color: var(--ink);
    font: 500 16px/1.4 var(--font-text);
  }
  .hint > span { display: block; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hint .round { font-weight: 700; }

  /* iPhone 横 */
  @media (orientation: landscape) and (max-height: 500px) {
    .corner::before { font-size: 18px; top: 4px; left: 8px; }
    .corner::after { font-size: 48px; }
    .signal .word { padding: 2px 14px; }
  }
  /* とても低い横画面（SE の Safari 横 568×270 など）：すき間を詰めて、4人の上下の隅（44px 以上・すき間 6px）がフィールドに収まる高さを空ける（X-17） */
  @media (orientation: landscape) and (max-height: 300px) {
    .app { gap: 6px; padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    .play { gap: 4px; }
  }
  @media (max-width: 480px) {
    .head { flex-wrap: wrap; row-gap: 4px; }
    h1.title { order: 3; flex: 1 0 100%; font-size: 18px; }
  }

  /* ===== オーバーレイ ===== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: rgba(13, 17, 29, 0.78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .overlay.soft { background: rgba(13, 17, 29, 0.5); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .card {
    width: min(380px, 100%);
    box-sizing: border-box;
    margin: auto;
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card:focus { outline: none; }
  .card h2 { margin: 0; font-size: 24px; letter-spacing: 0.04em; overflow-wrap: anywhere; }
  .card p { margin: 0; color: var(--ink); font: 16px/1.6 var(--font-text); overflow-wrap: anywhere; }
  .card p.res { font-size: 18px; font-weight: 700; }
  .card .best-new {
    align-self: center;
    padding: 4px 14px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 18px/1.4 var(--font-text);
  }
  .card .howto { margin: 0; text-align: left; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 10px; font: 16px/1.5 var(--font-text); }
  .card .howto dt { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .card .howto dd { margin: 0; color: var(--ink); }
  .card .btns { display: flex; flex-direction: column; gap: 10px; }
  .card .row { display: flex; gap: 10px; }
  .cta {
    flex: 1;
    min-width: 0;
    min-height: 50px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 700 16px var(--font-display);
    touch-action: manipulation;
    transition: opacity 120ms ease-out;
  }
  .cta.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .cta:disabled { opacity: 0.45; }
  .cta:active:not(:disabled) { filter: brightness(1.2); }
  .card .winner-dot {
    display: inline-block;
    width: 18px; height: 18px;
    border-radius: 50%;
    vertical-align: -3px;
    margin-right: 6px;
    box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  }
  /* 最終結果：勝った人の色を大きく（PK-14） */
  .card .winner-mark {
    align-self: center;
    width: 96px; height: 96px;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font: 700 56px/1 var(--font-text);
    box-shadow: 0 0 0 3px #ffffff;
  }
  @media (orientation: landscape) and (max-height: 500px) {
    .card { padding: 14px 18px; gap: 8px; }
    .card .winner-mark { width: 60px; height: 60px; font-size: 36px; border-radius: 14px; }
  }

  /* 動きを減らす設定：アニメーションを止め、画面を白くしない（「ピカッ！」と隅の枠で伝える、PK-19） */
  @media (prefers-reduced-motion: reduce) {
    .signal, .signal[data-phase="armed"] { transition: none; }
    .signal::before, .signal[data-phase="armed"]::before { display: none; animation: none; }
    .corner { transition: none; }
    .cta { transition: none; }
  }
</style>
</head>
<body>

<main class="app" id="app">
  <header class="head">
    <a id="back" class="back" href="../../" aria-label="メニューへ戻る">← メニュー</a>
    <h1 class="title">ピカッと早押し</h1>
    <div class="head-tools">
      <button id="help-btn" class="tool" type="button" aria-label="遊び方">？</button>
      <button id="sound-btn" class="tool sound-btn" type="button" aria-label="音のオン/オフ" aria-pressed="true">♪</button>
    </div>
  </header>

  <!-- 設定画面 -->
  <section class="setup" id="setup" aria-label="設定">
    <h2>にんずうをえらぶ</h2>
    <p class="lead">ひかったら、じぶんの色を タップ。<br>ひかるまえに おすと、ほかのみんなに 1点。</p>
    <div class="players-pick" id="players-pick" role="group" aria-label="人数">
      <button type="button" data-players="2" aria-pressed="true">2人</button>
      <button type="button" data-players="3" aria-pressed="false">3人</button>
      <button type="button" data-players="4" aria-pressed="false">4人</button>
      <button type="button" data-players="solo" aria-pressed="false">ひとりで れんしゅう</button>
    </div>
    <p class="rule">さきに 3点とったら 勝ち（5回で おわり）</p>
    <button class="start" type="button" data-action="start">はじめる</button>
  </section>

  <!-- プレイ画面 -->
  <section class="play" id="play" aria-label="プレイ" hidden>
    <div class="scoreboard" id="scores"></div>
    <div class="field" id="field" data-phase="waiting" data-players="2">
      <button class="corner" type="button" data-player="1" data-color="red"    data-icon="●" aria-label="1P（●）"></button>
      <button class="corner" type="button" data-player="2" data-color="blue"   data-icon="■" aria-label="2P（■）"></button>
      <button class="corner" type="button" data-player="3" data-color="yellow" data-icon="▲" aria-label="3P（▲）" hidden></button>
      <button class="corner" type="button" data-player="4" data-color="green"  data-icon="◆" aria-label="4P（◆）" hidden></button>
      <div class="signal" id="signal" aria-hidden="true"></div>
    </div>
    <p class="hint" id="hint" aria-live="polite"></p>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title" tabindex="-1"></div>
</div>

<script src="../../common/sfx.js"></script>
<script src="../../common/version.js"></script>
<script src="logic.js"></script>
<script src="input.js"></script>
<script>
(() => {
  "use strict";

  const KEY_HELP = "pikatto.help";
  const KEY_BEST_SOLO = "pikatto.bestSolo";
  const KEY_BEST_AVG_SOLO = "pikatto.bestAvgSolo";
  const WIN_SCORE = 3;
  const MAX_ROUNDS = 5;
  const READY_MS = 1000;        // よーい（PK-05）
  const CARD_LOCK_MS = 600;     // 結果カードのボタンを押せない時間（PK-11）
  const PLAYER_ICONS = ["●", "■", "▲", "◆"];

  const $ = (id) => document.getElementById(id);
  const el = {
    setup: $("setup"),
    play: $("play"),
    playersPick: $("players-pick"),
    startBtn: $("setup").querySelector('[data-action="start"]'),
    field: $("field"),
    signal: $("signal"),
    scores: $("scores"),
    hint: $("hint"),
    overlay: $("overlay"),
    card: $("card"),
    app: $("app"),
    helpBtn: $("help-btn"),
    soundBtn: $("sound-btn"),
    corners: Array.from(document.querySelectorAll(".corner"))
  };
  const reduceMotion = window.matchMedia ? window.matchMedia("(prefers-reduced-motion: reduce)") : { matches: false };

  // ===== 効果音（common/sfx.js が無くても落ちない） =====
  const sfx = window.YubiSfx ? window.YubiSfx.create("pikatto")
    : { on: false, unlock() {}, toggle() { return false; }, play() {}, buzz() {} };
  document.addEventListener("pointerdown", () => sfx.unlock(), { capture: true });
  document.addEventListener("touchend", () => sfx.unlock(), { capture: true });
  function renderSoundBtn() {
    el.soundBtn.setAttribute("aria-pressed", String(!!sfx.on));
    el.soundBtn.setAttribute("aria-label", sfx.on ? "音：オン" : "音：オフ");
  }
  el.soundBtn.addEventListener("click", () => { sfx.toggle(); renderSoundBtn(); });
  renderSoundBtn();

  // ===== 状態（画面側のみ。ゲームの中身の状態は logic.js の state） =====
  let screen = "setup";          // "setup" | "play"
  let selectedPlayers = 2;       // 2 | 3 | 4 | "solo"（最初から2人、PK-18）
  let gameState = null;          // PikattoLogic.createGame の返り値
  let ready = false;             // 「よーい」中（PK-05）
  let paused = false;            // 一時停止中（PK-04）
  let readyTimer = 0;            // よーい → 待ち時間
  let signalTimer = 0;           // 待ち時間 → 合図
  let finalTimer = 0;            // 最終結果のカードを出す（PK-21）
  let lockTimer = 0;             // カードのボタンの鍵（PK-11）
  let input = null;              // PikattoInput.attach の返り値
  let currentCard = null;        // いま出しているカード（遊び方を閉じたら戻すため）
  let returnCard = null;         // 遊び方を閉じたときに戻すカード
  let bestUpdated = false;       // このラウンドでベストを更新した（PK-15）
  let focusBeforeCard = null;    // カードを開く前にフォーカスがあった要素（閉じたら戻す）
  let bestSolo = loadBestSolo();
  let bestAvgSolo = loadBestAvgSolo();
  let prevBestSolo = 0;          // このラウンドの前のベスト（ベストまでの差の表示用）

  // ===== 保存データ =====
  function loadBestSolo() {
    try {
      const raw = localStorage.getItem(KEY_BEST_SOLO);
      if (raw === null) return 0;
      // logic.js が無くても最低限の検証（50..5000 の整数）
      const L = window.PikattoLogic;
      if (L && typeof L.validateBestSolo === "function") return L.validateBestSolo(raw);
      const n = Number(raw);
      return Number.isInteger(n) && n >= 50 && n <= 5000 ? n : 0;
    } catch (e) { return 0; }
  }
  function saveBestSolo(ms) {
    try { localStorage.setItem(KEY_BEST_SOLO, String(ms)); } catch (e) {
      // 保存できなくても遊べる（プライベートモードなど）。原因は開発者向けに残す
      if (window.console) console.warn("pikatto: ベストを保存できませんでした", e);
    }
  }
  // へいきんのベスト：ベストと同じ検証（50..5000 の整数）。壊れた値は 0 扱い
  function loadBestAvgSolo() {
    try {
      const raw = localStorage.getItem(KEY_BEST_AVG_SOLO);
      if (raw === null) return 0;
      const L = window.PikattoLogic;
      if (L && typeof L.validateBestSolo === "function") return L.validateBestSolo(raw);
      const n = Number(raw);
      return Number.isInteger(n) && n >= 50 && n <= 5000 ? n : 0;
    } catch (e) { return 0; }
  }
  function saveBestAvgSolo(ms) {
    try { localStorage.setItem(KEY_BEST_AVG_SOLO, String(ms)); } catch (e) {
      if (window.console) console.warn("pikatto: へいきんのベストを保存できませんでした", e);
    }
  }
  function helpSeen() { try { return localStorage.getItem(KEY_HELP) === "1"; } catch (e) { return false; } }
  function markHelpSeen() { try { localStorage.setItem(KEY_HELP, "1"); } catch (e) { /* 次回もう一度出るだけ */ } }

  // ===== 表示用の小さな関数（副作用なし） =====
  const fmtSec = (ms) => String(Number((ms / 1000).toFixed(2)));
  const fmtMs = (ms) => `${Math.round(ms)} ms（${fmtSec(Math.round(ms))}びょう）`;
  const colorFor = (i) => ["var(--p1-color)", "var(--p2-color)", "var(--p3-color)", "var(--p4-color)"][i] || "var(--ink)";
  const inkFor = (i) => ["var(--p1-ink)", "var(--p2-ink)", "var(--p3-ink)", "var(--p4-ink)"][i] || "var(--bg)";
  const nameFor = (i) => (i + 1) + "P";
  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  // ===== 設定画面 =====
  function selectPlayers(v) {
    selectedPlayers = v;
    el.playersPick.querySelectorAll("button").forEach((b) => {
      b.setAttribute("aria-pressed", String(String(b.dataset.players) === String(v)));
    });
    el.startBtn.disabled = selectedPlayers === null;
  }
  el.playersPick.addEventListener("click", (e) => {
    const b = e.target.closest("button[data-players]");
    if (!b) return;
    sfx.unlock();
    sfx.play("toggle");
    const v = b.dataset.players === "solo" ? "solo" : Number(b.dataset.players);
    selectPlayers(v);
  });
  el.startBtn.addEventListener("click", () => {
    if (el.startBtn.disabled) return;
    sfx.unlock();
    sfx.play("start");
    startGame();
  });

  // ===== タイマー =====
  function clearRoundTimers() {
    clearTimeout(readyTimer); readyTimer = 0;
    clearTimeout(signalTimer); signalTimer = 0;
  }
  function clearFinalTimer() { clearTimeout(finalTimer); finalTimer = 0; }

  // ===== ゲーム開始 =====
  function startGame() {
    const L = window.PikattoLogic;
    if (!L) {
      el.hint.textContent = "読み込み中です…";
      return;
    }
    clearRoundTimers();
    clearFinalTimer();
    const mode = selectedPlayers === "solo" ? "solo" : "vs";
    const players = mode === "solo" ? 1 : selectedPlayers;
    // reactionMs の時刻起点を performance.now() に揃える
    // （input.js の pressedAt は normalizeTs(event.timeStamp) = performance.now() と同じ起点）
    gameState = L.createGame({ players, mode, now: () => performance.now() });
    screen = "play";
    paused = false;
    ready = false;
    el.setup.hidden = true;
    el.play.hidden = false;
    hideOverlay();
    showScoreboard();
    showCorners();
    if (input) input.detach();
    input = null;
    if (window.PikattoInput) {
      input = window.PikattoInput.attach(el.field, {
        onPress: handlePress,
        onCornerDown: (p) => markLit(p && p.playerIdx, true),
        onCornerUp:   (p) => markLit(p && p.playerIdx, false)
      });
    }
    startRound();
  }
  function scoreValueText(i) {
    if (gameState.mode === "solo") return bestSolo > 0 ? bestSolo + " ms" : "—";
    return String(gameState.scores[i] || 0);
  }
  function showScoreboard() {
    el.scores.innerHTML = "";
    const n = gameState.mode === "solo" ? 1 : gameState.players;
    for (let i = 0; i < n; i++) {
      const d = document.createElement("div");
      d.className = "score";
      d.dataset.player = String(i + 1);
      d.innerHTML = `<span class="dot" aria-hidden="true"></span><span class="label"></span><span class="n"></span>`;
      d.querySelector(".label").textContent = gameState.mode === "solo" ? "ベスト" : nameFor(i);
      el.scores.appendChild(d);
    }
    updateScoreboard();
  }
  function updateScoreboard() {
    el.scores.querySelectorAll(".score").forEach((d) => {
      const i = Number(d.dataset.player) - 1;
      const val = scoreValueText(i);
      d.querySelector(".n").textContent = val;
      d.setAttribute("aria-label", gameState.mode === "solo" ? `ベスト：${val}` : `${nameFor(i)}（${PLAYER_ICONS[i]}）：${val}点`);
    });
  }
  function showCorners() {
    const n = gameState.mode === "solo" ? 1 : gameState.players;
    el.field.dataset.players = String(n);
    el.corners.forEach((c) => {
      c.hidden = Number(c.dataset.player) > n;
      c.removeAttribute("data-lit");
    });
  }
  function markLit(playerIdx, on) {
    const c = el.corners[playerIdx];
    if (!c) return;
    if (on) c.setAttribute("data-lit", "on");
    else c.removeAttribute("data-lit");
  }
  function clearLit() { el.corners.forEach((c) => c.removeAttribute("data-lit")); }
  function signalOff() {
    el.signal.removeAttribute("data-phase");
    el.signal.textContent = "";
  }

  // ===== ヒント（1行目：回数、2行目：いまの状態。高さは2行分で固定） =====
  function setHint(msg) {
    if (!gameState) { el.hint.textContent = msg || ""; return; }
    const head = `${gameState.round}回目（全${MAX_ROUNDS}回）` + (gameState.mode === "solo" ? "" : `・${WIN_SCORE}点で勝ち`);
    el.hint.innerHTML = `<span class="round"></span><span class="msg"></span>`;
    el.hint.querySelector(".round").textContent = head;
    el.hint.querySelector(".msg").textContent = msg || "";
  }

  // ===== ラウンド =====
  function startRound() {
    const L = window.PikattoLogic;
    if (!L || !gameState) return;
    clearRoundTimers();
    clearFinalTimer();
    if (input) input.reset();
    gameState = L.startRound(gameState);
    if (gameState.phase === "done") { showFinalResult(); return; }
    beginReady();
  }
  // よーい（約 1000ms、押しても無視）→ 待ち時間 → 合図
  function beginReady() {
    paused = false;
    ready = true;
    bestUpdated = false;
    el.field.dataset.phase = "ready";
    signalOff();
    clearLit();
    setHint("よーい…");
    sfx.play("ready");
    readyTimer = setTimeout(endReady, READY_MS);
    focusFirstCorner();
  }
  // キーボード・スイッチ操作の人が、ラウンドごとに Tab で隅まで戻らなくてよいように
  function focusFirstCorner() {
    if (!el.overlay.hidden) return;
    const c = el.corners[0];
    if (c && !c.hidden && document.activeElement !== c) c.focus({ preventScroll: true });
  }
  function endReady() {
    readyTimer = 0;
    if (!gameState || paused || gameState.phase !== "waiting") return;
    // よーいの終わり際の押下が受付の窓（30ms）に残っていると、ready=false の後に届いてフライングになる。
    // よーい中の押下は無視する決まりなので、窓に溜まった分をここで捨てる（押しっぱなしは残す）
    if (input) input.discard();
    ready = false;
    el.field.dataset.phase = "waiting";
    setHint("ひかったら じぶんの色を タップ");
    const delay = Math.max(0, Number(gameState.signalDelay) || 1000);
    signalTimer = setTimeout(fireSignal, delay);
  }
  function fireSignal() {
    const L = window.PikattoLogic;
    signalTimer = 0;
    if (!L || !gameState || paused || gameState.phase !== "waiting") return;
    ready = false;
    gameState = L.applySignal(gameState);
    el.field.dataset.phase = "armed";
    el.signal.innerHTML = `<span class="word">ピカッ！</span>`;
    el.signal.dataset.phase = "armed";
    sfx.play("signal");
    setHint("いまだ！");
  }
  // 押下（input.js からも pressFor からも）。受け付けたら true
  function handlePress({ playerIdx, pressedAt }) {
    const L = window.PikattoLogic;
    if (!L || !gameState || screen !== "play") return false;
    // よーい・一時停止中は無視（フライングにしない）。判断は押下が届いた時点で行う
    if (ready || paused) return false;
    if (gameState.phase !== "waiting" && gameState.phase !== "armed") return false;
    const { state: next, outcome } = L.applyPress(gameState, { playerIdx, pressedAt });
    if (outcome.kind === "ignore") return false;
    gameState = next;
    clearRoundTimers();
    if (input) input.reset();
    el.field.dataset.phase = "resolved";
    signalOff();
    bestUpdated = false;
    if (outcome.kind === "foul") {
      sfx.play("foul");
      sfx.buzz([60, 40, 120]);
      setHint("まだだよ！");
    } else if (outcome.kind === "win") {
      sfx.play("win");
      setHint(gameState.mode === "solo" ? fmtMs(outcome.reactionMs) : `${nameFor(outcome.player)} の 1点！`);
      // ひとりで れんしゅう：ベスト更新
      if (gameState.mode === "solo" && Number.isFinite(outcome.reactionMs)) {
        const ms = Math.round(outcome.reactionMs);
        prevBestSolo = bestSolo;
        if (Number.isInteger(ms) && ms >= 50 && ms <= 5000 && (bestSolo === 0 || ms < bestSolo)) {
          bestSolo = ms;
          saveBestSolo(bestSolo);
          bestUpdated = true;
          sfx.play("best");
        }
      }
    }
    updateScoreboard();
    showRoundResult(outcome);
    return true;
  }

  // ===== 一時停止（PK-04） =====
  function canPause() {
    return screen === "play" && !!gameState && !paused && (gameState.phase === "waiting" || gameState.phase === "armed");
  }
  function pauseRound() {
    clearRoundTimers();
    if (input) input.reset();
    ready = false;
    paused = true;
    el.field.dataset.phase = "paused";
    signalOff();
    clearLit();
    setHint("とまっています");
  }
  function resumeRound() {
    const L = window.PikattoLogic;
    hideOverlay();
    if (!L || !gameState || !paused) return;
    gameState = L.redoRound(gameState);    // 回数・点数はそのまま、待ち時間を引き直す
    if (input) input.reset();
    beginReady();
  }
  function showPauseCard() {
    showCard(`
      <h2>とまっています</h2>
      <p>この回は、よーいから やりなおします。点は そのままです。</p>
      <div class="btns">
        <div class="row"><button class="cta primary" type="button" data-cmd="resume">つづける</button></div>
        <div class="row"><button class="cta" type="button" data-cmd="menu">メニューへ</button></div>
      </div>
    `);
  }
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) return;
    if (!canPause()) return;
    pauseRound();
    showPauseCard();
  });

  // ===== 結果カード =====
  function showRoundResult(outcome) {
    if (gameState.phase === "done") {
      clearFinalTimer();
      finalTimer = setTimeout(() => { finalTimer = 0; showFinalResult(); }, reduceMotion.matches ? 100 : 400);
      return;
    }
    const solo = gameState.mode === "solo";
    let title = "";
    let body = "";
    let mark = "";
    let extra = "";
    if (outcome.kind === "win") {
      title = solo ? "はやさ" : `${nameFor(outcome.player)} の 1点！`;
      body = solo ? fmtMs(outcome.reactionMs) : `はやさ ${fmtMs(outcome.reactionMs)}`;
      if (solo) {
        const ms = Math.round(outcome.reactionMs);
        if (bestUpdated && prevBestSolo > 0 && prevBestSolo > ms) extra = `まえのベストより ${prevBestSolo - ms} ms はやい`;
        else if (!bestUpdated && bestSolo > 0 && ms > bestSolo) extra = `ベストまで あと ${ms - bestSolo} ms`;
      }
      if (!solo) mark = `<span class="winner-dot" style="background:${colorFor(outcome.player)}"></span>`;
    } else if (outcome.kind === "foul") {
      title = "まだだよ！";
      body = solo
        ? "ひかるまえに おしました"
        : `${PLAYER_ICONS[outcome.foulBy] || ""} ${nameFor(outcome.foulBy)} が ひかるまえに おしたので、ほかのみんなに 1点`;
      if (!solo) mark = `<span class="winner-dot" style="background:${colorFor(outcome.foulBy)}"></span>`;
    }
    showCard(`
      <h2>${mark}${escapeHtml(title)}</h2>
      <p class="res">${escapeHtml(body)}</p>
      ${extra ? `<p>${escapeHtml(extra)}</p>` : ""}
      ${bestUpdated ? `<p class="best-new">ベスト更新！</p>` : ""}
      ${scoresLineHtml()}
      <div class="btns">
        <div class="row"><button class="cta primary" type="button" data-cmd="next">つぎへ</button></div>
        <div class="row">
          <button class="cta" type="button" data-cmd="again">さいしょから</button>
          <button class="cta" type="button" data-cmd="menu">メニューへ</button>
        </div>
      </div>
    `, { soft: true, lock: true, best: bestUpdated });
  }
  function showFinalResult() {
    clearFinalTimer();
    if (!gameState || gameState.phase !== "done") return;
    sfx.play("finish");
    const w = gameState.winner;
    const solo = gameState.mode === "solo";
    const top = Math.max.apply(null, gameState.scores);
    let title, body, mark = "";
    let avgLine = "";
    let avgUpdated = false;
    if (solo) {
      const L = window.PikattoLogic;
      const avg = L && typeof L.averageMs === "function" ? L.averageMs(gameState.reactions || []) : null;
      title = "おつかれさま";
      body = (avg !== null && avg !== undefined)
        ? `へいきん ${fmtMs(avg)}`
        : "きろくなし";
      const avgMs = (avg !== null && avg !== undefined) ? Math.round(avg) : 0;
      if (avgMs >= 50 && avgMs <= 5000) {
        if (bestAvgSolo === 0 || avgMs < bestAvgSolo) {
          bestAvgSolo = avgMs;
          saveBestAvgSolo(bestAvgSolo);
          avgUpdated = true;
        }
      }
      if (bestAvgSolo > 0) avgLine = `<p>へいきんの ベスト ${escapeHtml(fmtMs(bestAvgSolo))}</p>`;
    } else if (w === "draw") {
      title = "ひきわけ";
      body = "いちばん多い点が 同じでした";
    } else {
      title = `${nameFor(w)} の勝ち！`;
      body = top >= WIN_SCORE ? `${WIN_SCORE}点とった！` : `${MAX_ROUNDS}回 おわって いちばん 点が多い`;
      mark = `<div class="winner-mark" aria-hidden="true" style="background:${colorFor(w)};color:${inkFor(w)}">${PLAYER_ICONS[w] || ""}</div>`;
    }
    const bestLine = solo && bestSolo > 0 ? `<p>ベスト ${escapeHtml(fmtMs(bestSolo))}</p>` : "";
    showCard(`
      ${mark}
      <h2>${escapeHtml(title)}</h2>
      <p class="res">${escapeHtml(body)}</p>
      ${bestUpdated ? `<p class="best-new">ベスト更新！</p>` : ""}
      ${avgUpdated ? `<p class="best-new">へいきん ベスト更新！</p>` : ""}
      ${avgLine}
      ${bestLine}
      ${scoresLineHtml()}
      <div class="btns">
        <div class="row"><button class="cta primary" type="button" data-cmd="again">もう一度</button></div>
        <div class="row"><button class="cta" type="button" data-cmd="menu">メニューへ</button></div>
      </div>
    `, { soft: true, lock: true, final: true, best: bestUpdated });
  }
  function scoresLineHtml() {
    if (gameState.mode === "solo") return "";
    const parts = [];
    for (let i = 0; i < gameState.players; i++) {
      parts.push(`<span style="white-space:nowrap">${PLAYER_ICONS[i]} ${nameFor(i)}:${gameState.scores[i] || 0}</span>`);
    }
    return `<p>${parts.join("　")}</p>`;
  }
  // resume=true：プレイ中に開いたとき（close の代わりに「つづける」）
  function showHelpCard({ resume = false } = {}) {
    const btn = resume
      ? `<button class="cta primary" type="button" data-cmd="resume">つづける</button>`
      : `<button class="cta primary" type="button" data-cmd="close">わかった</button>`;
    showCard(`
      <h2>遊び方</h2>
      <dl class="howto">
        <dt>にんずう</dt><dd>2〜4人。4つのすみのボタンに1人ずつ。ひとりで れんしゅう もできます。</dd>
        <dt>ひかる</dt><dd>よーいの あと、1〜4秒で 画面がピカッと ひかります。</dd>
        <dt>勝ち</dt><dd>ひかったら じぶんの色を タップ。いちばん はやい人に 1点。さきに 3点とったら 勝ち。5回で おわり、同じ点なら ひきわけ。</dd>
        <dt>まだ</dt><dd>ひかるまえに おすと、ほかのみんなに 1点。</dd>
        <dt>れんしゅう</dt><dd>ひかってから おすまでの はやさを はかります。はやさは ms（1000分の1秒）で 出ます。</dd>
        <dt>iPad</dt><dd>4本・5本指のジェスチャーは、iPad の設定でオフにすると安全です。</dd>
      </dl>
      <div class="btns"><div class="row">${btn}</div></div>
    `);
  }

  // opts: soft（背景を薄く）、lock（600ms ボタンを押せない）、final（data-final）、best（data-best）
  function showCard(html, opts = {}) {
    const { soft = false, lock = false, final = false, best = false } = opts;
    clearTimeout(lockTimer); lockTimer = 0;
    currentCard = { html, opts };
    el.card.innerHTML = html;
    if (final) el.card.dataset.final = "1"; else delete el.card.dataset.final;
    if (best) el.card.dataset.best = "1"; else delete el.card.dataset.best;
    el.overlay.classList.toggle("soft", soft);
    if (el.overlay.hidden) {
      const a = document.activeElement;
      focusBeforeCard = a && a !== document.body && !el.overlay.contains(a) ? a : null;
    }
    // 開いている間は後ろを操作・読み上げの対象から外す（Tab で後ろの隅や「？」に出ない）
    el.app.inert = true;
    el.app.setAttribute("aria-hidden", "true");
    // 見出しをダイアログの名前に、結果の行を説明にする
    const title = el.card.querySelector("h2");
    if (title) title.id = "card-title";
    const desc = el.card.querySelector("p.res");
    if (desc) { desc.id = "card-desc"; el.card.setAttribute("aria-describedby", "card-desc"); }
    else el.card.removeAttribute("aria-describedby");
    el.overlay.hidden = false;
    el.overlay.scrollTop = 0;
    const btns = Array.from(el.card.querySelectorAll("button"));
    const focusPrimary = () => {
      const primary = el.card.querySelector(".primary");
      if (primary) primary.focus({ preventScroll: true });
    };
    if (lock) {
      btns.forEach((b) => { b.disabled = true; });
      // 押せない間はカード自体にフォーカスを置き、見出し（だれの勝ちか）を読み上げる
      el.card.focus({ preventScroll: true });
      lockTimer = setTimeout(() => {
        lockTimer = 0;
        btns.forEach((b) => { b.disabled = false; });
        focusPrimary();
      }, CARD_LOCK_MS);
    } else {
      focusPrimary();
    }
  }
  function hideOverlay() {
    clearTimeout(lockTimer); lockTimer = 0;
    el.overlay.hidden = true;
    el.overlay.classList.remove("soft");
    el.app.inert = false;
    el.app.removeAttribute("aria-hidden");
    // 開く前のフォーカスに戻す（ラウンドを始めるときは beginReady が 1P の隅へ移す）
    const back = focusBeforeCard;
    focusBeforeCard = null;
    if (back && back.isConnected && !back.disabled && !back.closest("[hidden]")) back.focus({ preventScroll: true });
    delete el.card.dataset.final;
    delete el.card.dataset.best;
    currentCard = null;
    returnCard = null;
  }

  el.overlay.addEventListener("click", (e) => {
    const b = e.target.closest?.("[data-cmd]");
    if (!b || b.disabled) return;
    const cmd = b.dataset.cmd;
    if (cmd === "next") { hideOverlay(); startRound(); }
    else if (cmd === "again") { hideOverlay(); startGame(); }
    else if (cmd === "menu") { location.href = "../../"; }
    else if (cmd === "resume") { markHelpSeen(); resumeRound(); }
    else if (cmd === "close") {
      markHelpSeen();
      const back = returnCard;
      hideOverlay();
      // 結果カードの上から開いたときは、そのカードに戻す（鍵はかけ直さない）
      if (back) showCard(back.html, Object.assign({}, back.opts, { lock: false }));
    }
  });
  el.helpBtn.addEventListener("click", () => {
    sfx.unlock();
    // プレイ中（よーい・待ち・合図中）は止めてから遊び方を出す（PK-04）
    if (paused || canPause()) {
      if (!paused) pauseRound();
      showHelpCard({ resume: true });
      return;
    }
    const back = el.overlay.hidden ? null : currentCard;
    showHelpCard({ resume: false });
    returnCard = back;
  });

  // ===== iOS：長押しメニュー・拡大・引っ張り更新を止める =====
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  ["gesturestart", "gesturechange", "gestureend"].forEach((type) => {
    document.addEventListener(type, (e) => e.preventDefault(), { passive: false });
  });
  document.addEventListener("touchmove", (e) => {
    if (e.cancelable && !e.target.closest?.(".overlay, .setup")) e.preventDefault();
  }, { passive: false });
  document.addEventListener("dblclick", (e) => e.preventDefault(), { passive: false });
  // 350ms 以内の2回目のタップ（スクロールではない）の touchend を止めて、ダブルタップ拡大を防ぐ。
  // 止めると click は送られないため、ボタン・リンクなら自分で click を送る（既存ゲームと同じ流儀）。
  // .overlay 内は（モーダルのスクロールと click を保つため）この処理をかけない。
  let lastTapEnd = 0, tapStart = null;
  document.addEventListener("touchstart", (e) => {
    const t = e.touches[0];
    tapStart = e.touches.length === 1 && t ? { x: t.clientX, y: t.clientY } : null;
  }, { passive: true, capture: true });
  document.addEventListener("touchend", (e) => {
    const target = e.target;
    if (!target.closest || target.closest(".overlay")) return;
    const t = e.changedTouches[0];
    const isTap = tapStart && t && e.touches.length === 0 && Math.hypot(t.clientX - tapStart.x, t.clientY - tapStart.y) < 12;
    const now = performance.now();
    const quick = isTap && now - lastTapEnd < 350;
    if (isTap) lastTapEnd = now;
    if (!e.cancelable) return;
    if (quick) {
      e.preventDefault();
      const btn = target.closest("button, a");
      // 隅のボタンは pointerdown で受け付け済み。ここで click を送ると、支援技術の click（detail=0）と
      // 見分けがつかず二重の押下になるので送らない
      if (btn && !btn.disabled && !btn.classList.contains("corner")) btn.click();
    }
  }, { passive: false });

  // ===== テスト用公開 API =====
  window.PikattoGame = Object.freeze({
    getState() {
      // 平らな形で返す（テストが state.phase・state.scores で直接触れるように）。
      // 入れ子の gameState キーも残し、画面の既存の読み方と両立させる
      const g = gameState ? JSON.parse(JSON.stringify(gameState)) : null;
      return Object.assign({}, g || {}, { screen, selectedPlayers, bestSolo, gameState: g, ready, paused });
    },
    startRound() { if (screen === "play") startRound(); },
    // 「よーい」と待ち時間を両方飛ばして即 armed（ready・waiting のどちらでも効く）
    forceSignal() {
      if (screen !== "play" || !gameState || paused || gameState.phase !== "waiting") return false;
      clearRoundTimers();
      ready = false;
      fireSignal();
      return true;
    },
    // 受付の窓を通さず直接ロジックへ（勝ち負けのテスト用）。よーい・一時停止中は false
    pressFor(playerIdx, ts) {
      if (screen !== "play") return false;
      const t = typeof ts === "number" && Number.isFinite(ts) ? ts : performance.now();
      return handlePress({ playerIdx: Number(playerIdx), pressedAt: t });
    },
    reset() {
      clearRoundTimers();
      clearFinalTimer();
      if (input) { input.reset(); input.detach(); input = null; }
      gameState = null;
      ready = false;
      paused = false;
      bestUpdated = false;
      screen = "setup";
      el.play.hidden = true;
      el.setup.hidden = false;
      el.field.dataset.phase = "waiting";
      signalOff();
      clearLit();
      el.hint.textContent = "";
      selectPlayers(2);
      hideOverlay();
    }
  });

  // 初回だけ遊び方を出す
  if (!helpSeen()) {
    // 画面を表示したあとに出す（起動直後に見えるカードが先に重ならないように）
    setTimeout(() => { if (screen === "setup" && el.overlay.hidden) showHelpCard(); }, 100);
  }
})();

// オフラインでも遊べるようにする（https か localhost のときだけ有効）
if ("serviceWorker" in navigator && window.isSecureContext && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("../../sw.js").catch(() => { /* 登録できなくてもゲームは遊べる */ });
  });
}
</script>
</body>
</html>
