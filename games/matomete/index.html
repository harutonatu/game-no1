<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆびあそび">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<!-- 表示名は main.js が MatometeLogic.NAME で上書きする（ここに書く文字は控え） -->
<title>まとめてポン</title>
<!-- デバッグ表示（?debug=1 のときだけ動く。読めなくてもゲームは動く） -->
<script src="../../common/debug.js"></script>
<style>
  /* 配置：縦向きは上から「← メニュー / 名前 / ？ ♪」・点数・盤（10×20）・ヒント・「1手もどす」「さいしょから」。
     横向きで背が低い（高さ 500px 以下）ときは、左の縦列に上の帯・点数・ヒント・ボタン、右に盤（盤の向きは変えない） */
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #9aa1b8;
    --hint: #c9cee0;
    --accent: #f0a43a;
    --accent-ink: #231705;
    --gold: #ffe08a;
    --font-display: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --font-text: "Hiragino Sans", system-ui, sans-serif;
    --head-h: 44px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  html, body { height: 100%; }
  /* ダブルタップ拡大・ピンチ拡大を止める（iOS Safari は user-scalable=no を無視するため CSS と JS の両方で防ぐ） */
  html { overscroll-behavior: none; touch-action: manipulation; }
  body {
    margin: 0;
    font-size: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    padding-top: max(8px, env(safe-area-inset-top, 0px));
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto auto minmax(0, 1fr) auto auto;
    grid-template-areas: "head" "stats" "play" "hint" "tools";
    gap: 6px;
    max-width: 820px;
    margin: 0 auto;
  }

  /* ===== 上の帯 ===== */
  .head {
    grid-area: head;
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 8px;
    min-width: 0;
    min-height: var(--head-h);
  }
  .back {
    position: relative;
    z-index: 30;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 16px var(--font-text);
    text-decoration: none;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .back:active { filter: brightness(1.3); }
  h1.title { margin: 0; min-width: 0; font-size: 16px; line-height: 1.2; letter-spacing: 0.04em; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .stat .mode[data-mode="hard"] { color: #ffb4a0; }
  .stat .mode[data-mode="easy"] { color: #9fe0c4; }
  .head-tools { display: flex; gap: 6px; }
  .tool {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: 700 18px var(--font-display);
    padding: 0 8px;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool:active:not(:disabled) { filter: brightness(1.3); background: var(--panel); }
  #soundBtn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== 点数 ===== */
  .stats {
    grid-area: stats;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1.35fr) minmax(0, 0.75fr);
    gap: 6px;
    min-width: 0;
  }
  .stat {
    min-width: 0;
    box-sizing: border-box;
    padding: 3px 6px 4px;
    border-radius: 10px;
    background: var(--panel);
    box-shadow: 0 0 0 1px var(--line);
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.15;
    overflow: hidden;
  }
  .stat .lbl { font: 700 12px/1.2 var(--font-text); color: var(--muted); white-space: nowrap; }
  .stat b { display: block; max-width: 100%; font: 800 20px/1.15 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .stat b[data-size="m"] { font-size: 17px; }
  .stat b[data-size="l"] { font-size: 14px; }
  #score { transition: color 0.2s; }
  #score[data-over-best="1"] { color: var(--gold); }
  #score.bump { animation: bump 0.28s ease-out; }
  @keyframes bump { 0% { transform: scale(1); } 40% { transform: scale(1.18); } 100% { transform: scale(1); } }

  /* ===== 盤 ===== */
  .play {
    grid-area: play;
    position: relative;
    min-height: 0;
    min-width: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    touch-action: manipulation;
  }
  .board {
    position: relative;
    flex: 0 0 auto;
    width: 200px;
    height: 400px;
    border-radius: 8px;
    background: var(--well);
    box-shadow: 0 0 0 2px var(--line), 0 8px 24px rgba(0, 0, 0, 0.35);
    touch-action: manipulation;
    outline: none;
  }
  .board:focus-visible { box-shadow: 0 0 0 3px var(--accent), 0 8px 24px rgba(0, 0, 0, 0.35); }
  .board canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; border-radius: 8px; }
  /* 札「n こ ＋p てん」：選んだかたまりの上（盤の上端で余裕が無ければ下）に、小さく出る（まわりのマスをなるべく隠さない） */
  .tag {
    position: absolute;
    z-index: 5;
    left: 0; top: 0;
    box-sizing: border-box;
    padding: 1px 5px;
    border-radius: 999px;
    background: #fff;
    color: #1b1f2e;
    font: 800 12px/1.25 var(--font-display);
    letter-spacing: -0.02em;
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 0 0 2px var(--accent), 0 4px 12px rgba(0, 0, 0, 0.45);
    font-variant-numeric: tabular-nums;
  }
  .tag::after {
    content: "";
    position: absolute;
    left: var(--arrow, 50%);
    bottom: -4px;
    width: 8px; height: 8px;
    margin-left: -4px;
    background: #fff;
    transform: rotate(45deg);
    box-shadow: 2px 2px 0 0 var(--accent);
  }
  .tag[data-below="1"]::after { bottom: auto; top: -4px; box-shadow: -2px -2px 0 0 var(--accent); }
  .tag .pts { color: #b45f00; }
  .tag[data-zero="1"] .pts { color: #6b7088; }
  /* 5こ以上（§10）：まわりも消える札。だいだいの地に「まわりも ポン！」（広いときは「ひろがる！」） */
  .tag[data-blast] { background: #ffe1b0; box-shadow: 0 0 0 2px #ff8a3d, 0 4px 12px rgba(0, 0, 0, 0.45); }
  .tag[data-blast]::after { background: #ffe1b0; box-shadow: 2px 2px 0 0 #ff8a3d; }
  .tag[data-blast][data-below="1"]::after { box-shadow: -2px -2px 0 0 #ff8a3d; }
  .tag .kick { color: #c2410c; }
  .tag[data-blast] { padding: 1px 4px; letter-spacing: -0.04em; }
  .tag[data-blast="2"] { background: #fff2a8; box-shadow: 0 0 0 2px #ff5a1f, 0 0 10px rgba(255, 170, 60, 0.8); }
  .tag[data-blast="2"] .kick { color: #d1290b; }

  /* れんぞく（§10）：盤の上のふちにまたがせて小さく（盤にかかるのは札の高さの半分。一番上の段をなるべく隠さない。MT-16）。5こ以上を続けて消している間だけ出る */
  .streak {
    position: absolute;
    z-index: 6;
    left: 50%; top: 0;
    transform: translate(-50%, -50%);
    box-sizing: border-box;
    padding: 1px 8px;
    border-radius: 999px;
    background: rgba(13, 17, 29, 0.82);
    color: var(--gold);
    font: 800 12px/1.2 var(--font-display);
    white-space: nowrap;
    pointer-events: none;
    box-shadow: 0 0 0 1px #ff8a3d;
  }
  .streak[data-wide="1"] { color: #fff; background: rgba(209, 41, 11, 0.85); box-shadow: 0 0 0 1px #ffd27a, 0 0 10px rgba(255, 138, 61, 0.7); }
  /* 「れんぞく 2」「ひろがる！」の大きな文字（盤の真ん中。transform と opacity だけで動かす） */
  .burst {
    position: absolute;
    z-index: 7;
    left: 50%; top: 38%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    white-space: nowrap;
    font: 900 30px/1.1 var(--font-display);
    color: #fff;
    letter-spacing: 0.04em;
    text-shadow: 0 3px 0 #b45f00, 0 0 14px rgba(240, 164, 58, 0.85);
  }
  .burst[data-kind="wide"] { font-size: clamp(34px, 11vw, 52px); color: #fff6c2; text-shadow: 0 3px 0 #c2410c, 0 0 18px rgba(255, 90, 31, 0.9); }
  .burst.go { animation: burstIn 0.9s cubic-bezier(.2, 1.5, .4, 1) both; }
  .burst[data-calm="1"].go { animation: none; }
  @keyframes burstIn {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.35); }
    22% { opacity: 1; transform: translate(-50%, -50%) scale(1.12); }
    34% { transform: translate(-50%, -50%) scale(1); }
    78% { opacity: 1; transform: translate(-50%, -58%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -70%) scale(0.96); }
  }

  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

  /* 全部消しのお祝い */
  .banner {
    position: fixed;
    left: 50%; top: 42%;
    z-index: 16;
    transform: translate(-50%, -50%);
    text-align: center;
    pointer-events: none;
    white-space: nowrap;
  }
  .banner .big { display: block; font: 900 clamp(30px, 10vw, 56px)/1.1 var(--font-display); color: #fff; letter-spacing: 0.04em; text-shadow: 0 3px 0 #b45f00, 0 0 18px rgba(240, 164, 58, 0.8); }
  .banner .bonus { display: block; margin-top: 4px; font: 900 clamp(26px, 8vw, 44px)/1.1 var(--font-display); color: var(--gold); text-shadow: 0 2px 0 #6a3b00, 0 0 12px rgba(0, 0, 0, 0.6); }
  .banner.go { animation: bannerIn 0.5s cubic-bezier(.2, 1.6, .4, 1) both; }
  .banner.go .bonus { animation: bonusIn 0.5s 0.18s cubic-bezier(.2, 1.6, .4, 1) both; }
  .banner[data-calm="1"].go, .banner[data-calm="1"].go .bonus { animation: none; }
  @keyframes bannerIn { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  @keyframes bonusIn { 0% { opacity: 0; transform: scale(0.3); } 100% { opacity: 1; transform: scale(1); } }

  /* ヒント：2行分の高さに固定し、文言が変わっても配置が動かない */
  .hint {
    grid-area: hint;
    box-sizing: border-box;
    margin: 0;
    height: 2.8em;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--hint);
    font: 14px/1.4 var(--font-text);
    word-break: keep-all;      /* 行は ことばの間（空白）で折る（「ポ／ン！」のように切らない） */
    overflow-wrap: anywhere;
  }
  .tools { grid-area: tools; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools .cta {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    padding: 6px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 16px/1.2 var(--font-text);
    touch-action: manipulation;
    white-space: nowrap;
  }
  .tools .cta:active:not(:disabled) { filter: brightness(1.3); }
  .tools .cta:disabled { opacity: 0.4; }

  /* 背の低い縦画面（iPhone SE など）：すき間を詰めて盤を大きく */
  @media (orientation: portrait) and (max-height: 620px) {
    .app { gap: 5px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    .stat { padding: 2px 6px 3px; }
    .stat .lbl { font-size: 12px; line-height: 1.1; }
    .stat b { font-size: 18px; line-height: 1.1; }
    .stat b[data-size="m"] { font-size: 15px; }
    .stat b[data-size="l"] { font-size: 13px; }
    .hint { font-size: 13px; line-height: 1.3; height: 2.6em; }
  }
  @media (max-width: 360px) {
    .back { padding: 0 8px; }
    h1.title { font-size: 13px; letter-spacing: 0; }
  }

  /* 横向きで背が低い：左の縦列に上の帯・点数・ヒント・ボタン、右に盤（盤は縦のまま。マスは小さくなる） */
  @media (orientation: landscape) and (max-height: 500px) {
    .app {
      max-width: none;
      gap: 6px 12px;
      padding-top: max(6px, env(safe-area-inset-top, 0px));
      padding-bottom: max(6px, env(safe-area-inset-bottom, 0px));
      /* 左の列は 340px まで、盤の列は盤の幅だけ。2つまとめて真ん中へ（盤が右端に細く寄らない） */
      grid-template-columns: minmax(0, 340px) auto;
      justify-content: center;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      grid-template-areas: "head play" "stats play" "hint play" "tools play";
    }
    .hint { height: auto; min-height: 2.8em; font-size: 13px; }
    .tools .cta { font-size: 15px; padding: 4px 6px; }
  }

  /* ===== オーバーレイ（遊び方・終わり・やりなおしの確認） ===== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-top: calc(max(8px, env(safe-area-inset-top, 0px)) + var(--head-h) + 10px);
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background: rgba(13, 17, 29, 0.78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .card {
    width: min(400px, 100%);
    box-sizing: border-box;
    margin: auto;
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card h2 { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: 0.04em; overflow-wrap: anywhere; }
  .card p { margin: 0; color: var(--ink); font: 16px/1.6 var(--font-text); word-break: keep-all; overflow-wrap: anywhere; }
  .card p.sub { margin-top: -8px; color: var(--hint); font-size: 15px; }
  .card p.note-best { color: var(--muted); font-size: 14px; }
  .card p.least { color: var(--hint); font-size: 14px; line-height: 1.45; }
  .card p.note { color: var(--muted); font-size: 14px; }
  .card p.best-new { color: var(--accent); font-weight: 700; }
  .card p.big { font: 900 40px/1.15 var(--font-display); color: var(--gold); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .card p.big small { font-size: 18px; color: var(--ink); margin-left: 4px; }
  .card ol.rules { margin: 0; padding-left: 1.4em; text-align: left; font: 16px/1.55 var(--font-text); display: flex; flex-direction: column; gap: 4px; word-break: keep-all; overflow-wrap: anywhere; }
  .card ol.rules b { color: var(--accent); }
  .card .btns { display: flex; flex-direction: column; gap: 10px; }
  /* 閉じるボタンは、カードが長くても画面の下に見えたままにする（スクロールしなくても押せる） */
  .card .btns { position: sticky; bottom: 0; z-index: 1; background: var(--panel); padding-top: 6px; margin-bottom: -6px; padding-bottom: 6px; }
  .card .btns button {
    box-sizing: border-box;
    width: 100%;
    min-width: 44px;
    min-height: 50px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #343c5a;
    color: #ffffff;
    border-color: #4a5478;
    font: 700 16px/1.3 var(--font-text);
    touch-action: manipulation;
  }
  /* ボタンが4つ以上（終わりのカード・さいしょからの確認）は 2 列に並べる（カードの中身が帯に隠れないように） */
  .card .btns:has(> :nth-child(4)) { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card .btns:has(> :nth-child(4)) button { word-break: keep-all; padding: 6px 8px; }
  .card .btns:has(> :nth-child(4)) button:first-child:nth-last-child(odd) { grid-column: 1 / -1; }
  .card .btns button:first-child { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .card .btns button:active:not(:disabled) { filter: brightness(1.2); }
  /* 出た直後の押せない間（0.6 秒）は、どのボタンも同じ見た目（1つだけ暗く見えない） */
  .card .btns button[aria-disabled="true"], .card .btns button[aria-disabled="true"]:first-child { background: var(--bg); color: var(--muted); border-color: var(--line); }
  @media (orientation: landscape) and (max-height: 500px) {
    /* 横向き：カードは「← メニュー」の右に置く（上の帯の高さぶん下げない。背の低い画面でも文が帯に隠れない） */
    .overlay { padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); padding-left: calc(max(12px, env(safe-area-inset-left, 0px)) + 118px); }
    .card { width: min(540px, 100%); padding: 10px 16px; gap: 6px; }
    .card h2 { font-size: 20px; }
    .card ol.rules, .card p { font-size: 15px; line-height: 1.45; }
    .card ol.rules { font-size: 14px; line-height: 1.4; gap: 2px; }
    .card p.sub { margin-top: -4px; font-size: 14px; }
    .card p.least, .card p.note-best { font-size: 13px; }
    .card p.big { font-size: 28px; }
    .card p.note { display: none; }
    .card .btns { flex-direction: row; }
    .card .btns button { min-height: 44px; padding: 4px 4px; font-size: 14px; white-space: nowrap; }
    /* ボタンが4つ以上（さいしょからの確認）のときは 2 列に並べる */
    .card .btns:has(> :nth-child(4)) { display: grid; grid-template-columns: 1fr 1fr; }
    /* 終わりのカード：4つのボタンを1列に（カードの中身が帯に隠れにくい） */
    .card .btns.row4 { display: flex; flex-direction: row; }
    .card .btns.row4 button { flex: 1 1 0; min-width: 0; white-space: normal; line-height: 1.2; }
  }
  /* 横向きでとても背が低い（568×270 など）：終わりのカードは 2 段組（左に見出し・点数、右にベスト・のこり）にして、スクロールなしで収める（MT-13） */
  @media (orientation: landscape) and (max-height: 300px) {
    .card:has(> .btns.row4) { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); grid-auto-flow: row dense; align-items: center; column-gap: 12px; row-gap: 4px; padding-top: 6px; padding-bottom: 6px; }
    .card:has(> .btns.row4) > h2, .card:has(> .btns.row4) > p.sub, .card:has(> .btns.row4) > p.big { grid-column: 1; }
    .card:has(> .btns.row4) > p:not(.sub):not(.big) { grid-column: 2; text-align: left; }
    .card:has(> .btns.row4) > .btns { grid-column: 1 / -1; }
  }

  /* 背の低い縦画面：カードを詰めて、遊び方がスクロールなしで収まるように */
  @media (orientation: portrait) and (max-height: 620px) {
    .card { padding: 14px 16px; gap: 10px; }
    .card h2 { font-size: 21px; }
    .card ol.rules { font-size: 15px; line-height: 1.5; }
    .card p.note { display: none; }
  }
  /* 縦でとても背が低い（SE の Safari 320×454 など）：終わりのカードの字とすき間を詰めて、スクロールなしで収める（MT-18） */
  @media (orientation: portrait) and (max-height: 500px) {
    .card:has(> .btns.row4) { padding-top: 10px; padding-bottom: 10px; gap: 6px; }
    .card:has(> .btns.row4) h2 { font-size: 20px; }
    .card:has(> .btns.row4) p { font-size: 15px; line-height: 1.35; }
    .card:has(> .btns.row4) p.sub { margin-top: -2px; font-size: 14px; }
    .card:has(> .btns.row4) p.least, .card:has(> .btns.row4) p.note-best { font-size: 13px; }
    .card:has(> .btns.row4) p.big { font-size: 32px; line-height: 1.1; }
    .card:has(> .btns.row4) .btns { gap: 6px; }
    .card:has(> .btns.row4) .btns button { min-height: 44px; padding: 4px 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <a id="back" class="back" href="../../">← メニュー</a>
    <h1 class="title" id="gameTitle">まとめてポン</h1>
    <div class="head-tools">
      <button class="tool" id="helpBtn" type="button" aria-label="あそびかた">？</button>
      <button class="tool" id="soundBtn" type="button" aria-label="効果音" aria-pressed="true">♪</button>
    </div>
  </header>

  <div class="stats" aria-label="てんすう">
    <div class="stat"><span class="lbl">てん</span><b id="score">0</b></div>
    <div class="stat"><span class="lbl mode" id="modeChip" data-mode="normal">ベスト（ふつう）</span><b id="best">0</b></div>
    <div class="stat"><span class="lbl">のこり</span><b id="left">200</b></div>
  </div>

  <section class="play" id="playView" aria-label="プレイ" data-phase="idle">
    <div class="board" id="board" data-cols="10" data-rows="20" tabindex="0" role="application"
         aria-label="ばん。やじるしキーで うごかして、エンターで えらぶ・けす" aria-describedby="cellInfo">
      <canvas id="boardCanvas" aria-hidden="true"></canvas>
      <div class="tag" id="tag" aria-hidden="true" hidden></div>
      <div class="streak" id="streak" aria-hidden="true" hidden></div>
      <div class="burst" id="burst" aria-hidden="true" hidden></div>
    </div>
    <span class="sr" id="cellInfo" aria-live="polite"></span>
  </section>

  <p class="hint" id="hint" role="status" aria-live="polite"></p>
  <div class="tools" id="tools">
    <button class="cta" id="undoBtn" type="button" disabled>1手もどす</button>
    <button class="cta" id="restartBtn" type="button">さいしょから</button>
  </div>
</div>

<canvas class="fx" id="fx" aria-hidden="true"></canvas>
<div class="banner" id="banner" aria-hidden="true" hidden><span class="big">ぜんぶ けし！</span><span class="bonus">＋1000</span></div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="cardTitle" hidden>
  <div class="card" id="card"></div>
</div>

<script src="../../common/sfx.js"></script>
<script src="logic.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="main.js"></script>
</body>
</html>
