<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ゆびあそび">
<meta name="theme-color" content="#1b1f2e">
<link rel="manifest" href="../../manifest.webmanifest">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<title>いろびん</title>
<style>
  /* 土台：CSS は担当B（画面）が書く。契約 docs/irobin-contract.md §6 */
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <a id="back" class="back" href="../../">← メニュー</a>
    <h1 class="title" id="gameTitle">いろびん</h1>
    <span class="level" id="levelBox"><b id="level">1</b><span class="unit">めん</span></span>
    <div class="head-tools">
      <button class="tool" id="helpBtn" type="button" aria-label="あそびかた">？</button>
      <button class="tool" id="soundBtn" type="button" aria-label="効果音" aria-pressed="true">♪</button>
    </div>
  </header>

  <section class="play" id="playView" aria-label="プレイ" data-phase="idle">
    <div class="shop" id="shop" aria-label="おきゃくさん">
      <div class="customer" id="cust0" data-slot="0" data-color="" data-mood="empty">
        <canvas class="animal" aria-hidden="true"></canvas>
        <div class="tray" aria-hidden="true"></div>
        <span class="sr" id="cust0Text"></span>
      </div>
      <div class="customer" id="cust1" data-slot="1" data-color="" data-mood="empty">
        <canvas class="animal" aria-hidden="true"></canvas>
        <div class="tray" aria-hidden="true"></div>
        <span class="sr" id="cust1Text"></span>
      </div>
      <p class="queue" id="queueBox">あと <b id="left">0</b> にん</p>
    </div>
    <div class="board" id="board" role="group" aria-label="びん" data-cols="6"></div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <div class="tools" id="tools">
      <button class="cta" id="undoBtn" type="button" data-cmd="undo" disabled>1手もどす</button>
      <button class="cta" id="restartBtn" type="button" data-cmd="restart">やりなおし</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

<script src="../../common/sfx.js"></script>
<script src="logic.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="main.js"></script>
</body>
</html>
