<!doctype html>
<html lang="ja">
<head>

<meta property="og:description" content="広告なし・登録なし。どうぶつが ほしい いろの いろみずを、びんに あつめて とどける パズル（色水ソート）。">

<!-- 表示名は main.js が IrobinLogic.NAME で上書きする（ここに書く文字は控え） -->
<title>いろびん</title>
<!-- デバッグ表示（?debug=1 のときだけ動く。読めなくてもゲームは動く） -->
<script src="../../common/debug.js"></script>
<style>
  /* 配置：縦向きは上から「← メニュー / 名前と面 / ？ ♪」・お客さん・瓶・ヒント・お助け。
     横向きで背が低い（高さ 500px 以下）ときは、お客さん・ヒント・お助けを左の縦列、瓶を右に置く */
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #9aa1b8;
    --hint: #c9cee0;
    --accent: #f0a43a;
    --accent-ink: #231705;
    --shop: #2b3352;
    --counter: #8a5a35;
    --counter-top: #b47a4a;
    --hidden: #3b4157;
    --font-display: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --font-text: "Hiragino Sans", system-ui, sans-serif;
    --head-h: 44px;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  html, body { height: 100%; }
  /* ダブルタップ拡大・ピンチ拡大を止める（iOS Safari は user-scalable=no を無視するため CSS と JS の両方で防ぐ） */
  html { overscroll-behavior: none; touch-action: manipulation; }
  body {
    margin: 0;
    font-size: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    padding-top: max(8px, env(safe-area-inset-top, 0px));
    padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr);
    gap: 8px;
    max-width: 820px;
    margin: 0 auto;
  }

  /* ===== 上の帯 ===== */
  .head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    grid-template-areas: "back title tools" "back level tools";
    align-items: center;
    column-gap: 8px;
    min-width: 0;
    min-height: var(--head-h);
  }
  /* 面の番号がとても長いときは、番号を下の段にまわす（はみ出さない・字を小さくしすぎない） */
  .head[data-long="1"] { grid-template-areas: "back title tools" "level level level"; row-gap: 2px; }
  .back {
    grid-area: back;
    position: relative;
    z-index: 30;
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0 12px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 16px var(--font-text);
    text-decoration: none;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  .back:active { filter: brightness(1.3); }
  h1.title { grid-area: title; align-self: end; margin: 0; min-width: 0; font-size: 15px; line-height: 1.2; letter-spacing: 0.06em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .level { grid-area: level; align-self: start; min-width: 0; display: flex; align-items: baseline; gap: 4px; white-space: nowrap; line-height: 1.15; }
  .level b { font: 700 20px/1.15 var(--font-display); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 0; }
  .level .unit { font: 700 13px var(--font-text); color: var(--muted); }
  .level[data-size="m"] b { font-size: 16px; }
  .level[data-size="l"] b { font-size: 14px; }
  /* 6〜8 桁：段を増やさず、字とすき間を詰めて 1 段に収める（SE 縦でも。IB-30） */
  .level[data-size="t"] { gap: 2px; }
  .level[data-size="t"] b, .level[data-size="t"] .unit { font-size: 12px; }
  .head:has(> .level[data-size="t"]) { column-gap: 4px; }
  .head[data-long="1"] .level { justify-self: end; }
  .head-tools { grid-area: tools; display: flex; gap: 6px; }
  .tool {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: 700 18px var(--font-display);
    padding: 0 8px;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool:active:not(:disabled) { filter: brightness(1.3); background: var(--panel); }
  #soundBtn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== プレイ画面 ===== */
  .play {
    position: relative;
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "shop" "board" "hint" "tools";
    gap: 6px;
  }

  /* お客さん：カウンターの向こうに2匹。トレイの色と記号が注文 */
  .shop {
    grid-area: shop;
    position: relative;
    box-sizing: border-box;
    height: clamp(84px, 17vh, 150px);
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) auto;
    grid-template-areas: "c0 c1 q";
    column-gap: 6px;
    padding: 4px 8px 0;
    border-radius: 14px;
    background: linear-gradient(180deg, #313a5c 0%, var(--shop) 70%);
    box-shadow: 0 0 0 1px var(--line);
    overflow: hidden;
  }
  /* カウンター（お客さんは帰るとき、この後ろへ下がる） */
  .shop::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 12px;
    background: linear-gradient(180deg, var(--counter-top) 0 3px, var(--counter) 3px);
    z-index: 2;
    pointer-events: none;
  }
  .customer { position: relative; min-width: 0; min-height: 0; }
  #cust0 { grid-area: c0; }
  #cust1 { grid-area: c1; }
  .customer .animal { position: absolute; left: 0; right: 0; top: 0; bottom: 10px; width: 100%; height: calc(100% - 10px); display: block; }
  .customer[data-mood="wait"] .animal { animation: bob 2.8s ease-in-out infinite; transform-origin: 50% 100%; }
  .shop[data-paused="1"] .animal { animation-play-state: paused; }
  .shop[data-calm="1"] .animal { animation: none; }
  @keyframes bob { 0%, 100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(1px) scaleY(0.985); } }
  /* トレイ（注文の色と記号）。両はしに手 */
  .tray {
    position: absolute;
    left: 50%;
    bottom: 6px;
    z-index: 3;
    box-sizing: border-box;
    width: min(64%, 84px);
    height: clamp(18px, 26%, 30px);
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px 6px 10px 10px;
    background: var(--c, transparent);
    box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85), 0 3px 0 rgba(0, 0, 0, 0.25);
  }
  .tray::before, .tray::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 12px; height: 12px;
    margin-top: -6px;
    border-radius: 50%;
    background: var(--fur, #b9824f);
    box-shadow: 0 0 0 1.5px rgba(0, 0, 0, 0.25);
  }
  .tray::before { left: -7px; }
  .tray::after { right: -7px; }
  .tray .mark { height: 78%; width: auto; aspect-ratio: 1; }
  .customer[data-mood="empty"] .tray, .customer[data-color=""] .tray { display: none; }
  /* 最初の2面：トレイが注文だと分かるように、ふちを光らせて指さす（動きを減らす設定では止まる） */
  .shop[data-tip="1"] .tray { animation: trayTip 1.6s ease-in-out infinite; }
  .shop[data-paused="1"] .tray { animation-play-state: paused; }
  .shop[data-calm="1"] .tray { animation: none; }
  @keyframes trayTip {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.85), 0 3px 0 rgba(0, 0, 0, 0.25); }
    50% { box-shadow: 0 0 0 3px #fff, 0 0 14px 4px rgba(255, 255, 255, 0.75), 0 3px 0 rgba(0, 0, 0, 0.25); }
  }
  .queue {
    grid-area: q;
    align-self: center;
    margin: 0 0 10px;
    min-width: 48px;
    text-align: center;
    font: 700 13px/1.35 var(--font-text);
    color: var(--muted);
    white-space: nowrap;
  }
  .queue b { display: block; font: 700 22px/1.1 var(--font-display); color: var(--ink); font-variant-numeric: tabular-nums; }

  /* 瓶を並べる所（列数と大きさは render.js の layout が決める） */
  .board {
    grid-area: board;
    position: relative;
    box-sizing: border-box;
    min-height: 0;
    min-width: 0;
    display: flex;
    flex-wrap: wrap;
    align-content: center;
    justify-content: center;
    column-gap: var(--gap, 10px);
    row-gap: var(--rgap, 12px);
    padding-top: 16px;
    padding-bottom: 4px;
    touch-action: manipulation;
  }
  .bottle {
    position: relative;
    flex: 0 0 auto;
    box-sizing: border-box;
    width: var(--bw, 52px);
    height: var(--bh, 125px);
    min-width: 44px;
    min-height: 44px;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 12px;
    background: transparent;
    color: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.14s ease-out;
  }
  .bottle[data-selected="1"] { transform: translateY(-12px); }
  /* 口のふち */
  .bottle::before {
    content: "";
    position: absolute;
    left: 4%; right: 4%;
    top: 13.5%;
    height: 4px;
    border-radius: 3px;
    background: rgba(214, 224, 255, 0.55);
    z-index: 1;
  }
  .glass {
    position: absolute;
    left: 9%; right: 9%;
    top: 15%; bottom: 1%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column-reverse;
    justify-content: flex-start;
    padding: 0 3px 3px;
    border: 2px solid rgba(214, 224, 255, 0.5);
    border-top: 0;
    border-radius: 4px 4px 42% 42% / 4px 4px 14% 14%;
    background: linear-gradient(90deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0.02) 45%, rgba(255, 255, 255, 0.07));
    overflow: hidden;
    transition: box-shadow 0.2s, border-color 0.2s;
  }
  .seg {
    position: relative;
    flex: 0 0 23%;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--c);
    overflow: hidden;
  }
  /* 液の表面の明るい線と、ガラスの映り込み */
  .seg::after { content: ""; position: absolute; left: 10%; top: 0; bottom: 0; width: 14%; background: rgba(255, 255, 255, 0.18); pointer-events: none; }
  .seg[data-hidden="1"] { background: repeating-linear-gradient(135deg, var(--hidden) 0 6px, #343a50 6px 12px); }
  /* 記号は段の 8 割（SE 縦 Safari・11 本の面でも 12px 以上。IB-21） */
  .seg .mark { height: 80%; width: auto; max-width: 80%; aspect-ratio: 1; flex: 0 0 auto; }
  .qfade { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: var(--hidden); }
  .qfade .qmark { height: 80%; width: auto; max-width: 80%; aspect-ratio: 1; }
  .shine {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55%;
    background: linear-gradient(180deg, transparent, rgba(255, 255, 255, 0.85) 50%, transparent);
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
  }
  .bottle[data-selected="1"] .glass { border-color: #fff; box-shadow: 0 0 0 2px var(--accent), 0 0 14px rgba(240, 164, 58, 0.55); }
  .bottle[data-selected="1"]::before { background: #fff; }
  .bottle[data-sealed="1"] .glass { border-color: rgba(255, 255, 255, 0.9); box-shadow: 0 0 10px var(--seal, transparent); }
  .bottle.glow .glass { border-color: #fff; box-shadow: 0 0 18px 5px var(--seal, #fff), inset 0 0 12px rgba(255, 255, 255, 0.55); }
  .bottle.calm-glow .glass { box-shadow: 0 0 0 3px var(--seal, #fff); }
  .bottle:focus-visible { outline: none; }
  .bottle:focus-visible .glass { outline: 3px solid var(--accent); outline-offset: 3px; }
  /* 栓（木の丸栓） */
  .cork {
    position: absolute;
    left: 27%; right: 27%;
    top: 3%;
    height: 13%;
    border-radius: 5px 5px 3px 3px;
    background: linear-gradient(180deg, #e0ad74, #a86f3c);
    box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18), 0 1px 0 rgba(0, 0, 0, 0.3);
    opacity: 0;
    pointer-events: none;
    z-index: 2;
  }
  .bottle[data-sealed="1"] .cork { opacity: 1; }
  /* 注文を待っている札（トレイと同じ色と記号） */
  .tag {
    position: absolute;
    left: 50%;
    top: -9%;
    z-index: 3;
    box-sizing: border-box;
    width: min(62%, 26px);
    aspect-ratio: 1;
    transform: translateX(-50%);
    display: none;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: var(--c, #888);
    box-shadow: 0 0 0 2px #fff, 0 2px 4px rgba(0, 0, 0, 0.4);
    pointer-events: none;
  }
  .bottle[data-waiting="1"] .tag { display: flex; animation: tagwait 1.8s ease-in-out infinite; }
  .board[data-calm="1"] .bottle[data-waiting="1"] .tag { animation: none; }
  .tag .tagmark { width: 70%; height: 70%; }
  @keyframes tagwait { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-3px); } }

  /* 届けて消えた瓶の跡：置き場所は空いたまま（残りの瓶は動かさない。§17.7） */
  .place-empty { flex: 0 0 auto; width: var(--bw, 52px); height: var(--bh, 125px); min-width: 44px; min-height: 44px; pointer-events: none; }

  /* 布の瓶（§17.4）：中身の代わりに布。縦じわ・結び目・すそのステッチで、色に頼らず分かる */
  .cloth, .clothtag { display: none; }
  .cloth { position: absolute; inset: 0 2% 0; z-index: 4; pointer-events: none; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.35)); transform-origin: 50% 15%; }
  .cloth .clothsvg { display: block; width: 100%; height: 100%; }
  .bottle[data-covered="1"] .cloth { display: block; }
  .bottle .cloth.clothfly { display: block; z-index: 6; }
  .bottle[data-covered="1"]::before, .bottle[data-covered="1"] .glass { visibility: hidden; }
  /* 札「あと N」：白地に濃い字（12px 以上） */
  .bottle[data-covered="1"] .clothtag {
    position: absolute;
    left: 50%;
    top: 56%;
    z-index: 5;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 30px;
    padding: 2px 3px 3px;
    border-radius: 9px;
    background: #fffaf0;
    color: #1b1f2e;
    box-shadow: 0 0 0 1.5px #6b5836, 0 2px 3px rgba(0, 0, 0, 0.35);
    white-space: nowrap;
    pointer-events: none;
    line-height: 1.05;
  }
  .clothtag small { font: 700 12px/1.1 var(--font-text); }
  .clothtag b { font: 700 18px/1.05 var(--font-display); font-variant-numeric: tabular-nums; }
  .clothtag b.open { font: 700 13px/1.2 var(--font-text); letter-spacing: 0; }
  .bottle[data-covered="1"]:focus-visible .cloth { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 10px; }
  /* はじめて布が出た面：布の瓶の札を光らせて指さす（IB-04 のトレイと同じやり方。動きを減らす設定では止まる） */
  .board[data-cloth-tip="1"] .bottle[data-covered="1"] .clothtag { animation: clothTip 1.6s ease-in-out infinite; }
  .board[data-calm="1"] .bottle[data-covered="1"] .clothtag { animation: none; box-shadow: 0 0 0 3px #fff, 0 0 0 1.5px #6b5836; }
  @keyframes clothTip {
    0%, 100% { box-shadow: 0 0 0 1.5px #6b5836, 0 2px 3px rgba(0, 0, 0, 0.35); }
    50% { box-shadow: 0 0 0 3px #fff, 0 0 14px 4px rgba(255, 255, 255, 0.75); }
  }

  /* 布を押したとき：押した札を一瞬ふくらませる（動きを減らす設定では色を変えるだけ） */
  .board .bottle[data-covered="1"] .clothtag.pop { animation: clothPop 0.5s ease-out 1; }
  .board[data-calm="1"] .bottle[data-covered="1"] .clothtag.pop { animation: none; background: #ffd966; }
  @keyframes clothPop {
    0% { transform: translate(-50%, -50%) scale(1); }
    35% { transform: translate(-50%, -50%) scale(1.4); background: #ffd966; }
    100% { transform: translate(-50%, -50%) scale(1); }
  }

  /* ===== v37 の新しい仕掛け（契約 §19.4。IB-29） ===== */
  .gimtag { display: none; }
  /* ちいさい びん（3 段まで）：ガラスを 4 分の 3 の高さにし、段の大きさはふつうの瓶と同じに。首のふちもガラスの上へ */
  .bottle[data-cap="3"] .glass { top: 36%; }
  .bottle[data-cap="3"] .seg { flex-basis: calc(23% * 4 / 3); }
  .bottle[data-cap="3"]::before { top: 34.5%; }
  /* ちいさい びんの常設の札「3」（色に頼らず、形が見えにくい人にも「3 つまで」と分かる。字は 12px 以上） */
  .capbox {
    position: absolute; left: 50%; top: 7%;
    transform: translateX(-50%);
    box-sizing: border-box;
    min-width: 24px; height: 22px; padding: 0 6px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 8px;
    background: #f4ead2; color: #3a2e18;
    font: 800 15px/1 var(--font-display, var(--font-text));
    box-shadow: 0 0 0 1.5px #6b5836, 0 2px 3px rgba(0, 0, 0, 0.4);
  }
  .capbox small { font: 700 12px/1 var(--font-text); margin-left: 1px; }
  /* いろ きまりの びん：ガラスのふちをその色にし、首に その色と記号の札（栓をしたら札は消す） */
  .bottle[data-only] .glass { border-color: var(--only, #fff); border-width: 3px; border-top: 0; }
  .bottle[data-cap="3"] .gimtag, .bottle[data-only] .gimtag, .bottle[data-lock] .gimtag { display: block; position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .onlybox {
    position: absolute; left: 50%; top: 1%;
    transform: translateX(-50%);
    box-sizing: border-box;
    width: min(64%, 26px); aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
    background: var(--c, #888);
    box-shadow: 0 0 0 2px #fff, 0 2px 3px rgba(0, 0, 0, 0.4);
  }
  .onlybox .onlymark { width: 76%; height: 76%; }
  /* かぎの びん：中身は見えたまま少し暗くし、口の上に錠（つる＋鍵の色の箱に記号。中身のマスは隠さない） */
  .bottle[data-lock] .glass { filter: brightness(0.85) saturate(0.9); }
  .lockbox {
    position: absolute; left: 50%; bottom: 84%;
    transform: translateX(-50%);
    width: min(60%, clamp(19px, calc((var(--rgap, 22px) + var(--bh, 200px) * 0.16 - 1px) / 1.24), 26px));   /* 段のすき間（--rgap）と口の上の出っぱり（瓶の 16%）に収まる幅。錠の高さは幅の約 1.24 倍。記号 12px を守るため 19px より小さくしない（IB-45） */
    pointer-events: none;
    display: flex; flex-direction: column; align-items: center;
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
  }
  .lockbox .shackle { display: block; width: 66%; height: auto; margin-bottom: -1px; }
  .lockbody {
    box-sizing: border-box; width: 100%; aspect-ratio: 1.15;
    display: flex; align-items: center; justify-content: center;
    border-radius: 5px;
    background: var(--c, #888);
    box-shadow: 0 0 0 2px #eef1f8;
  }
  .lockbody .lockmark { width: 64%; height: 76%; }
  .lockbox.lockfly { z-index: 6; }
  /* はじめて出た仕掛けの面：その瓶を光らせて指さす（動きを減らす設定では止めて白い縁だけ） */
  .board[data-gim-tip="small"] .bottle[data-cap="3"] .glass { animation: gimTip 1.6s ease-in-out infinite; }
  .board[data-gim-tip="only"] .bottle[data-only] .onlybox,
  .board[data-gim-tip="lock"] .bottle[data-lock] .lockbody { animation: gimTip 1.6s ease-in-out infinite; }
  .board[data-calm="1"][data-gim-tip="small"] .bottle[data-cap="3"] .glass,
  .board[data-calm="1"][data-gim-tip="only"] .bottle[data-only] .onlybox,
  .board[data-calm="1"][data-gim-tip="lock"] .bottle[data-lock] .lockbody { animation: none; box-shadow: 0 0 0 3px #fff; }
  @keyframes gimTip {
    0%, 100% { box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.6); }
    50% { box-shadow: 0 0 0 3px #fff, 0 0 14px 4px rgba(255, 255, 255, 0.75); }
  }
  /* 押しても注げないとき：錠・札を一瞬ふくらませる */
  .board .onlybox.pop { animation: gimPopX 0.5s ease-out 1; }
  .board .lockbox.pop { animation: gimPopX 0.5s ease-out 1; }
  .board[data-calm="1"] .onlybox.pop, .board[data-calm="1"] .lockbox.pop { animation: none; outline: 3px solid #ffd966; }
  @keyframes gimPopX { 0%, 100% { transform: translateX(-50%) scale(1); } 35% { transform: translateX(-50%) scale(1.35); } }

  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

  /* ヒント：2行分の高さに固定し、文言が変わっても配置が動かない */
  .hint {
    grid-area: hint;
    box-sizing: border-box;
    margin: 0;
    height: 2.8em;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--hint);
    font: 15px/1.4 var(--font-text);
    overflow-wrap: anywhere;
  }
  .tools { grid-area: tools; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tools .cta {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    padding: 6px 10px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 16px/1.2 var(--font-text);
    touch-action: manipulation;
    white-space: nowrap;
  }
  .tools .cta:active:not(:disabled) { filter: brightness(1.3); }
  .tools .cta:disabled { opacity: 0.4; }
  /* 詰んだとき：お助けを目立たせる（色だけでなく、枠の太さと小さな揺れでも） */
  .tools .cta[data-attention="1"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 0 3px rgba(240, 164, 58, 0.35); animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  /* 背の低い縦画面（iPhone SE など）：すき間を詰める */
  @media (orientation: portrait) and (max-height: 620px) {
    .app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(8px, env(safe-area-inset-bottom, 0px)); }
    .shop { height: 84px; }
  }
  /* iPad：ヒントの字を少し大きく */
  @media (min-width: 700px) and (min-height: 700px) {
    .hint { font-size: 18px; }
  }
  @media (max-width: 360px) {
    .back { padding: 0 8px; }
  }

  /* 横向きで背が低い：左の縦列にお客さん・ヒント・お助け、右に瓶 */
  @media (orientation: landscape) and (max-height: 500px) {
    .app { gap: 4px; padding-top: max(6px, env(safe-area-inset-top, 0px)); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); max-width: none; }
    /* 横向きは幅に余裕があるので、名前と面を1段に並べる（長い面の番号でも段を増やさず、瓶の高さを守る） */
    .head, .head[data-long="1"] { grid-template-columns: auto auto minmax(0, 1fr) auto; grid-template-areas: "back title level tools"; row-gap: 0; }
    h1.title, .level { align-self: center; }
    .head .level, .head[data-long="1"] .level { justify-self: start; }
    .play {
      grid-template-columns: min(196px, 35vw) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto auto;
      grid-template-areas: "shop board" "hint board" "tools board";
      gap: 6px 10px;
    }
    .shop {
      height: auto;
      min-height: 0;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "c0 c1" "q q";
      padding-bottom: 12px;
    }
    .shop::after { height: 12px; }
    .customer .animal { bottom: 4px; height: calc(100% - 4px); }
    .tray { bottom: 0; }
    .queue { margin: 2px 0 0; display: flex; align-items: baseline; justify-content: center; gap: 4px; position: relative; z-index: 3; }
    .queue b { display: inline; font-size: 16px; }
    .hint { height: 4.2em; font-size: 13px; line-height: 1.4; }
    .tools .cta { font-size: 15px; padding: 4px 6px; }
    .board { padding-top: 16px; }
  }

  /* ===== オーバーレイ（遊び方・面クリア・やりなおしの確認） ===== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-top: calc(max(8px, env(safe-area-inset-top, 0px)) + var(--head-h) + 10px);
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background: rgba(13, 17, 29, 0.78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  .card {
    width: min(400px, 100%);
    box-sizing: border-box;
    margin: auto;
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    text-align: center;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card h2 { margin: 0; font-size: 24px; line-height: 1.3; letter-spacing: 0.04em; overflow-wrap: anywhere; word-break: keep-all; text-wrap: balance; }   /* 見出しは ことばの間（空白）で折る。1〜2 文字だけ次の行に落ちない（IB-25 の UX） */
  .card p { margin: 0; color: var(--ink); font: 16px/1.6 var(--font-text); overflow-wrap: anywhere; }
  .card p.note { color: var(--muted); font-size: 14px; }
  .card p.best-new { color: var(--accent); font-weight: 700; }
  .card p.stars { color: #ffd84d; font-weight: 700; font-size: 20px; letter-spacing: 0.06em; }
  .card ol.rules { margin: 0; padding-left: 1.4em; text-align: left; font: 16px/1.6 var(--font-text); display: flex; flex-direction: column; gap: 4px; }
  .card ol.rules b { color: var(--accent); }
  .card .btns { display: flex; flex-direction: column; gap: 12px; }
  .card .btns button.share { background: transparent; }
  .card .served { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
  .card .served canvas { width: 28px; height: 28px; }
  .card p.next-note { color: var(--ink); font-weight: 700; }
  .card p.best-new.quiet { color: var(--ink); font-weight: 400; font-size: 14px; }
  /* 共有の知らせは場所を取らない吹き出し（.btns の上にかぶせる）。出ても「つぎの めんへ」は動かない */
  .card p.share-note { position: absolute; left: 0; right: 0; bottom: 100%; box-sizing: border-box; max-width: 100%; margin-bottom: 4px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; color: var(--ink); min-height: 0; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; z-index: 2; box-shadow: 0 4px 14px rgba(0,0,0,0.4); }
  .card p.share-note:empty { visibility: hidden; pointer-events: none; }   /* 空のときは見えないだけ（aria-live の読み上げのため display:none にしない） */
  .card p.share-note .url { display: block; overflow-wrap: anywhere; word-break: normal; }
  .card p.moves span { white-space: nowrap; display: inline-block; }
  @media (max-height: 700px) { .card .served { display: none; } }
  /* 閉じるボタンは、カードが長くても画面の下に見えたままにする（スクロールしなくても押せる） */
  .card .btns { position: sticky; bottom: 0; z-index: 1; background: var(--panel); padding-top: 6px; margin-bottom: -6px; padding-bottom: 6px; }
  .card .btns button {
    box-sizing: border-box;
    width: 100%;
    min-width: 44px;
    min-height: 50px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 700 16px/1.3 var(--font-text);
    touch-action: manipulation;
  }
  .card .btns button:first-of-type { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .card .btns button:active:not(:disabled) { filter: brightness(1.2); }
  .card button[aria-disabled="true"] { opacity: 0.5; }
  @media (orientation: landscape) and (max-height: 500px) {
    .overlay { padding-top: calc(max(6px, env(safe-area-inset-top, 0px)) + var(--head-h) + 6px); padding-bottom: max(6px, env(safe-area-inset-bottom, 0px)); }
    /* 横向きで背が低い（SE 横など）：遊び方がスクロールなしで収まるよう、幅を広げ、字とすき間を詰める（13px 以上。IB-19） */
    /* v37：仕掛けの行（4 項目目）が入っても収まるよう、とくに背が低いときだけ 13px（下の 340px 以下。IB-29） */
    .card { width: min(640px, 100%); padding: 6px 16px 6px; gap: 2px; }
    .card h2 { font-size: 17px; line-height: 1.15; }
    .card ol.rules, .card p { font-size: 15px; line-height: 1.5; }
    .card ol.rules { font-size: 14px; line-height: 1.35; gap: 2px; }
    .card p.note { font-size: 13px; line-height: 1.3; }
    /* 1 行目：つぎの めんへ・メニューへ（v39 と同じ横並び）、2 行目：ともだちに おしえる（幅いっぱい）。行の間 12px */
    .card .btns { flex-direction: row; flex-wrap: wrap; gap: 12px; }
    .card .btns button { flex: 1 1 calc(50% - 6px); width: auto; }
    .card .btns button.share { flex: 1 1 100%; white-space: nowrap; }
    .card .btns button { min-height: 44px; }
  }
  /* 横でとくに背が低い（SE 横の 320px など）ときだけ 13px・すき間 1px に詰めて、仕掛けの行が入っても収める */
  @media (orientation: landscape) and (max-height: 340px) {
    .card ol.rules { font-size: 13px; line-height: 1.3; gap: 1px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <a id="back" class="back" href="../../">← メニュー</a>
    <h1 class="title" id="gameTitle">いろびん</h1>
    <span class="level" id="levelBox"><b id="level">1</b><span class="unit">めん</span></span>
    <div class="head-tools">
      <button class="tool" id="helpBtn" type="button" aria-label="あそびかた">？</button>
      <button class="tool" id="soundBtn" type="button" aria-label="効果音" aria-pressed="true">♪</button>
    </div>
  </header>

  <section class="play" id="playView" aria-label="プレイ" data-phase="idle">
    <div class="shop" id="shop" aria-label="おきゃくさん">
      <div class="customer" id="cust0" data-slot="0" data-color="" data-mood="empty">
        <canvas class="animal" aria-hidden="true"></canvas>
        <div class="tray" aria-hidden="true"></div>
        <span class="sr" id="cust0Text"></span>
      </div>
      <div class="customer" id="cust1" data-slot="1" data-color="" data-mood="empty">
        <canvas class="animal" aria-hidden="true"></canvas>
        <div class="tray" aria-hidden="true"></div>
        <span class="sr" id="cust1Text"></span>
      </div>
      <p class="queue" id="queueBox">あと <b id="left">0</b> にん</p>
    </div>
    <div class="board" id="board" role="group" aria-label="びん" data-cols="6"></div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <div class="tools" id="tools">
      <button class="cta" id="undoBtn" type="button" data-cmd="undo" disabled>1手もどす</button>
      <button class="cta" id="restartBtn" type="button" data-cmd="restart" disabled>やりなおし</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

<script src="../../common/sfx.js"></script>
<script src="../../common/notice.js"></script>
<script src="logic.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="main.js"></script>
</body>
</html>
