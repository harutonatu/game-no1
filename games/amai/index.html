<!-- デバッグ表示（?debug=1 のときだけ動く。読めなくてもゲームは動く） -->
<script src="../../common/debug.js"></script>
<style>
  /* 配置（契約 docs/ari-contract.md §3.1・§3.2）
     縦：上から「← メニュー / 名前 / ？ ♪」・絵（上の数・巣）・案内 1 行・わく 5・箱の格子 4 列・下のボタン 5 つ。
     横（高さ 500px 以下）：上の帯は横いっぱい。その下の左に絵、右に 案内 1 行（あまった高さの下の端）・わく・格子・ボタン。
     箱・わく・ボタンの大きさは、ここの CSS 変数で決める（render.js は読むだけ）。
     奥の箱を何段見せるかは #grid の --backs（2 か 1）。 */
  :root {
    --bg: #1b1f2e;
    --panel: #252c41;
    --well: #0d111d;
    --line: #2f3750;
    --ink: #ece6d6;
    --muted: #9aa1b8;
    --hint: #c9cee0;
    --accent: #f0a43a;
    --accent-ink: #231705;
    --wood: #d9b27c;
    --wood-dark: #b98b55;
    --font-display: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif;
    --font-text: "Hiragino Sans", system-ui, sans-serif;
    --head-h: 44px;
    --side: 16px;
    /* 縦（SE 縦 320×568 の寸法） */
    --slot-h: 56px;
    --slot-gap: 7px;
    --col-gap: 8px;
    --front-h: 56px;
    --back-h: 26px;
    --back-gap: 4px;
    --rest-h: 12px;
    --backs: 2;
    --grid-h: calc(var(--front-h) + var(--backs) * (var(--back-gap) + var(--back-h)) + var(--rest-h));
    --tool-h: 48px;
    --tool-gap: 6px;
    --stack-w: 420px;          /* わく・格子・ボタンの列の幅の上限（大きい画面で間延びしない） */
    --row-gap: 6px;            /* わく・格子・ボタンの間 */
    --hint-h: 20px;            /* 案内 1 行（絵と わくの間。絵に重ねない） */
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
  html, body { height: 100%; }
  /* ダブルタップ拡大・ピンチ拡大を止める（iOS Safari は user-scalable=no を無視するため CSS と JS の両方で防ぐ） */
  html { overscroll-behavior: none; touch-action: manipulation; }
  body {
    margin: 0;
    font-size: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-display);
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    box-sizing: border-box;
    height: 100%;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: max(8px, calc(8px + env(safe-area-inset-bottom, 0px)));
    padding-left: max(var(--side), env(safe-area-inset-left, 0px));
    padding-right: max(var(--side), env(safe-area-inset-right, 0px));
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: var(--head-h) minmax(0, 1fr);
    row-gap: 4px;
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ===== 上の帯 ===== */
  .head {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    column-gap: 6px;
    min-width: 0;
    height: var(--head-h);
  }
  a#back {   /* .box.back（奥の箱）と名前が重なるので、id で書く */
    position: relative;
    z-index: 30;              /* カード（オーバーレイ）より手前。どの画面からもメニューへ戻れる */
    box-sizing: border-box;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 44px;
    min-height: 44px;
    padding: 0 10px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 15px var(--font-text);
    text-decoration: none;
    white-space: nowrap;
    touch-action: manipulation;
    -webkit-touch-callout: none;
  }
  a#back:active { filter: brightness(1.3); }
  /* 名前：16px。入らなければ main.js が 14・13・12px に縮める（2 行にしない） */
  h1.title { margin: 0; min-width: 0; text-align: center; font-size: 16px; line-height: 1.2; letter-spacing: 0; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: clip; }
  .head-tools { display: flex; gap: 4px; }
  .tool {
    box-sizing: border-box;
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font: 700 18px var(--font-display);
    padding: 0;
    touch-action: manipulation;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .tool:active { filter: brightness(1.3); background: var(--panel); }
  #soundBtn[aria-pressed="false"] { color: var(--muted); text-decoration: line-through; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ===== プレイ画面 ===== */
  .play {
    position: relative;
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr) var(--hint-h) var(--slot-h) var(--row-gap) var(--grid-h) var(--row-gap) var(--tool-h);
    grid-template-areas: "pic" "hint" "slots" "." "grid" "." "tools";
    row-gap: 0;
  }

  /* 絵の箱：明るい木の机の板。上の 1 行（面・のこり）、まん中に絵、下のまん中に巣の穴 */
  .picbox {
    grid-area: pic;
    position: relative;
    box-sizing: border-box;
    min-height: 0;
    min-width: 0;
    display: grid;
    grid-template-rows: 18px minmax(0, 1fr) 18px;
    grid-template-columns: minmax(0, 1fr);
    border-radius: 14px;
    background:
      repeating-linear-gradient(90deg, rgba(120, 78, 34, 0.07) 0 2px, transparent 2px 23px),
      linear-gradient(180deg, #e4c18e, var(--wood) 60%, var(--wood-dark));
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.25), 0 0 0 1px var(--line);
    overflow: hidden;
    touch-action: manipulation;
  }
  .hud {
    margin: 0;
    padding: 0 8px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-width: 0;
    font: 700 13px/18px var(--font-text);
    color: #3a2a17;
    white-space: nowrap;
  }
  .hud .level { display: flex; align-items: baseline; gap: 2px; min-width: 0; }
  .hud b { font-variant-numeric: tabular-nums; font-size: 13px; }
  .hud .level[data-size="m"] b { font-size: 12px; }
  .hud .level[data-size="l"] b, .hud .level[data-size="l"] .unit { font-size: 12px; letter-spacing: -0.02em; }
  .hud .leftbox { flex: 0 0 auto; }
  /* ちょうせんの札（ちょうせんの間だけ出す） */
  .hud .chaltag { display: none; flex: 0 0 auto; padding: 0 6px; border-radius: 9px; font: 800 12px/16px var(--font-text); color: #3a2a17; background: #f2c94c; box-shadow: inset 0 0 0 1px rgba(58, 42, 23, 0.35); }
  .play[data-mode="chal"] .hud .chaltag { display: inline-block; }
  canvas.pic {
    grid-row: 2;
    align-self: center;
    justify-self: center;
    display: block;
    max-width: 100%;
    max-height: 100%;
  }
  .nest {
    grid-row: 3;
    justify-self: center;
    align-self: end;
    width: 40px;
    height: 18px;
    border-radius: 20px 20px 4px 4px / 18px 18px 4px 4px;
    background: radial-gradient(ellipse at 50% 85%, #1a0f06 0 45%, #4a2e14 46% 62%, #8a6136 63%);
    box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.25);
  }

  /* わく 5 つ */
  .slots {
    grid-area: slots;
    justify-self: center;
    width: min(100%, var(--stack-w));
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    column-gap: var(--slot-gap);
    touch-action: manipulation;
  }
  .slot {
    position: relative;
    box-sizing: border-box;
    min-width: 44px;
    height: var(--slot-h);
    border-radius: 10px;
    border: 2px dashed rgba(236, 230, 214, 0.28);
    background: rgba(13, 17, 29, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }
  .slot:not([data-color=""]) { border-style: solid; border-color: rgba(236, 230, 214, 0.5); }
  .slot[hidden] { display: none; }
  /* ちょうせん（わく 2 つ）：1 つの大きさは わく 3 つのときと同じにして、まん中に寄せる（幅 = (3 つの幅 × 2 − すき間) ÷ 3） */
  .slots[data-n="2"] { grid-template-columns: repeat(2, minmax(0, 1fr)); width: calc((min(100%, var(--stack-w)) * 2 - var(--slot-gap)) / 3); }

  /* 箱の格子 4 列：手前（押せる）・奥 2 段（見るだけ）・＋N */
  .grid {
    grid-area: grid;
    justify-self: center;
    align-self: start;
    width: min(100%, var(--stack-w));
    height: var(--grid-h);
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    column-gap: var(--col-gap);
    touch-action: manipulation;
  }
  .col {
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: var(--back-gap);
  }
  .box {
    position: relative;
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 8px;
    background: var(--c, #6b5a44);
    color: var(--ink, #fff);   /* 明るい色の箱は濃い字（render の inkFor）。白い箱で数が見えなくなるのを防ぐ */
    font-family: var(--font-display);
  }
  .box.front {
    flex: 0 0 auto;
    height: var(--front-h);
    min-width: 44px;
    min-height: 44px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .box.front:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .box.back { flex: 0 0 auto; height: var(--back-h); opacity: 0.7; }
  .col .rest { flex: 0 0 auto; margin-top: calc(-1 * var(--back-gap)); height: var(--rest-h); font: 700 12px/12px var(--font-text); color: var(--muted); text-align: center; }

  /* 案内：絵と わくの間に 1 行（高さ固定。絵に重ねない。配置は動かない。押す邪魔をしない）。
     長い文言は main.js が字を 12・11px に縮める。少したつと薄くなる（文字は残す）。待っているだけの案内（data-soft）は はじめから うすい */
  .hint {
    grid-area: hint;
    align-self: center;
    justify-self: center;
    position: relative;
    box-sizing: border-box;
    width: min(100%, var(--stack-w));
    height: var(--hint-h);
    margin: 0;
    padding: 0 4px;
    overflow: hidden;
    white-space: nowrap;
    text-align: center;
    color: var(--hint);
    font: 13px/var(--hint-h) var(--font-text);
    pointer-events: none;
    transition: opacity 0.3s;
  }
  /* 11px でも 1 行に入らない長い文言は、2 行に折り返す（箱の高さは同じ。2 行で --hint-h に収まる） */
  .hint[data-wrap="1"] { white-space: normal; font-size: 10px; line-height: calc(var(--hint-h) / 2); }
  .hint:empty { opacity: 0; }
  .hint[data-fade="1"] { opacity: 0.6; }
  .hint[data-soft="1"] { color: var(--muted); opacity: 0.85; }
  .hint[data-warn="1"] { color: #ffe066; font-weight: 700; opacity: 1; }

  canvas.fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 15; }

  /* 下のボタン 5 つ（「めん」は 2026-11-03。字の長い「1手もどす」「やりなおし」を広く、ほかは 44 以上） */
  .tools {
    grid-area: tools;
    justify-self: center;
    align-self: end;
    width: min(100%, var(--stack-w));
    height: var(--tool-h);
    display: grid;
    grid-template-columns: minmax(0, 1.3fr) minmax(0, 1.35fr) minmax(44px, 1fr) minmax(44px, 1fr) minmax(44px, 0.85fr);
    column-gap: var(--tool-gap);
    touch-action: manipulation;
  }
  .tools .cta {
    box-sizing: border-box;
    min-width: 44px;
    min-height: 44px;
    height: var(--tool-h);
    padding: 0 2px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 700 12px/1.2 var(--font-text);
    letter-spacing: 0;
    white-space: nowrap;
    touch-action: manipulation;
  }
  .tools .cta:active:not(:disabled) { filter: brightness(1.3); }
  .tools .cta:disabled { opacity: 0.4; }
  #fastBtn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  /* うごかせないとき：押して意味のある方を目立たせる（色だけでなく、枠の太さと小さな揺れでも） */
  .tools .cta[data-attention="1"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; box-shadow: 0 0 0 3px rgba(240, 164, 58, 0.35); animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

  /* 幅 360px 以下（SE 縦）：名前が入るよう、戻るボタンとすき間を詰める（名前は 12px まで縮む） */
  @media (max-width: 360px) {
    .head { column-gap: 3px; }
    a#back { padding: 0 6px; font-size: 14px; }
    .head-tools { gap: 2px; }
    :root { --tool-gap: 4px; }
    .tools .cta { font-size: 12px; padding: 0; }   /* 字は 12px 以上の決まり。すき間 4・padding 0 で 幅 320 でもはみ出さない（E-1） */
  }
  /* 少し広い画面：字を大きく */
  @media (min-width: 370px) {
    .tools .cta { font-size: 14px; }
  }

  /* 背の低い縦画面（SE の Safari 320×454 など）：奥の箱を 1 段に、わく 52・ボタン 44 */
  @media (orientation: portrait) and (max-height: 520px) {
    :root { --slot-h: 52px; --backs: 1; --tool-h: 44px; }
  }

  /* 横向きで背が低い（SE 横 568×320・Safari 568×270 など）：左に絵、右に わく・格子・ボタン（幅 264） */
  @media (orientation: landscape) and (max-height: 500px) {
    :root {
      --side: 12px;
      --slot-h: 52px; --slot-gap: 6px;
      --col-gap: 8px; --front-h: 52px; --back-h: 24px; --back-gap: 2px; --rest-h: 12px; --backs: 1;
      --tool-h: 44px; --tool-gap: 2px;
      --stack-w: 264px;
    }
    .app { max-width: none; }
    .play {
      grid-template-columns: minmax(0, 1fr) 264px;
      /* 案内は右の列の上のあまり（568×270 で 16px）の下の端に 1 行 */
      grid-template-rows: minmax(0, 1fr) var(--slot-h) var(--row-gap) var(--grid-h) var(--row-gap) var(--tool-h);
      grid-template-areas: "pic hint" "pic slots" "pic ." "pic grid" "pic ." "pic tools";
      column-gap: 12px;
    }
    .tools { align-self: start; grid-template-columns: 60px 64px 44px 44px 44px; }
    .tools .cta { font-size: 12px; padding: 0; }   /* 字は 12px 以上の決まり。ボタン 5 つを幅 264 に入れる（すき間 2・padding 0） */
    .hint { --hint-h: 16px; align-self: end; font-size: 12px; }
  }

  /* iPad：同じ並びで大きく（箱は最大 120×88） */
  @media (min-width: 700px) and (min-height: 700px) {
    :root {
      --head-h: 52px;
      --slot-h: 88px; --slot-gap: 12px;
      --col-gap: 12px; --front-h: 88px; --back-h: 40px; --back-gap: 6px; --rest-h: 16px; --backs: 2;
      --tool-h: 56px; --tool-gap: 12px;
      --stack-w: 648px;
      --row-gap: 8px;
      --hint-h: 28px;
    }
    .grid, .tools { width: min(100%, 516px); }   /* 格子の箱は 120 幅まで（4×120＋3×12） */
    .tools .cta { font-size: 17px; }
    .col .rest { font-size: 14px; line-height: 16px; }
    .hud { font-size: 16px; height: 18px; }
    .hud b { font-size: 16px; }
    .hint { font-size: 16px; }
    h1.title { font-size: 18px; }
  }

  /* ===== オーバーレイ（遊び方・ずかん・クリア・うごかせない・やりなおしの確認） ===== */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 20;
    box-sizing: border-box;
    display: flex;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    padding-top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 8px);
    --ov-pb: max(12px, env(safe-area-inset-bottom, 0px));
    padding-bottom: var(--ov-pb);
    padding-left: max(12px, env(safe-area-inset-left, 0px));
    padding-right: max(12px, env(safe-area-inset-right, 0px));
    background: rgba(13, 17, 29, 0.78);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
  }
  /* うごかせない：盤面（絵・わく）が見えるよう、暗くせず、下に小さなカードを出す */
  .overlay[data-kind="stuck"], .overlay[data-kind="rescue"] { background: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; align-items: flex-end; }
  /* 手詰まりのカードは「待っている色の箱」と盤面を見比べながら読めるように、低く小さくする（v53 のレビュー指摘） */
  .overlay[data-kind="stuck"] .card, .overlay[data-kind="rescue"] .card { margin: 0 auto; padding: 6px 10px; gap: 4px; box-shadow: 0 0 0 2px var(--accent), 0 -8px 30px rgba(0, 0, 0, 0.55); }
  .overlay[data-kind="stuck"] .card h2, .overlay[data-kind="rescue"] .card h2 { font-size: 15px; margin: 0; }
  .overlay[data-kind="stuck"] .card p, .overlay[data-kind="rescue"] .card p { font-size: 13px; line-height: 1.3; margin: 0; }
  .overlay[data-kind="stuck"] .card .btns, .overlay[data-kind="rescue"] .card .btns { margin-top: 0; gap: 6px; }   /* 主ボタンの 1 段が増えたぶん、わくの箱を隠しすぎないよう詰める（2026-11-10 UX L1・技術 L-7） */
  .overlay[data-kind="stuck"] .card .btns button, .overlay[data-kind="rescue"] .card .btns button { min-height: 44px; }
  .card {
    position: relative;
    width: min(420px, 100%);
    box-sizing: border-box;
    margin: auto;
    flex: 0 0 auto;
    background: var(--panel);
    border-radius: 16px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-align: center;
    box-shadow: 0 0 0 1px var(--line), 0 20px 50px rgba(0, 0, 0, 0.5);
  }
  .card h2 { margin: 0; font-size: 22px; line-height: 1.3; letter-spacing: 0.04em; overflow-wrap: anywhere; word-break: keep-all; text-wrap: balance; }
  .card p { margin: 0; color: var(--ink); font: 16px/1.6 var(--font-text); overflow-wrap: anywhere; }
  .card p.note { color: var(--muted); font-size: 14px; }
  .card p.picname { font: 700 30px/1.25 var(--font-display); color: #ffd84d; letter-spacing: 0.04em; word-break: keep-all; overflow-wrap: anywhere; }
  .card p.count { color: var(--muted); font-size: 13px; line-height: 1.4; }
  .card p.clean { margin-top: -4px; color: #ffd84d; font: 700 14px/1.3 var(--font-text); }   /* 1手もどし なし！（ほめる言葉。小さく） */
  .card p.clean.gold { display: flex; align-items: center; justify-content: center; }   /* ちょうせん クリア！（金の花輪の小さな絵つき） */
  .card p.clean.gold .wreath.inline { width: 22px; height: 22px; margin: 0 6px 0 0; }
  .card p.clean.gold .wreath.inline:not(.gold) { margin-right: 2px; }
  .card p.modenote { font-size: 14px; line-height: 1.45; word-break: keep-all; overflow-wrap: anywhere; }   /* 言葉（空白）で折り返す */
  .card p.gnote { word-break: keep-all; }
  .card .btns button.chal { background: transparent; color: #f2c94c; border: 3px solid #f2c94c; font-weight: 800; }   /* ちょうせん：金の色（ふつうは橙） */
  .card ol.rules { margin: 0; padding-left: 1.4em; text-align: left; font: 15px/1.55 var(--font-text); display: flex; flex-direction: column; gap: 4px; }
  .card ol.rules b { color: var(--accent); }
  .card .sample { display: flex; justify-content: center; }
  .card .sample canvas { display: block; width: 72px; height: 72px; image-rendering: pixelated; }
  /* 遊び方：背の低い画面では見本の絵を見出し（縦）・文（横）の となりに並べ、「わかった」をスクロールなしで押せるようにする */
  #card[data-kind="help"] > h2 { grid-area: title; }
  #card[data-kind="help"] > .sample { grid-area: sample; }
  #card[data-kind="help"] > ol.rules { grid-area: rules; }
  #card[data-kind="help"] > .btns { grid-area: btns; }
  .card .clearpic { display: flex; justify-content: center; }
  .card .clearpic canvas { display: block; max-width: 160px; max-height: 120px; image-rendering: pixelated; }
  .card .btns { display: flex; flex-direction: row; flex-wrap: wrap; gap: 10px; }
  .card .btns button { flex: 1 1 100%; }
  .card .btns button.half { flex: 1 1 0; }
  .card .btns button {
    box-sizing: border-box;
    width: 100%;
    min-width: 44px;
    min-height: 50px;
    padding: 8px 12px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    font: 700 16px/1.3 var(--font-text);
    white-space: nowrap;
    touch-action: manipulation;
  }
  .card .btns button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  .card .btns button:active { filter: brightness(1.2); }
  .card button[aria-disabled="true"] { opacity: 0.5; }

  /* クリア：背の低い画面（568×270 など）でボタンが切れないよう、カードの中を縦にスクロール（E-2）。入りきる画面では変わらない */
  #card[data-kind="clear"] { max-height: 100%; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

  /* ずかん・面えらび：カードの中を縦にスクロール。「とじる」はカードの上に固定 */
  #card[data-kind="book"], #card[data-kind="select"] {
    width: min(720px, 100%);
    max-height: 100%;
    margin: 0 auto;
    padding: 0 12px 12px;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    gap: 8px;
  }
  .card .bookhead {
    position: sticky;
    top: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 0 -12px;
    padding: 8px 12px;
    background: var(--panel);
    box-shadow: 0 1px 0 var(--line);
  }
  .card .bookhead h2 { flex: 1 0 auto; white-space: nowrap; font-size: 20px; text-align: left; }
  .card .bookhead .got { flex: 0 1 auto; margin: 0; font-size: 13px; color: var(--muted); }
  .card .bookhead .got .rest { display: inline-block; margin-left: 6px; font-size: 12px; }
  .card .bookhead button {
    flex: 0 0 auto;
    min-width: 76px;
    min-height: 44px;
    border-radius: 12px;
    border: 0;
    background: var(--accent);
    color: var(--accent-ink);
    font: 700 16px var(--font-text);
    touch-action: manipulation;
  }
  .card ul.book { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .card ul.book li { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; padding: 4px 2px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); }
  .card ul.book li canvas { display: block; width: 100%; max-width: 64px; aspect-ratio: 4 / 3; height: auto; object-fit: contain; image-rendering: pixelated; }
  .card ul.book .nm { font: 12px/1.25 var(--font-text); color: var(--ink); word-break: keep-all; overflow-wrap: anywhere; text-align: center; }
  .card ul.book li[data-got="0"] .nm { color: var(--muted); }
  .card ul.book .cnt { font: 700 12px/1.2 var(--font-text); color: #ffd84d; }
  .card ul.book .season { position: absolute; top: 2px; left: 2px; padding: 0 3px; border-radius: 5px; font: 700 12px/1.3 var(--font-text); color: #1b1f2e; background: #f4ead2; }
  .card ul.book .season[data-season="haru"] { background: #ffc6dc; }
  .card ul.book .season[data-season="natsu"] { background: #9fe0ff; }
  .card ul.book .season[data-season="aki"] { background: #ffc58a; }
  .card ul.book .season[data-season="fuyu"] { background: #e8eefc; }
  .card ul.book .nm .w { white-space: nowrap; }
  @media (max-width: 359px) { .card ul.book { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (min-width: 500px) { .card ul.book { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  @media (min-width: 700px) { .card ul.book { grid-template-columns: repeat(8, minmax(0, 1fr)); } }

  /* 花輪：1手もどし なしで クリアした面・絵の印（面えらびとずかん。2026-11-04 に花を大きく）。
     ドット絵の SVG（20×20 マス）：緑の葉の輪の上に、5 枚の花びら＋中心の花を 6 つ。絵文字は使わない。
     絵は main.js の wreathUri(色の表) が作り、--wreath-img に入れる（色を差し替えられる。金の花輪はこの表を変えるだけ） */
  .wreath {
    position: absolute; top: 1px; right: 1px; z-index: 1;
    box-sizing: border-box; width: 34px; height: 34px;
    background: var(--wreath-img, none) center / contain no-repeat;
    image-rendering: pixelated;
    filter: drop-shadow(0 0 1px rgba(13, 17, 29, 0.9)) drop-shadow(0 0 1px rgba(13, 17, 29, 0.9));
    pointer-events: none;
  }
  .wreath.gold { background-image: var(--wreath-gold-img, none); }   /* 金の花輪（ちょうせんで クリア。形は同じで色の表だけ ちがう。両方のときは金をあとに足すので金が上に重なる。z-index を上げると ずかんの見出しの上にはみ出す） */
  .wreath.inline { position: relative; flex: 0 0 auto; display: inline-block; width: 26px; height: 26px; margin: 4px 8px 4px 4px; vertical-align: middle; }
  .card p.wnote { display: flex; align-items: center; }
  /* ふつうと金の両方がある絵：どちらも 28px、ふつうを左へ（金に少し重なってよい。金はあとの要素なので上） */
  li.pair .wreath { width: 28px; height: 28px; }
  li.pair .wreath:not(.gold) { right: 27px; }
  .card ul.levels li .here { position: absolute; top: 2px; left: 2px; padding: 0 4px; border-radius: 5px; font: 700 12px/1.3 var(--font-text); color: var(--accent-ink); background: var(--accent); }

  /* 面えらび：1〜250 面を番号と小さな絵で。選べない面は「？」（押せない）。ベスト＋1 が 251 面より先なら上に「つづき」 */
  .card p.selnote { margin: 0; font-size: 13px; line-height: 1.4; color: var(--muted); text-align: left; overflow-wrap: anywhere; }
  .card p.selnote .best { color: var(--ink); }
  .card ul.levels { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .card ul.levels li { position: relative; min-width: 0; }
  .card ul.levels li.more { grid-column: 1 / -1; }
  .card ul.levels button {
    position: relative; box-sizing: border-box; width: 100%; min-width: 44px; min-height: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    padding: 4px 2px; border-radius: 10px; border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.05); color: var(--ink);
    font: 700 13px/1.2 var(--font-text); touch-action: manipulation;
  }
  .card ul.levels button:active:not(:disabled) { filter: brightness(1.3); }
  .card ul.levels button canvas { display: block; width: 48px; max-width: 100%; height: 36px; object-fit: contain; image-rendering: pixelated; }
  .card ul.levels button .q { display: block; height: 36px; font: 700 22px/36px var(--font-display); color: var(--muted); }
  .card ul.levels button .no { display: block; max-width: 100%; overflow-wrap: anywhere; word-break: break-all; }
  .card ul.levels li[data-open="0"] button { background: transparent; border-style: dashed; color: var(--muted); }
  .card ul.levels li[data-current="1"] button { border: 2px solid var(--accent); }
  .card ul.levels li.more button { flex-direction: row; gap: 8px; min-height: 48px; padding: 6px 10px; background: var(--bg); }
  .card ul.levels li.more .lb { flex: 0 0 auto; color: var(--accent); }
  .card ul.levels li.more .no { font-size: 15px; }
  @media (min-width: 500px) { .card ul.levels { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
  @media (min-width: 700px) { .card ul.levels { grid-template-columns: repeat(8, minmax(0, 1fr)); } }

  /* ともだちに おくる（クリアのカード。いろびんと同じ形の吹き出し） */
  .card .btns { position: relative; }
  .card .btns button.share { background: transparent; }
  /* クリアのカードの 3 段目（［この めんを ちょうせん］か［つぎの めんへ］と［ともだちに おくる］を半分ずつ。2026-11-10）：長い字は 2 行で 50 の高さに入れる */
  .card .btns button.two { white-space: normal; font-size: 14px; line-height: 1.15; padding: 2px 6px; word-break: keep-all; }
  #card[data-kind="clear"] .btns button.half { flex: 1 1 calc(50% - 5px); }   /* 半分のボタンは 1 段に 2 つまで（4 つが 1 段に並ばない） */
  .card p.note.lost { margin-top: -4px; font-size: 13px; line-height: 1.35; }   /* もどしたので きんの わは つかないよ（責めない一言。小さく） */
  .card p.share-note { position: absolute; left: 0; right: 0; bottom: 100%; box-sizing: border-box; max-width: 100%; margin: 0 0 4px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; line-height: 1.45; color: var(--ink); text-align: left; -webkit-user-select: text; user-select: text; -webkit-touch-callout: default; z-index: 2; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); }
  .card p.share-note:empty { visibility: hidden; pointer-events: none; }   /* 空のときは見えないだけ（aria-live の読み上げのため display:none にしない） */
  .card p.share-note .url { display: block; overflow-wrap: anywhere; word-break: normal; -webkit-user-select: text; user-select: text; }

  /* 背の低い縦（SE など） */
  @media (orientation: portrait) and (max-height: 600px) {
    .card { padding: 14px; gap: 8px; }
    .card ol.rules { font-size: 14px; line-height: 1.5; }
    .card .sample canvas { width: 56px; height: 56px; }
    /* クリアのカード：名前が 3 行になる面（8・150・161 面）・もどした ちょうせんでも、全部のボタンがスクロールなしで押せるように詰める */
    #card[data-kind="clear"] { padding: 12px 14px; gap: 6px; }
    #card[data-kind="clear"] p.picname { font-size: 24px; line-height: 1.2; }
    #card[data-kind="clear"] .btns { gap: 6px; }
    #card[data-kind="clear"] .btns button { min-height: 46px; }
    #card[data-kind="help"] { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "sample title" "rules rules" "btns btns"; align-items: center; column-gap: 8px; }
  }
  /* Safari のバー付き（高さ 480 以下の縦）：クリアの絵は盤面にもう出ているので、カードでは省く（全部のボタンを見えるところに） */
  @media (orientation: portrait) and (max-height: 480px) {
    #card[data-kind="clear"] .clearpic { display: none; }
  }
  /* 横向きで背が低い：遊び方がスクロールなしで収まるよう、幅を広げ、字とすき間を詰める */
  @media (orientation: landscape) and (max-height: 500px) {
    .overlay { padding-top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 4px); --ov-pb: max(6px, env(safe-area-inset-bottom, 0px)); }
    .card { width: min(640px, 100%); padding: 8px 16px; gap: 4px; }
    .card h2 { font-size: 17px; line-height: 1.2; }
    .card p { font-size: 14px; line-height: 1.45; }
    .card p.picname { font-size: 22px; }
    .card ol.rules { font-size: 13px; line-height: 1.4; gap: 1px; }
    .card .sample canvas { width: 40px; height: 40px; }
    .card .clearpic canvas { max-height: 64px; }
    .card .btns { gap: 8px; }
    .card .btns button { flex: 1 1 0; min-height: 44px; }
    #card[data-kind="help"] .btns button { flex: 1 1 100%; }
    .card .btns button.share { padding: 2px 6px; white-space: normal; font-size: 14px; line-height: 1.15; word-break: keep-all; }   /* 「ともだちに おくる」を 2 行で 44 の高さに入れる */
    #card[data-kind="clear"] .btns button.half { flex: 1 1 0; }   /* 横向きは 1 段に並べる（背が低いので） */
    #card[data-kind="clear"] .btns button { padding: 2px 6px; white-space: normal; line-height: 1.15; word-break: keep-all; }   /* ボタンが 5 つのとき（［つぎも ちょうせん］など）も字をボタンに収める */
    #card[data-kind="help"] { display: grid; grid-template-columns: auto minmax(0, 1fr); grid-template-areas: "title title" "sample rules" "btns btns"; align-items: center; column-gap: 12px; }
    #card[data-kind="book"], #card[data-kind="select"] { width: 100%; }
    .card .bookhead { padding: 4px 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <a id="back" class="back" href="../../">← メニュー</a>
    <h1 class="title" id="gameTitle">あまいものあつめ</h1>
    <div class="head-tools">
      <button class="tool" id="helpBtn" type="button" aria-label="あそびかた">？</button>
      <button class="tool" id="soundBtn" type="button" aria-label="効果音" aria-pressed="true">♪</button>
    </div>
  </header>

  <section class="play" id="playView" aria-label="プレイ" data-phase="play">
    <div class="picbox" id="picBox">
      <p class="hud"><span class="level" id="levelBox"><b id="level">1</b><span class="unit">めん</span></span>
        <span class="chaltag">ちょうせん</span>
        <span class="leftbox">のこり <b id="left">0</b> こ</span></p>
      <canvas class="pic" id="pic" role="img" aria-label="え"></canvas>
      <div class="nest" id="nest" aria-hidden="true"></div>
    </div>
    <div class="slots" id="slots" role="group" aria-label="わく">
      <div class="slot" data-slot="0" data-color="" data-count="" data-wait="0"><span class="sr"></span></div>
      <div class="slot" data-slot="1" data-color="" data-count="" data-wait="0"><span class="sr"></span></div>
      <div class="slot" data-slot="2" data-color="" data-count="" data-wait="0"><span class="sr"></span></div>
    </div>
    <div class="grid" id="grid" role="group" aria-label="はこ">
      <div class="col" data-col="0" data-rest="0"></div>
      <div class="col" data-col="1" data-rest="0"></div>
      <div class="col" data-col="2" data-rest="0"></div>
      <div class="col" data-col="3" data-rest="0"></div>
    </div>
    <canvas class="fx" id="fx" aria-hidden="true"></canvas>
    <p class="hint" id="hint" role="status" aria-live="polite"></p>
    <div class="tools" id="tools">
      <button class="cta" id="undoBtn" type="button" data-cmd="undo" disabled>1手もどす</button>
      <button class="cta" id="restartBtn" type="button" data-cmd="restart" disabled>やりなおし</button>
      <button class="cta" id="fastBtn" type="button" data-cmd="fast" aria-pressed="false">はやく</button>
      <button class="cta" id="bookBtn" type="button" data-cmd="book">ずかん</button>
      <button class="cta" id="selectBtn" type="button" data-cmd="select" aria-label="めんを えらぶ">めん</button>
    </div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle"></div>
</div>

<script src="../../common/notice.js"></script>
<script src="../../common/sfx.js"></script>
<script src="pictures-a.js"></script>
<script src="pictures-b.js"></script>
<script src="pictures-c.js"></script>
<script src="pictures-d.js"></script>
<script src="pictures-e.js"></script>
<script src="pictures-f.js"></script>
<script src="logic.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="main.js"></script>
</body>
</html>
